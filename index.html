    b.classList.toggle('active', b.getAttribute('onclick').includes(`'${val}'`)));
  _renderBadgeCards();
}

// Builds the full badge list for a player: their earned badges plus a locked entry
// for every card mastery not yet started. Shared by the profile tab and the friend
// modal, which each keep their own filter state and container ids.
function buildBadgeEntries(badges) {
  // Earned badges, tagged with the card they belong to (if any)
  const earned = (badges||[]).map(b => {
    const card = _masteryCardFor(b.name);
    const isMastery = _isMasteryBadge(b.name);
    // Null when a mastery's card can't be resolved (a new card we don't know yet),
    // in which case we can't say how many levels it has.
    const masteryTotal = isMastery && card ? _masteryLevelsFor(card.name) : null;
    const masteryDone  = masteryTotal != null ? Math.max((b.level||0) - 1, 0) : 0;
    return {
      name: card ? card.name : b.name, // mastery badges read as the plain card name
      level: b.level||0, maxLevel: b.maxLevel||0,
      progress: b.progress||0, target: b.target||0,
      masteryTotal, masteryDone,
      atMax: isMastery
        ? (masteryTotal != null && masteryDone >= masteryTotal)
        : (b.target == null && (b.level||0) > 0),
      // Supercell sometimes returns a badge icon URL whose asset 404s — new cards
      // especially (MasteryRonin, Aug 2026). A mastery badge can fall back to the
      // card's own catalog art, which ships with the card itself.
      icon: b.iconUrls?.large || card?.iconUrls?.medium || '',
      fallbackIcon: card?.iconUrls?.medium || '',
      // Classify by the badge name, not by whether the card resolved — an
      // unrecognised new card still belongs under the Card Mastery filter.
      isMastery, cardId: card?.id ?? null, earned: true
    };
  });

  // Card masteries not yet started don't appear in the API response at all,
  // so synthesise a locked entry for every catalog card without an earned badge.
  const masteredIds = new Set(earned.filter(e => e.cardId != null).map(e => e.cardId));
  const locked = allCards
    .filter(c => !masteredIds.has(c.id))
    .map(c => ({
      name: c.name, level: 0, maxLevel: 0, progress: 0, target: 0, atMax: false,
      masteryTotal: _masteryLevelsFor(c.name), masteryDone: 0,
      icon: c.iconUrls?.medium || '', fallbackIcon: '',
      isMastery: true, cardId: c.id, earned: false
    }));

  return [...earned, ...locked];
}

// Fully mastered first, then most mastery levels achieved, then earned before
// locked, then alphabetical. Non-mastery badges fall back to their badge level.
function _badgeCompare(a, b) {
  const progress = x => x.isMastery ? (x.masteryDone||0) : (x.level||0);
  return (b.atMax - a.atMax)
      || (progress(b) - progress(a))
      || (b.earned - a.earned)
      || a.name.localeCompare(b.name);
}

// How close a badge is to its next step, 0-1 (-1: maxed or not started).
// Achievements report real progress toward their next level (BattleWins
// 4781/5000). Masteries don't — the API only says which level is reached, not
// how far the current task is — so they count levels done of the card's total.
function badgeNextShare(x) {
  if (!x.earned || x.atMax) return -1;
  if (x.isMastery) return x.masteryTotal ? x.masteryDone / x.masteryTotal : -1;
  return x.target ? Math.min(x.progress / x.target, 1) : -1;
}
const BADGE_SORT_LABELS = { progress: 'Most progress', next: 'Closest to next level' };
function filterSortBadges(entries, filter, sort = 'progress') {
  let list = entries;
  if (filter === 'mastery') list = list.filter(b => b.isMastery);
  if (filter === 'other')   list = list.filter(b => !b.isMastery);
  return [...list].sort(sort === 'next' ? (a, b) => (badgeNextShare(b) - badgeNextShare(a)) || _badgeCompare(a, b) : _badgeCompare);
}
function badgeSortHTML(setter, active) {
  return `<select onchange="${setter}(this.value)" style="${CLAN_SELECT_STYLE};margin-bottom:12px">
      ${Object.entries(BADGE_SORT_LABELS).map(([v, l]) => `<option value="${v}"${active === v ? ' selected' : ''}>Sort: ${l}</option>`).join('')}
    </select>`;
}

function badgeCountText(list, filter) {
  const earnedCount = list.filter(b => b.earned).length;
  return filter === 'other' ? `${earnedCount} badges` : `${earnedCount} / ${list.length} unlocked`;
}

function badgeFilterBarHTML(barId, setter, active) {
  return `<div class="filter-bar" id="${barId}" style="margin-bottom:12px">
      ${[['all','All'],['mastery','Card Mastery'],['other','Other']].map(([v,label]) =>
        `<button class="filter-btn ${active===v?'active':''}" onclick="${setter}('${v}')">${label}</button>`).join('')}
    </div>`;
}

async function loadBadgesGrid() {
  const grid = document.getElementById('badges-grid');
  if (!grid || !grid.querySelector('.spinner')) return;

  await maybeLoadCards(); // needed to identify which badges are card masteries
  _badgeEntries = buildBadgeEntries(_badgesData);

  if (!_badgeEntries.length) { grid.innerHTML = '<div class="empty-msg">No badge data available from the API.</div>'; return; }

  grid.innerHTML = `
    ${badgeFilterBarHTML('badge-filter-bar', 'setBadgeFilter', _badgeFilter)}
    ${badgeSortHTML('setBadgeSort', _badgeSort)}
    <div id="badge-count" style="font-size:13px;color:var(--muted);margin-bottom:12px"></div>
    <div id="badge-cards-grid"></div>`;
  _renderBadgeCards();
}

function _renderBadgeCards() {
  const container = document.getElementById('badge-cards-grid');
  if (!container) return;
  const list = filterSortBadges(_badgeEntries, _badgeFilter, _badgeSort);
  const countEl = document.getElementById('badge-count');
  if (countEl) countEl.textContent = badgeCountText(list, _badgeFilter);
  container.innerHTML = badgeTilesHTML(list);
}

// Badge icons whose asset is missing from Supercell's CDN: try the card art we
// stashed in data-fallback, and failing that leave an empty slot the same size as
// an icon so the grid stays aligned.
window.badgeImgFallback = function(el) {
  const alt = el.getAttribute('data-fallback');
  if (alt) { el.removeAttribute('data-fallback'); el.src = alt; return; }
  const d = document.createElement('div');
  d.style.cssText = 'width:56px;height:56px;border-radius:8px;background:var(--surface)';
  el.replaceWith(d);
};

function badgeTilesHTML(list) {
  if (!list.length) return '<div class="empty-msg">No badges match this filter.</div>';
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
    ${list.map(b => {
      // Masteries show levels completed out of the card's real total (6 or 9),
      // matching the in-game mastery screen. Other badges keep the API's own
      // progress/target, which are genuine counts for them.
      const pct = b.isMastery
        ? (b.masteryTotal ? Math.min(Math.round(b.masteryDone / b.masteryTotal * 100), 100) : 0)
        : (b.target ? Math.min(Math.round(b.progress/b.target*100), 100) : (b.level > 0 ? 100 : 0));
      const levelLabel = b.isMastery
        ? (b.atMax ? 'MAX'
          : b.earned ? (b.masteryTotal ? `Lvl ${b.masteryDone}/${b.masteryTotal}` : `Lvl ${b.level}`)
          : '')
        : (b.level > 0 ? `Lvl ${b.level}${b.maxLevel ? '/' + b.maxLevel : ''}` : '');
      // Bar for any mastery still climbing, and for other badges with real progress.
      const showBar = b.isMastery ? !b.atMax : !!b.target;
      const nearly = pct >= 90 && showBar;
      return `
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface2);border-radius:8px;padding:10px 6px;${b.earned ? '' : 'opacity:0.35;filter:grayscale(1)'}">
          ${b.icon
            ? `<img src="${b.icon}" ${b.fallbackIcon ? `data-fallback="${esc(b.fallbackIcon)}"` : ''} alt="${esc(b.name)}" style="width:56px;height:56px;object-fit:contain" loading="lazy" decoding="async" onerror="badgeImgFallback(this)">`
            : `<div style="width:56px;height:56px"></div>`}
          <span style="font-size:10px;text-align:center;color:var(--text);line-height:1.2;min-height:24px;display:flex;align-items:center;justify-content:center">${esc(humanizeBadgeName(b.name))}</span>
          ${levelLabel ? `<span style="font-size:9px;color:var(--accent);font-weight:600">${levelLabel}</span>` : ''}
          ${showBar ? `<div class="progress-wrap" style="width:100%;margin-top:2px"><div class="progress-bar" style="width:${pct}%;background:${nearly ? 'var(--green)' : 'var(--accent)'}"></div></div>` : ''}
          ${!b.isMastery && b.target ? `<span style="font-size:9px;color:${nearly ? 'var(--green)' : 'var(--muted)'}">${fmtNum(b.progress)} / ${fmtNum(b.target)}</span>` : ''}
        </div>`;
    }).join('')}
  </div>`;
}

// ── Battles pane ──
// ── Evolution / hero slots ──
// A battle-log deck lists its cards in slot order, and the first three slots are
// the special ones: evolutions, heroes and champions go there. The form a card was
// played in comes from its `evolutionLevel` — 1 = evolution, 2 = hero (3 only shows
// up in Boat Battle defences). No `evolutionLevel` means it was played as the plain
// card, even if the player owns its evolution. Checked Oct 2026: in 8-card decks it
// only ever appears on slots 0–2.
function cardVariant(c) {
  const lvl = c?.evolutionLevel || 0;
  return (lvl & 2) ? 'hero' : (lvl & 1) ? 'evo' : '';
}
function deckVariantsOf(cards) {
  const v = {};
  (cards||[]).forEach(c => { const kind = cardVariant(c); if (kind) v[c.name] = kind; });
  return v;
}
// Evo Knight and Hero Knight make different decks, so the played form is part of
// the key. Cards sort by name so reordering the regular slots doesn't split a deck,
// and a deck with no evolutions or heroes keeps its pre-variant key.
function deckKeyOf(cards) {
  return (cards||[]).map(c => { const v = cardVariant(c); return v ? `${c.name}[${v}]` : c.name; }).sort().join('|');
}

// Deck slots as in game: slot 1 only activates an evolution, slot 2 a hero or
// champion, slot 3 any of the three; the other five are plain. A plain card may
// sit in the first three (2v2 decks do that). items: [{ form: 'evo'|'hero'|'',
// champion }]. With keep, an order that already fits (battle log, currentDeck —
// the player's real slots) stays; otherwise evolution, hero/champion and the
// remaining one go first, in the order given, then the plain cards.
const isChampionCard = name => (allCards.find(c => c.name === name)?.rarity || '').toLowerCase() === 'champion';
function slotOrder(items, keep = true) {
  const special = x => !!(x.form || x.champion);
  const fits = items.every((x, i) => i > 2 ? !special(x)
    : i === 0 ? x.form !== 'hero' && !x.champion
    : i === 1 ? x.form !== 'evo' : true);
  if (keep && fits) return items;
  const rest = items.slice();
  const take = test => { const i = rest.findIndex(test); return i < 0 ? null : rest.splice(i, 1)[0]; };
  const plain = () => take(x => !special(x)) || rest.shift();
  const s1 = take(x => x.form === 'evo') || plain();
  const s2 = take(x => x.form === 'hero' || x.champion) || plain();
  const s3 = take(special) || plain();
  return [s1, s2, s3, ...rest].filter(Boolean);
}
// A deck's card names (with their played forms) in slot order
const deckSlotNames = (names, variants) =>
  slotOrder(names.map(name => ({ name, form: variants?.[name] || '', champion: isChampionCard(name) }))).map(x => x.name);

// name → { medium, evo, hero }. The catalog wins; battle records fill the gaps
// (cards the catalog doesn't know yet).
function buildCardArtMap(battles) {
  const map = {};
  const add = c => {
    if (!c?.name) return;
    const m = map[c.name] || (map[c.name] = {});
    m.medium = m.medium || c.iconUrls?.medium;
    m.evo    = m.evo    || EVO_IMG_OVERRIDE[c.name] || c.iconUrls?.evolutionMedium;
    m.hero   = m.hero   || c.iconUrls?.heroMedium;
  };
  allCards.forEach(add);
  (battles||[]).forEach(b => (b.team||[]).concat(b.opponent||[]).forEach(p => (p.cards||[]).forEach(add)));
  return map;
}

const VARIANT_LABEL = { evo: 'EVO', hero: 'HERO', champ: 'CHAMP' };
const VARIANT_TITLE = { evo: 'Evolved', hero: 'Hero', champ: 'Champion' };
// One deck tile. Evolution / hero art falls back to the plain card art when it
// isn't published yet or 404s — new evolutions often ship before their art.
// Champions get the hero look with a CHAMP tag (they share the hero slots).
function deckTileHTML(name, variant, art, cls) {
  if (!variant && isChampionCard(name)) variant = 'champ';
  const plain = art?.medium || '';
  const src = (variant && art?.[variant]) || plain;
  const title = variant === 'champ' ? name : variant ? `${VARIANT_TITLE[variant]} ${name}` : name;
  const vCls = variant ? ` v-${variant}` : '';
  const tag = variant ? `<span class="variant-tag v-${variant}">${VARIANT_LABEL[variant]}</span>` : '';
  const body = src
    ? `<img src="${src}" alt="${esc(title)}" loading="lazy" decoding="async"${src !== plain && plain ? ` data-fallback="${plain}"` : ''} onerror="deckImgFallback(this)" onload="if(this.naturalWidth<4)deckImgFallback(this)">`
    : `<span class="deck-tile-text">${esc(name)}</span>`;
  return `<div class="${cls} deck-tile${vCls}" title="${esc(title)}">${body}${tag}</div>`;
}
window.deckImgFallback = function(el) {
  const alt = el.getAttribute('data-fallback');
  if (alt) { el.removeAttribute('data-fallback'); el.src = alt; return; }
  const t = document.createElement('span');
  t.className = 'deck-tile-text';
  t.textContent = el.closest('.deck-tile')?.title || el.alt || '';
  el.replaceWith(t);
};

// The Battles tab holds the battle log and the lifetime battle stats, switched
// by a toggle at the top so neither makes the other longer. The choice survives
// re-renders (Refresh, background refresh).
// Both the profile and the friend/clan-member modal have a Battles tab, and both
// can be in the DOM at once, so state and element ids are per scope ('p'
// profile, 'f' modal). The view choice survives re-renders; the filter resets.
const _battleState = {};
function renderBattles(battles, data, scope = 'p') {
  _battleState[scope] = { battles: battles || [], data, filter: 'all', result: '', view: _battleState[scope]?.view || 'log' };
  const v = _battleState[scope].view;
  return `
    <div class="seg" id="${scope}-battle-view-bar">
      <button class="${v === 'log' ? 'active' : ''}" onclick="setBattleView('${scope}','log')">Battle Log</button>
      <button class="${v === 'stats' ? 'active' : ''}" onclick="setBattleView('${scope}','stats')">Battle Stats</button>
    </div>
    <div id="${scope}-battle-view">${battleViewHTML(scope)}</div>`;
}
function battleViewHTML(scope) {
  const st = _battleState[scope];
  if (st.view === 'stats') return st.data ? battleStatsHTML(st.data, st.battles, scope) : '';
  return st.battles.length ? _renderBattleList(scope) : '<div class="empty-msg">No battles found.</div>';
}
window.setBattleView = function(scope, v) {
  const st = _battleState[scope]; if (!st) return;
  st.view = v;
  document.querySelectorAll(`#${scope}-battle-view-bar button`).forEach((b, i) => b.classList.toggle('active', (i === 0) === (v === 'log')));
  const el = document.getElementById(`${scope}-battle-view`);
  if (el) el.innerHTML = battleViewHTML(scope);
};
window.setBattleFilter = function(scope, mode) {
  const st = _battleState[scope]; if (!st) return;
  st.filter = mode;
  const el = document.getElementById(`${scope}-battle-view`);
  if (el) el.innerHTML = _renderBattleList(scope);
};
// Wins / Losses toggle: tap again to show all results
window.setBattleResult = function(scope, r) {
  const st = _battleState[scope]; if (!st) return;
  st.result = st.result === r ? '' : r;
  const el = document.getElementById(`${scope}-battle-view`);
  if (el) el.innerHTML = _renderBattleList(scope);
};

// What the battle log records beyond decks and crowns, as a two-column table
// (your side vs theirs). Towers belong to a side, so they come from its first
// player; the rest is per player, named in 2v2. Rows with no data are left out.
// scope 'f' (someone else's log) labels the sides by name instead of "You"
function battleDetailsHTML(b, team, opp, scope = 'p') {
  const multi = team.length > 1 || opp.length > 1;
  const perPlayer = (players, fn) => players.map(p => {
    const v = fn(p);
    if (v == null || v === '') return '';
    // In 2v2 the name gets its own small line, so a phone has room for the value
    const ell = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    return multi
      ? `<div style="margin-bottom:3px"><div style="${ell};font-size:10px;color:var(--muted)">${esc(p.name||'?')}</div><div style="${ell}">${v}</div></div>`
      : `<div style="${ell}">${v}</div>`;
  }).join('');
  // Destroyed princess towers drop out of the array; null means both fell
  const towers = p => {
    if (!p) return '';
    const left = p.princessTowersHitPoints || [];
    const princess = [...left.map(hp => fmtNum(hp)), ...Array(Math.max(0, 2 - left.length)).fill('💥')].join(' · ');
    return `<div>👑 ${p.kingTowerHitPoints ? fmtNum(p.kingTowerHitPoints) : '💥'}</div><div>🏰 ${princess}</div>`;
  };
  const trophies = p => p.startingTrophies == null ? null : `🏆 ${fmtNum(p.startingTrophies)}${p.trophyChange != null
    ? ` <span class="${p.trophyChange >= 0 ? 'text-green' : 'text-red'}">(${p.trophyChange >= 0 ? '+' : ''}${p.trophyChange})</span>` : ''}`;

  const rows = [];
  const row = (label, mine, theirs) => { if (mine || theirs) rows.push([label, mine || '—', theirs || '—']); };
  const isBoat = !!b.boatBattleSide;
  if (!isBoat) row('Towers left', towers(team[0]), towers(opp[0]));
  row('Elixir leaked', perPlayer(team, p => p.elixirLeaked == null ? null : p.elixirLeaked.toFixed(2)),
                       perPlayer(opp,  p => p.elixirLeaked == null ? null : p.elixirLeaked.toFixed(2)));
  row('Trophies', perPlayer(team, trophies), perPlayer(opp, trophies));
  row('Global rank', perPlayer(team, p => p.globalRank ? `#${fmtNum(p.globalRank)}` : null),
                     perPlayer(opp,  p => p.globalRank ? `#${fmtNum(p.globalRank)}` : null));
  row('Tower troop', perPlayer(team, p => (p.supportCards||[]).map(c => esc(c.name)).join(', ')),
                     perPlayer(opp,  p => (p.supportCards||[]).map(c => esc(c.name)).join(', ')));
  row('Clan', perPlayer(team, p => p.clan?.name ? esc(p.clan.name) : null),
              perPlayer(opp,  p => p.clan?.name ? esc(p.clan.name) : null));

  const boat = isBoat ? `<div style="font-size:12px;margin-bottom:8px;text-align:center">⛵ Boat ${b.boatBattleSide === 'attacker' ? 'attack' : 'defence'} ·
      <span class="${b.boatBattleWon ? 'text-green' : 'text-red'}">${b.boatBattleWon ? 'won' : 'lost'}</span> ·
      ${fmtNum(b.newTowersDestroyed)} tower${b.newTowersDestroyed === 1 ? '' : 's'} destroyed${b.prevTowersDestroyed ? ` (${fmtNum(b.prevTowersDestroyed)} already down)` : ''} ·
      ${fmtNum(b.remainingTowers)} left</div>` : '';
  const tourn = b.tournamentTag ? `<div style="font-size:12px;margin-bottom:8px;text-align:center"><span onclick="openTournament('${esc(b.tournamentTag)}')" style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px">🏆 Open this tournament</span></div>` : '';
  if (!rows.length && !boat && !tourn) return '';
  return `${boat}${tourn}
    <div style="display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px 10px;font-size:12px;align-items:start">
      <div></div>
      <div style="color:#5b9bff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${multi ? (scope === 'p' ? 'Your team' : 'Team') : (scope === 'p' ? 'You' : esc(team[0]?.name || 'Player'))}</div>
      <div style="color:#e9685c;font-weight:600">${multi ? 'Opponents' : 'Opponent'}</div>
      ${rows.map(([label, mine, theirs]) => `
        <div style="color:var(--muted);white-space:nowrap">${label}</div><div style="min-width:0">${mine}</div><div style="min-width:0">${theirs}</div>`).join('')}
    </div>`;
}

const battleResult = b => {
  const t = (b.team || [])[0]?.crowns || 0, o = (b.opponent || [])[0]?.crowns || 0;
  return t > o ? 'win' : t < o ? 'loss' : 'draw';
};
// "Today", "Yesterday", else "Mon 13 Oct" — in the phone's own time zone
function battleDayLabel(ts) {
  const d = parseApiTime(ts), day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(new Date()) - day(d)) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}
function battleDaySummary(list) {
  const n = { win: 0, loss: 0, draw: 0 };
  list.forEach(b => n[battleResult(b)]++);
  const tr = list.filter(b => (b.team || [])[0]?.trophyChange != null);
  const sum = tr.reduce((s, b) => s + b.team[0].trophyChange, 0);
  return `<span class="text-green">${n.win}W</span> <span class="text-red">${n.loss}L</span>${n.draw ? ` <span class="text-muted">${n.draw}D</span>` : ''}`
    + (tr.length ? ` · <span style="color:${sum >= 0 ? 'var(--green)' : 'var(--red)'}">${sum >= 0 ? '+' : ''}${sum} 🏆</span>` : '');
}

function _renderBattleList(scope) {
  const { battles, filter, result } = _battleState[scope];
  const modes = [...new Set(battles.map(b => battleModeLabel(b)))];
  const modeButtons = ['all', ...modes].map(m =>
    `<button class="filter-btn ${filter===m?'active':''}" data-mode="${esc(m)}" onclick="setBattleFilter('${scope}', this.dataset.mode)">${m === 'all' ? 'All Modes' : esc(m)}</button>`
  ).join('');
  const resultButtons = [['win', 'Wins'], ['loss', 'Losses']].map(([r, label]) =>
    `<button class="filter-btn ${result === r ? 'active' : ''}" onclick="setBattleResult('${scope}','${r}')">${label}</button>`).join('');
  const bar = `<div class="filter-bar">${resultButtons}<span class="filter-sep"></span>${modeButtons}</div>`;

  const filtered = battles.filter(b => (filter === 'all' || battleModeLabel(b) === filter) && (!result || battleResult(b) === result));
  if (!filtered.length) return `${bar}<div class="empty-msg">No battles for this filter.</div>`;
  const streakNote = filter === 'all' && !result ? streakNoteHTML(battles, scope) : '';
  // Battles arrive newest-first, so each day's battles are consecutive
  const dayOf = b => b.battleTime ? battleDayLabel(b.battleTime) : '';
  const dayHead = (b, bi) => {
    const day = dayOf(b);
    if (!day || (bi > 0 && dayOf(filtered[bi - 1]) === day)) return '';
    return `<div class="day-head"${bi === 0 ? ' style="margin-top:0"' : ''}><span>${esc(day)}</span><span>${battleDaySummary(filtered.filter(x => dayOf(x) === day))}</span></div>`;
  };

  const art = buildCardArtMap(battles);
  // Average elixir of a battle deck, e.g. "3.4"; '' when the cards carry no costs
  const avgElixirText = cards => {
    const costs = (cards || []).map(c => c.elixirCost).filter(n => n != null);
    return costs.length ? (costs.reduce((a, b) => a + b, 0) / costs.length).toFixed(1) : '';
  };
  const deckRow = (p) => (p.cards||[]).map(c => deckTileHTML(c.name, cardVariant(c), art[c.name], 'deck-card-chip')).join('');
  return bar + streakNote + filtered.map((b, bi) => {
    const teamPlayers = b.team || [];
    const oppPlayers  = b.opponent || [];
    const team = teamPlayers[0] || {};
    const opp  = oppPlayers[0] || {};
    const tCrowns = team.crowns || 0;
    const oCrowns = opp.crowns || 0;
    let resLabel = 'DRAW', resColor = 'var(--muted)';
    if (tCrowns > oCrowns) { resLabel = 'VICTORY'; resColor = '#4a90e2'; }
    else if (tCrowns < oCrowns) { resLabel = 'DEFEAT'; resColor = 'var(--red)'; }
    const trophyChange = team.trophyChange;
    const is2v2 = teamPlayers.length > 1 || oppPlayers.length > 1;

    // Everyone but the log's owner opens their profile when tapped
    const sideNames = (players, color, align) => players.map(p => {
      const tap = p.tag && p.tag !== _battleState[scope].data?.tag;
      return `<div ${tap ? `onclick="viewFriend('${esc(p.tag)}')" title="Open profile" ` : ''}style="color:${color};font-weight:600;font-size:14px;text-align:${align};overflow:hidden;text-overflow:ellipsis;white-space:nowrap${tap ? ';cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px' : ''}">${esc(p.name||'?')}</div>`;
    }).join('');

    // 1v1 → your deck + the opponent's side by side. 2v2 → both teammates, with
    // the opponents' two decks behind a fold-out underneath.
    const teamSet = new Set(teamPlayers);
    const deckPlayers = is2v2 ? teamPlayers : [...teamPlayers, ...oppPlayers];
    const showLabels = deckPlayers.length > 1;
    const deckCol = p => {
      const names = (p.cards||[]).map(c => c.name).join(', ');
      const labelColor = teamSet.has(p) ? '#5b9bff' : '#e9685c';
      return `<div style="flex:1;min-width:0;text-align:center">
        ${showLabels ? `<div style="font-size:11px;color:${labelColor};font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name||'?')}</div>` : ''}
        <div style="display:grid;grid-template-columns:repeat(4,38px);gap:4px;justify-content:center;margin-top:4px">${deckRow(p)}</div>
        <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px">
          ${avgElixirText(p.cards) ? `<span class="text-blue" title="Average elixir cost" style="font-size:12px;font-weight:700;white-space:nowrap">💧 ${avgElixirText(p.cards)}</span>` : ''}
          <button class="btn btn-secondary btn-sm" style="font-size:11px;padding:3px 9px" onclick="copyDeckLink('${esc(names)}',this)">📋 Copy</button>
        </div>
      </div>`;
    };
    const deckCols = deckPlayers.map(deckCol).join('');
    const oppId = `${scope}-battle-${bi}-opp`;
    const showOppDecks = is2v2 && oppPlayers.some(p => (p.cards||[]).length);
    const details = battleDetailsHTML(b, teamPlayers, oppPlayers, scope);
    const foldLabel = showOppDecks ? "Opponents' decks & details" : 'Battle details';
    const oppFold = showOppDecks || details ? `
          <div onclick="toggleCardMax('${oppId}')" style="cursor:pointer;margin-top:10px;padding-top:6px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);text-align:center;user-select:none">
            <span id="${oppId}-toggle" data-closed="▼ ${foldLabel}" data-open="▲ Hide ${foldLabel.toLowerCase()}">▼ ${foldLabel}</span>
          </div>
          <div id="${oppId}-max" style="display:none;margin-top:8px">
            ${showOppDecks ? `<div style="display:flex;gap:12px;margin-bottom:12px">${oppPlayers.map(deckCol).join('')}</div>` : ''}
            ${details}
          </div>` : '';

    return `${dayHead(b, bi)}
      <div class="battle-item" style="padding:0;overflow:hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface2)">
          <span style="font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:${resColor}">${resLabel}</span>
          <span style="font-size:15px;font-weight:700">
            <span style="color:#4a90e2">${tCrowns}</span>
            <span style="color:var(--muted)"> 👑 </span>
            <span style="color:var(--red)">${oCrowns}</span>
          </span>
          <span style="font-size:11px;color:var(--muted)">${esc(battleModeLabel(b))}</span>
        </div>
        <div style="display:flex">
          <div style="flex:1;background:rgba(74,144,226,0.10);padding:10px 12px;min-width:0">${sideNames(teamPlayers, '#5b9bff', 'center')}</div>
          <div style="flex:1;background:rgba(231,76,60,0.10);padding:10px 12px;min-width:0">${sideNames(oppPlayers, '#e9685c', 'center')}</div>
        </div>
        <div style="padding:10px 12px">
          <div style="display:flex;gap:12px">${deckCols}</div>${oppFold}
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)">
            <span>${formatBattleTime(b.battleTime)}</span>
            ${trophyChange != null ? `<span style="color:${trophyChange>=0?'var(--green)':'var(--red)'}">${trophyChange>=0?'+':''}${trophyChange} 🏆</span>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

function battleModeLabel(b) {
  const gm = b.gameMode?.name || '';
  if (GAME_MODE_OVERRIDES[gm]) return GAME_MODE_OVERRIDES[gm];
  if (GAME_MODE_NAMES[gm])     return GAME_MODE_NAMES[gm];
  // Heuristics for any mode not in the table
  if (/Ranked|PathOfLegend/i.test(gm)) return 'Path of Legends';
  if (/TeamVsTeam|2v2|Duo/i.test(gm))  return /Friendly/i.test(gm) ? 'Friendly 2v2' : 'Classic 2v2';
  if (/BoatBattle/i.test(gm))          return 'Boat Battle';
  if (/Duel/i.test(gm))                return 'Duel';
  if (/RiverRace|ClanWar/i.test(gm))   return 'Clan War';
  if (/Ladder|TrophyRoad/i.test(gm))   return 'Trophy Road';
  if (/Showdown/i.test(gm))            return 'Showdown';
  if (/Tournament/i.test(gm))          return 'Tournament';
  if (/Challenge/i.test(gm))           return 'Challenge';
  if (/Friendly/i.test(gm))            return 'Friendly';
  if (gm) return gm.replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2');
  return deckModeLabel(b.type || '');  // last-resort fallback to the coarse type
}

function renderDeckBuilder(battles, data, scope = 'p') {
  battles = battles || [];
  _deckState[scope] = {
    data, battles,
    // Mode filter and sort carry over per scope (a mode the player has no
    // battles in falls back to All in _renderDeckList)
    filter: _deckState[scope]?.filter || 'all',
    sort: _deckState[scope]?.sort || 'played',
    // Prefer the full card catalog (always complete) over icons embedded in
    // individual battle-log records, which are sometimes missing iconUrls.
    art: buildCardArtMap(battles),
    deckMap: buildDeckMapFromBattles(battles, data.tag)
  };
  return `<div id="${scope}-decks">${_renderDeckList(scope)}</div>`;
}

function _renderDeckList(scope) {

  const mine = scope === 'p';
  const inUse1v1 = currentDeckKey(st.data, battles);
  const deck2v2 = latest2v2Deck(battles, st.data.tag);
  const inUse2v2 = deck2v2 ? deckKeyOf(deck2v2) : '';
  const inUseLabel = key => {
    const modes = [key === inUse1v1 && '1v1', key === inUse2v2 && '2v2'].filter(Boolean);
    return modes.length ? `🃏 In use · ${modes.join(' & ')}` : '';
  };
  const modes = [...new Set(battles.map(b => battleModeLabel(b)))];
  // The filter survives re-renders, but not onto an account (or a refreshed
  // battle log) without that mode — it would have no button to clear it.
  if (st.filter !== 'all' && !modes.includes(st.filter)) st.filter = 'all';
  // The equipped 1v1 deck shows even before this device has seen a game with it
  const equipped = inUse1v1 && !deckMap[inUse1v1] ? equippedDeckEntry(st.data, battles, inUse1v1) : null;
  const entries = Object.values(deckMap).concat(equipped ? [equipped] : []);
  let filtered = entries;
  if (st.filter !== 'all') filtered = entries.filter(d => d.modes.includes(st.filter));
  filtered.sort(DECK_SORTS[st.sort] ? DECK_SORTS[st.sort] : DECK_SORTS.played);
  // Most played (the default) keeps the decks in use on top

  const sortSel = `<select onchange="setDeckSort('${scope}', this.value)" style="${CLAN_SELECT_STYLE};margin-bottom:10px">

  const modeButtons = ['all', ...modes].map(m =>

  ).join('');

  if (!entries.length) return `<div class="empty-msg">No battle data to build decks from.</div>`;

      <div class="deck-item"${inUse ? ' style="border-color:var(--accent)"' : ''}>

        </div>` : ''}

            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">${cardChips}</div>
          </div>
          <div style="flex:1;min-width:0">
            ${d.unplayed ? `
            ${statRow('Avg Elixir', avgElixir, 'text-blue')}
            <div style="font-size:12px;color:var(--muted);text-align:center;line-height:1.4;margin-top:6px">No games with it yet on this device — wins and losses show up once ${mine ? 'you play' : 'they play'} it.</div>` : `
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px">
              ${statRow('Wins', d.wins, 'text-green')}

  return `${sortSel}<div class="filter-bar">${modeButtons}</div>${items}`;

// Best win rate puts decks with 3+ games first — a 1-0 deck isn't the best one
const DECK_SORT_LABELS = { played: 'Most played', winrate: 'Best win rate', recent: 'Recently played' };
const deckGames = d => d.wins + d.losses + d.draws;
const DECK_SORTS = {

  winrate: (a, b) => ((deckGames(b) >= 3) - (deckGames(a) >= 3))

window.toggleSavedDeck = function(key) {

  _metaParsed = {

    decks: m.decks.map(([key, n, w, dr, players, three, dealt, taken, leak, hn, troops, bands, exp, close]) => {
      const cards = metaDeckCards(key);
      return { key, n, w, draws: dr || 0, players, three: three || 0, cards, rate: w / Math.max(n, 1),
               // [expected wins from the rating gaps, games with both ratings] and
               // [won by one crown, lost by one crown, lost to three] — from 29 Oct 2026
               exp: exp?.[1] ? { e: exp[0], n: exp[1] } : null, close: close || null,
               dealt: dealt ?? null, taken: taken ?? null, leak: leak ?? null, hn: hn || 0,
               troops: (troops || []).map(([id, tn, tw, tt]) => ({ id, n: tn, w: tw, three: tt })), bands: metaBands(bands, n, w),
               names: cards.map(c => c.name), search: cards.map(c => c.name.toLowerCase()).join('|') };
    }),
    cards: m.cards.map(([key, n, w, , three, bands]) => {
      const share = n / totalDecks;
      return { ...metaCardOf(key), n, w, rate: w / Math.max(n, 1), three: (three || 0) / Math.max(n, 1), share, bands: metaBands(bands, n, w),
               trend: prev ? share - (prev[key] || 0) : null, isNew: prev ? !(key in prev) : false };
    }),
    // [id, name, art, games, wins, three-crown wins] — collected from 28 Oct 2026
    troops: (m.troops || []).map(([id, name, img, n, w, three]) => ({ id, name: name || 'Tower troop', img, n, rate: w / Math.max(n, 1), three: three / Math.max(n, 1) })),
    towers: m.towers || null,
    ratingBands: m.bands || null,   // { hi: #100's rating, lo: #1000's }
    activity: m.activity || [],
    gaps: m.gaps || null,           // { step, rates: [[games, wins]] per rating gap bucket }
    // The top decks of about a week before, for new / rising decks
    prevDecks: m.prev_decks?.matches ? { at: m.prev_decks.at, total: m.prev_decks.matches * 2,
      by: Object.fromEntries(m.prev_decks.decks.map(([k, n, w]) => [k, { n, w }])) } : null,

}
// [games, wins] at #1–100 rating, at #101–1000, and below — from 29 Oct 2026
function metaBands(b, n, w) {
  if (!b || !(b[0] + b[2])) return null;
  return [[b[0], b[1]], [b[2], b[3]], [Math.max(0, n - b[0] - b[2]), Math.max(0, w - b[1] - b[3])]];

// A saved copy is fetched again after 30 min, or as soon as the collector's
// next recompute (data.next) has happened
const metaStale = c => !c?.data || Date.now() - c.savedAt >= META_MAX_AGE_MS
  || (c.data.next && Date.now() > c.data.next + 2 * 60e3 && c.savedAt < c.data.next + 2 * 60e3);
// "Updated 2 h ago · next in ~40 min"
function metaUpdatedText(d) {
  const next = d.next ? d.next - Date.now() : null;
  return `Updated ${fmtAgo(Date.now() - d.updated)}${next == null ? '' : next > 60e3 ? ` · next in ~${next < 3600e3 ? Math.round(next / 60e3) + ' min' : Math.round(next / 3600e3) + ' h'}` : ' · updating now'}`;
}
// "09:41" today, "Yesterday 21:10", else "25 Oct 21:10" (local time)
function metaStatsTime(t) {
  const d = new Date(t), time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const day = x => new Date(x).toDateString();
  if (day(t) === day(Date.now())) return time;
  if (day(t) === day(Date.now() - 864e5)) return `yesterday ${time}`;
  return `${d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} ${time}`;
}
// When the collector recomputes next; a run held up (e.g. by its daily read limit) says so
function metaNextText(d) {
  if (!d.next) return '';
  const next = d.next - Date.now();
  if (next > 60e3) return `Next update in ~${next < 3600e3 ? Math.round(next / 60e3) + ' min' : Math.round(next / 3600e3) + ' h'}`;
  return next > -15 * 60e3 ? 'Updating now' : 'Next update delayed — it runs as soon as the collector can';
}
// GET a collector endpoint as { data, savedAt }, saved to localStorage
async function fetchMetaJSON(url, cacheKey) {
  let res;
  try { res = await fetch(url, { cache: 'no-cache' }); }  // the 30-min checks decide freshness
  catch(e) { throw new Error('Connection failed — check your internet connection and try again.'); }
  if (!res.ok) throw new Error(`The meta service isn't responding right now (error ${res.status}).`);
  const out = { data: await res.json(), savedAt: Date.now() };
  try { localStorage.setItem(cacheKey, JSON.stringify(out)); } catch(e) {}
  return out;
}

async function renderMetaScreen() {
  const el = document.getElementById('meta-result');
  if (!_meta) {
    try { _meta = JSON.parse(localStorage.getItem(META_CACHE_KEY) || 'null'); } catch(e) {}
  }
  await maybeLoadCards();
  if (_meta?.data) drawMeta();
  else el.innerHTML = '<div class="spinner"></div>';
  if (!metaStale(_meta) || _metaLoading) return;
  _metaLoading = true;
  try {
    _meta = await fetchMetaJSON(META_URL, META_CACHE_KEY);
    if (currentScreen === 'meta') drawMeta();
  } catch(e) {
    if (!_meta?.data) el.innerHTML = `<div class="error-msg">${esc(e.message)}</div>`;
  } finally {
    _metaLoading = false;
  }
}

const META_BAND_NAMES = ['#1–100 level', '#101–1000 level', 'Lower'];
// One small labelled figure in a row of three or four
const metaMini = (val, lbl, cls = '') => `<div style="flex:1;min-width:0;text-align:center"><div class="${cls}" style="font-size:14px;font-weight:700">${val}</div><div style="font-size:10px;color:var(--muted);line-height:1.2">${lbl}</div></div>`;
const metaRateCls = (w, n) => n ? winCls(w / n) : 'text-muted';
const metaRateTxt = (w, n) => n ? mPct(w / n, 0) : '—';
function metaDeckMoreHTML(d, P) {
  const parts = [];
  const sub = t => `<div class="mu-sub" style="margin:10px 0 4px">${t}</div>`;
  // How its games end: by how many crowns it won or lost
  if (d.close) {
    const [cw, cl, blown] = d.close, L = Math.max(0, d.n - d.w - d.draws), p = v => mPct(Math.max(0, v) / Math.max(d.n, 1), 0);
    const line = t => `<div style="font-size:11px;color:var(--muted);margin:4px 0 2px">${t}</div>`;
    parts.push(sub('How its games end') + line(`Wins · ${p(d.w)} of games`)
      + `<div style="display:flex;gap:6px">${metaMini(p(cw), 'by one crown', 'text-green')}${metaMini(p(d.w - cw - d.three), 'by two', 'text-green')}${metaMini(p(d.three), 'three crowns', 'text-green')}</div>`
      + line(`Losses · ${p(L)} of games`)
      + `<div style="display:flex;gap:6px">${metaMini(p(cl), 'by one crown', 'text-red')}${metaMini(p(L - cl - blown), 'by two', 'text-red')}${metaMini(p(blown), 'three-crowned', 'text-red')}</div>`
      + `<div style="font-size:11px;color:var(--muted);margin-top:4px">${p(cw + cl)} of its games were decided by a single crown.</div>`);
  }
  // Against its players' ratings
  const edge = metaEdge(d);
  if (edge != null) {
    const top = P.gaps?.rates?.[P.gaps.rates.length - 1];
    parts.push(sub('Against its players\' ratings') + `<div style="display:flex;gap:6px">${metaMini(mPct(d.exp.e / d.exp.n), 'expected from<br>rating gaps')}${metaMini(mPct(d.rate), 'actual', winCls(d.rate))}${metaMini(`${edge > 0 ? '+' : ''}${(edge * 100).toFixed(1)}`, 'points', Math.abs(edge) < 0.01 ? 'text-muted' : edge > 0 ? 'text-green' : 'text-red')}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">Each game counted at the win rate top players have at that rating gap${top?.[0] >= 30 ? ` (${P.gaps.step * (P.gaps.rates.length / 2 - 1)}+ rating ahead: ${mPct(top[1] / top[0], 0)})` : ''}. Above 0: the deck wins more than its players' ratings predict${d.n < 100 ? ` — over ${fmtNum(d.n)} games, ${metaPm(d.rate, d.n)} is normal noise` : ''}.</div>`);
  }

        <span class="mu-name">${esc(x.name)}</span>
        <span style="font-size:12px;color:var(--muted)">${mPct(t.n / d.troops.reduce((a, b) => a + b.n, 0), 0)} · ${fmtNum(t.n)} games</span>

      + `<div style="display:flex;gap:6px">${d.bands.map(([n, w], i) => metaMini(n >= 10 ? metaRateTxt(w, n) : '—', `${META_BAND_NAMES[i]}<br>${fmtNum(n)} games`, n >= 10 ? metaRateCls(w, n) : 'text-muted')).join('')}</div>`);
  }

  const C = metaCountersMap();

    const tile = r => `<div style="text-align:center;min-width:0">

        <div class="${winCls(r.rate)}" style="font-size:11px;font-weight:700">${mPct(r.rate, 0)}</div>
      </div>`;
    const worst = [...rows].sort((a, b) => a.rate - b.rate).slice(0, 5), best = [...rows].sort((a, b) => b.rate - a.rate).slice(0, 5);

  } else {

  }

  if (!_metaTop) { try { _metaTop = JSON.parse(localStorage.getItem(META_TOP_CACHE_KEY) || 'null'); } catch(e) {} }
  if (!_metaTop?.data || metaStale(_metaTop)) setTimeout(loadMetaTop, 0);

      <div class="mu-row" style="cursor:pointer" onclick="viewFriend('${esc(tag)}')">
        <span class="text-muted" style="font-size:12px;width:40px">#${rank}</span>
        <span class="mu-name">${esc(name || tag)} <span class="text-muted" style="font-size:11px">⚔️ ${fmtNum(rating)}</span></span>
        <span style="font-size:12px;color:var(--muted)">${fmtNum(n)} games</span>

      </div>`).join(''));
  else if (_metaTop?.data) parts.push(sub('Top players who main it') + `<div style="font-size:12px;color:var(--muted)">None of the top 1,000 has it as their most played deck.</div>`);
  return `<div style="border-top:1px solid var(--border);margin-top:6px">${parts.join('')}</div>`;
}

// Per card id with every form added up (a deck holds a card in one form only)
function metaCardTotals(P) {
  const by = {};
  P.cards.forEach(c => {
    const t = by[c.id] || (by[c.id] = { id: c.id, name: c.name, card: c.card, n: 0, w: 0, forms: [] });
    t.n += c.n; t.w += c.rate * c.n; t.forms.push(c);

// 1 · Popularity against win rate, one dot per card form
function metaScatterHTML(P) {
  const pts = P.cards.filter(c => c.share >= META_SCATTER_MIN);
  if (pts.length < 3) return '';
  const W = 320, H = 210, L = 30, R = 8, T = 8, B = 20;
  const maxS = Math.max(...pts.map(c => c.share));
  const lo = Math.min(0.47, ...pts.map(c => c.rate)) - 0.005, hi = Math.max(0.53, ...pts.map(c => c.rate)) + 0.005;
  // Square-root x: most cards sit under 5%, a few over 20%
  const x = v => L + Math.sqrt(v / maxS) * (W - L - R);
  const y = r => T + (hi - r) / (hi - lo) * (H - T - B);
  _metaScatter = pts.map(c => ({ c, x: x(c.share), y: y(c.rate) }));
  const yTicks = [];
  for (let r = Math.ceil(lo * 50) / 50; r <= hi; r += 0.02) yTicks.push(r);
  const xTicks = [0.01, 0.05, 0.1, 0.2, 0.3, 0.5].filter(v => v <= maxS);

    <div class="card">
      <div class="mu-sub" style="margin-top:0">Popularity vs win rate</div>

          <text x="${L - 4}" y="${(y(r) + 3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)">${Math.round(r * 100)}%</text>`).join('')}
        ${xTicks.map(v => `<text x="${x(v).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--muted)">${Math.round(v * 100)}%</text>`).join('')}
        <text x="${L + 4}" y="${T + 9}" font-size="9" fill="var(--muted)" opacity=".8">strong, rarely played</text>
        <text x="${W - R - 2}" y="${H - B - 4}" font-size="9" fill="var(--muted)" opacity=".8" text-anchor="end">popular, losing</text>
        ${_metaScatter.map(d => `<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="4" fill="${META_FORM_COLOR[d.c.form]}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}

        ${Object.entries(META_FORM_NAME).map(([f, l]) => `<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:${META_FORM_COLOR[f]}"></span>${l}</span>`).join('')}

      </div>
      <div id="meta-scatter-readout" style="font-size:12px;color:var(--muted);min-height:32px">Tap a dot to see the card.</div>
    </div>`;
}
window.metaScatterHover = function(e) {
  const svg = e.currentTarget, r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  const px = (e.clientX - r.left) / r.width * vb.width, py = (e.clientY - r.top) / r.height * vb.height;

      <div style="font-size:11px;color:var(--muted);margin:10px 0 2px">Best-winning pairs (${fmtNum(Math.round(min))}+ games)</div>

// Win rate by rating: cards that do better (or worse) in the hands of #1–100-level
// players than among the rest, from the collector's rating bands
function metaRatingHTML(P, totals) {
  const rows = totals.filter(t => t.share >= META_MIN_CARD_SHARE).map(t => {
    let hn = 0, hw = 0, rn = 0, rw = 0;
    t.forms.forEach(c => { if (!c.bands) return; hn += c.bands[0][0]; hw += c.bands[0][1]; rn += c.bands[1][0] + c.bands[2][0]; rw += c.bands[1][1] + c.bands[2][1]; });
    return { t, hn, rn, hr: hw / Math.max(hn, 1), rr: rw / Math.max(rn, 1) };

      ${x.t.card?.iconUrls?.medium ? `<img src="${x.t.card.iconUrls.medium}" alt="" loading="lazy" decoding="async">` : ''}
      <span class="mu-name">${esc(x.t.name)}</span>

      <span class="${x.diff > 0 ? 'text-green' : 'text-red'}" style="font-size:12px;width:40px;text-align:right">${x.diff > 0 ? '+' : ''}${(x.diff * 100).toFixed(1)}</span>
    </div>`;
  const head = `<div style="display:flex;justify-content:flex-end;gap:10px;font-size:10px;color:var(--muted);padding-bottom:3px;border-bottom:1px solid var(--border)"><span style="width:36px;text-align:right">Top 100</span><span style="width:36px;text-align:right">Rest</span><span style="width:40px;text-align:right">pts</span></div>`;
  return `
    <div class="card">
      ${metaCardHead('Win rate by rating', `Win rate when played at the rating of the top 100${rb ? ` (⚔️ ${fmtNum(rb.hi)}+)` : ''} against everyone else's, for cards in ${Math.round(META_MIN_CARD_SHARE * 100)}%+ of decks.`)}
      <div style="font-size:11px;color:var(--muted);margin:4px 0 2px">Better at the very top</div>
      ${head}${rows.slice(0, 6).map(row).join('')}
      <div style="font-size:11px;color:var(--muted);margin:10px 0 2px">Worse at the very top</div>

}

// When top players play: matches per hour of the day and per weekday, in local
// time, from the collector's hourly tally (full UTC days only, from the day
// after collection began — older matches only came from the first logs read)
function metaActivityHTML(P) {
  const m = _meta?.data || {};
  const utcDay = t => Math.floor(t / 864e5) * 864e5;
  const startDay = m.started ? utcDay(m.started) + 864e5 : 0, today = utcDay(Date.now());
  const days = P.activity.map(([k, h]) => [Date.parse(k), h]).filter(([t]) => t >= startDay && t < today);
  const head = metaCardHead('When top players play', '');
  if (days.length < 2) return `<div class="card">${head}<div style="font-size:12px;color:var(--muted)">Fills in over the next days — it needs two full days of matches.</div></div>`;
  const hours = new Array(24).fill(0), byDate = {};
  days.forEach(([t, h]) => h.forEach((n, i) => {
    const d = new Date(t + i * 3600e3);
    hours[d.getHours()] += n;
    const k = d.toDateString();
    byDate[k] = (byDate[k] || 0) + n;
  }));
  // Local dates at either end are only partly covered
  const dates = Object.keys(byDate).sort((a, b) => Date.parse(a) - Date.parse(b)).slice(1, -1);
  const wd = Array.from({ length: 7 }, () => ({ n: 0, days: 0 }));
  dates.forEach(k => { const x = wd[new Date(k).getDay()]; x.n += byDate[k]; x.days++; });
  const total = hours.reduce((a, b) => a + b, 0), maxH = Math.max(...hours), nowH = new Date().getHours();
  const order = [1, 2, 3, 4, 5, 6, 0], names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const avg = order.map(i => wd[i].days ? wd[i].n / wd[i].days : null), maxW = Math.max(...avg.filter(v => v != null), 1);
  const off = -new Date().getTimezoneOffset() / 60;
  const bar = (h, max, color, title) => `<span title="${title}" style="flex:1;min-width:0;height:${Math.max(2, h / max * 70).toFixed(0)}px;background:${color};border-radius:3px 3px 0 0"></span>`;
  return `
    <div class="card">
      ${metaCardHead('When top players play', `Ranked matches by hour of the day, your time (UTC${off >= 0 ? '+' : ''}${off}), over ${days.length} days.`)}
      <div style="display:flex;align-items:flex-end;gap:2px;height:74px">
        ${hours.map((n, i) => bar(n, maxH, i === nowH ? 'var(--accent)' : 'var(--blue)', `${String(i).padStart(2, '0')}:00 · ${mPct(n / total)} of matches`)).join('')}
      </div>
      <div style="display:flex;gap:2px;border-top:1px solid var(--border);padding-top:3px;margin-bottom:4px">
        ${hours.map((n, i) => `<span style="flex:1;min-width:0;text-align:center;font-size:9px;color:var(--muted)">${i % 3 ? '' : i}</span>`).join('')}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:12px">Busiest ${String(hours.indexOf(maxH)).padStart(2, '0')}:00, quietest ${String(hours.indexOf(Math.min(...hours))).padStart(2, '0')}:00 · <span style="color:var(--accent)">■</span> now</div>
      ${dates.length >= 2 ? `
        <div style="display:flex;align-items:flex-end;gap:6px;height:74px">
          ${avg.map((v, i) => v == null ? '<span style="flex:1"></span>' : bar(v, maxW, 'var(--blue)', `${names[order[i]]}: ${fmtNum(Math.round(v))} matches a day`)).join('')}
        </div>
        <div style="display:flex;gap:6px;border-top:1px solid var(--border);padding-top:3px">
          ${order.map(i => `<span style="flex:1;min-width:0;text-align:center;font-size:10px;color:var(--muted)">${names[i]}</span>`).join('')}
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">Matches a day, on average over ${dates.length} days.</div>` : ''}
    </div>`;

// Month vs month: the last 4 weeks against the 4 before, from /history — each

function metaMonthHTML(P, totals) {

  if (!B.length) return `<div class="card">${head}<div style="font-size:12px;color:var(--muted)">Compares the last 4 weeks with the 4 before. The first comparison is ready around ${day(days[0][0] + 4 * W)}.</div></div>`;
  const tally = block => {
    const by = {}; let matches = 0;
    block.forEach(([, m, cards, wins]) => {
      matches += m;
      for (const k in cards) {
        const id = parseInt(k, 10), x = by[id] || (by[id] = { n: 0, wn: 0, w: 0 });
        x.n += cards[k];

  };
  const a = tally(A), b = tally(B);

  const rows = metaCardChoices(totals).map(t => {
    const x = a.by[t.id] || { n: 0, wn: 0, w: 0 }, y = b.by[t.id] || { n: 0, wn: 0, w: 0 };
    const sa = x.n / (a.matches * 2), sb = y.n / (b.matches * 2);
    const ra = x.wn >= 200 ? x.w / x.wn : null, rb = y.wn >= 200 ? y.w / y.wn : null;
    return { t, sa, sb, ra, rb, diff: mode === 'use' ? sa - sb : ra != null && rb != null ? ra - rb : null };
  }).filter(r => r.diff != null).sort((p, q) => Math.abs(q.diff) - Math.abs(p.diff)).slice(0, 12);
  const span = blk => `${day(blk[blk.length - 1][0] - W)}–${day(blk[0][0])}`;
  return `
    <div class="card">
      ${head}
      <div class="seg" style="margin-bottom:8px">
        ${[['use', 'Share of decks'], ['win', 'Win rate']].map(([v, l]) => `<button class="${mode === v ? 'active' : ''}" onclick="setMetaMonthMode('${v}')">${l}</button>`).join('')}
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Biggest changes: ${span(A)} against ${span(B)}${A.length < 4 || B.length < 4 ? ` (${A.length} and ${B.length} of 4 weeks collected)` : ''}.</div>
      ${rows.length ? rows.map(r => `<div class="mu-row" style="cursor:pointer" onclick="metaDecksWith('${esc(r.t.name)}')">
          ${r.t.card?.iconUrls?.medium ? `<img src="${r.t.card.iconUrls.medium}" alt="" loading="lazy" decoding="async">` : ''}
          <span class="mu-name">${esc(r.t.name)}</span>
          <span style="font-size:12px;color:var(--muted);white-space:nowrap">${mode === 'use' ? `${mPct(r.sb)} → ${mPct(r.sa)}` : `${mPct(r.rb)} → ${mPct(r.ra)}`}</span>
          <span class="${r.diff > 0 ? 'text-green' : 'text-red'}" style="font-weight:700;width:44px;text-align:right">${r.diff > 0 ? '+' : ''}${(r.diff * 100).toFixed(1)}</span>
        </div>`).join('') : `<div style="font-size:12px;color:var(--muted)">${mode === 'win' ? 'Win rates fill in once both blocks have them (saved from 28 Oct).' : 'Nothing to compare yet.'}</div>`}
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Change in percentage points. Tap a card for its decks.</div>
    </div>`;
}

// 4 · Cards played in more than one form: how often and how well each form does.
// A form needs META_FORM_MIN_GAMES and 2% of the card's games — a handful of

const META_FORM_MIN_GAMES = 30, META_FORMS_SHOWN = 10;
let _metaFormsAll = false;
window.metaFormsShowAll = function() { _metaFormsAll = true; redrawMetaList(); };

    <div class="card">
      <div class="mu-sub" style="margin-top:0">Evo vs Hero vs plain</div>
