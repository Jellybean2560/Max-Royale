      <div id="${scope}-plan-output">${buildPlanOutput(ctx)}</div>
    </div>`;
}
function _redrawPlan(scope, key, val) {
  const ctx = _planCtx[scope]; if (!ctx) return;
  ctx[key] = val;
  const isSuggest = key === 'suggestMode';
  const el = document.getElementById(`${scope}-${isSuggest ? 'suggested' : 'plan'}-output`);
  if (el) el.innerHTML = isSuggest ? buildSuggestedOutput(ctx) : buildPlanOutput(ctx);
}
window.setPlanMode    = (scope, v) => _redrawPlan(scope, 'planMode', v);
window.setPlanTarget  = (scope, v) => _redrawPlan(scope, 'planTarget', parseInt(v,10) || MAX_LEVEL);

// ── Suggested Upgrades (scoped by account or deck) ──
window.setSuggestMode = (scope, v) => _redrawPlan(scope, 'suggestMode', v);
function buildSuggestedOutput(ctx) {
  const data = ctx.data;
  if (!data) return '';
  const enriched = (data.cards||[]).map(c => {
    const r = (c.rarity||'common').toLowerCase();
    const disp = toDisplayLevel(r, c.level);
    const steps = LEVEL_DATA[r] || [];
    const minL  = MIN_LEVEL[r] || 1;
    const idx   = disp - minL;
    const isMaxed = disp >= MAX_LEVEL || idx >= steps.length;
    const nextStep = (!isMaxed && idx >= 0 && idx < steps.length) ? steps[idx] : null;
    const isUpgradable = !isMaxed && !!nextStep && (c.count||0) >= nextStep.cards;
    return { ...c, r, disp, isMaxed, nextStep, isUpgradable };
  });
  // Any non-maxed card with a defined next step is a candidate — even if the
  // player doesn't yet have enough cards. We rank by next-step gold cost and
  // show up to 5 cheapest. A ✓ vs +X cards still needed label tells the user
  // whether it's actually doable right now.
  let upgradable = enriched.filter(c => !c.isMaxed && c.nextStep);
  if (ctx.suggestMode.startsWith('deck-')) {
    const deck = ctx.decks[parseInt(ctx.suggestMode.slice(5),10)];
    if (!deck) return '<div class="empty-msg">Deck not found.</div>';
    const deckNames = new Set(deck.cards);
    upgradable = upgradable.filter(c => deckNames.has(c.name));
  }
  if (!upgradable.length) return '<div class="empty-msg">No upgrades available in this scope.</div>';
  const sorted = [...upgradable].sort((a,b) => (a.nextStep?.gold||0) - (b.nextStep?.gold||0)).slice(0,5);
  return sorted.map(c => {
    const deficit = Math.max(0, (c.nextStep?.cards||0) - (c.count||0));
    const readyLbl = deficit > 0
      ? `<span class="text-red" style="font-size:11px">+${fmtNum(deficit)} cards</span>`
      : `<span class="text-green" style="font-size:11px">✓ Ready</span>`;
    return `<div class="stat-row">
      <span class="stat-label" style="display:flex;align-items:center;gap:6px">
        ${c.iconUrls?.medium?`<img src="${c.iconUrls.medium}" alt="" style="width:22px;height:28px;object-fit:contain;flex-shrink:0">`:''}
        <span>${esc(c.name)} <span style="color:var(--muted);font-size:11px">(Lv ${c.disp}→${c.disp+1})</span></span>
      </span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
        <span class="stat-value text-accent">${fmtNum(c.nextStep?.gold)} 💰</span>
        ${readyLbl}
      </span>
    </div>`;
  }).join('');
}
function buildPlanOutput(ctx) {
  const data = ctx.data;
  if (!data) return '';
  let cards = data.cards || [];
  let titleSuffix = '';
  if (ctx.planMode.startsWith('deck-')) {
    const deck = ctx.decks[parseInt(ctx.planMode.slice(5),10)];
    if (!deck) return '<div class="empty-msg">Deck not found.</div>';
    const deckNames = new Set(deck.cards);
    cards = cards.filter(c => deckNames.has(c.name));
    titleSuffix = ` (deck)`;
  }
  const target = ctx.planTarget;
  const sum = buildPlanSummary(cards, target);
  const rows = RARITY_ORDER_KEYS.map(r => {
    const v = sum.byR[r];
    if (v.needed === 0 && v.gold === 0) return '';
    return `<div class="stat-row">
      <span class="stat-label" style="color:${RARITY_COLOR_MAP[r]};font-weight:600">${RARITY_DISPLAY_NAME[r]}</span>
      <span style="display:flex;gap:12px;align-items:center;font-size:13px"><span class="text-red">+${fmtNum(v.needed)}</span><span class="text-accent">${fmtNum(v.gold)} 💰</span></span>
    </div>`;
  }).filter(Boolean).join('');
  if (sum.totalNeeded === 0 && sum.totalGold === 0) {
    return `<div class="empty-msg">All cards already at Lv ${target}! 🎉</div>`;
  }
  return `${rows}
    <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-weight:700;font-size:14px">
      <span>Total${titleSuffix}</span>
      <span style="display:flex;gap:12px"><span class="text-red">+${fmtNum(sum.totalNeeded)}</span><span class="text-accent">${fmtNum(sum.totalGold)} 💰</span></span>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
//  DECK UPGRADE SCREEN
// ══════════════════════════════════════════════════════════════
let _deckUpMode = 'recent';            // 'recent' or 'custom'
let _deckUpSelectedDeckIdx = 0;
let _deckUpCustomIds = [];             // array of selected card IDs (max 8)
let _deckUpTarget = MAX_LEVEL;
let _deckUpSearch = '';
let _deckUpTag = null;                 // whose deck the selections above belong to

function renderDeckUpgradeScreen() {
  const screen = document.getElementById('screen-deckup');
  if (!screen) return;
  const profile = window._currentProfile;
  if (!profile || !profile.data) {
    screen.innerHTML = `
      <h2 style="margin-bottom:16px">⚔ Deck Upgrade</h2>
      <div class="card"><div class="empty-msg">Load a player profile first (Player tab → Search).</div></div>`;
    return;
  }
  const data = profile.data;
  const battles = profile.battles || [];
  if (data.tag !== _deckUpTag) {
    // A custom deck is a list of card ids — on another account it would show a
    // count of cards that aren't in the slots. Start over per account.
    _deckUpTag = data.tag;
    _deckUpCustomIds = []; _deckUpSelectedDeckIdx = 0; _deckUpSearch = '';
  }
  const tracked = Object.values(buildDeckMapFromBattles(battles, data.tag))
    .sort((a,b) => (b.wins+b.losses+b.draws) - (a.wins+a.losses+a.draws))
    .slice(0,10);
  // The deck equipped in-game right now comes first, so it's the default
  const current = (data.currentDeck || []).length ? [{ cards: data.currentDeck.map(c => c.name), current: '1v1' }] : [];
  const deck2v2 = latest2v2Deck(battles, data.tag);
  const setKey = names => [...names].sort().join('|');
  if (deck2v2 && setKey(deck2v2.map(c => c.name)) !== setKey(current[0]?.cards || []))
    current.push({ cards: deck2v2.map(c => c.name), current: '2v2' });
  const decks = [...current, ...tracked];
  const deckLabel = (d, i) => d.current
    ? `🃏 Current ${d.current} deck (${d.cards.slice(0,3).map(esc).join(', ')}…)`
    : `Deck #${i + 1 - current.length} · ${d.wins}W ${d.losses}L (${d.cards.slice(0,3).map(esc).join(', ')}…)`;

  const targetSel = `
    <select onchange="setDeckUpTarget(this.value)" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center">
      <option value="16" ${_deckUpTarget===16?'selected':''}>to Lv 16</option>
      <option value="15" ${_deckUpTarget===15?'selected':''}>to Lv 15</option>
      <option value="14" ${_deckUpTarget===14?'selected':''}>to Lv 14</option>
    </select>`;

  const modeBar = `
    <div class="filter-bar" style="margin-bottom:12px">
      <button class="filter-btn ${_deckUpMode==='recent'?'active':''}" onclick="setDeckUpMode('recent')">Recent Decks</button>
      <button class="filter-btn ${_deckUpMode==='custom'?'active':''}" onclick="setDeckUpMode('custom')">Custom Deck</button>
    </div>`;

  let body = '';
  if (_deckUpMode === 'recent') {
    if (!decks.length) {
      body = '<div class="empty-msg">No recent decks found in your battle log.</div>';
    } else {
      if (_deckUpSelectedDeckIdx >= decks.length) _deckUpSelectedDeckIdx = 0;
      body = `
        <select onchange="setDeckUpRecent(this.value)" style="width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:13px;margin-bottom:12px;appearance:none;-webkit-appearance:none;text-align:center">
          ${decks.map((d,i) => `<option value="${i}" ${i===_deckUpSelectedDeckIdx?'selected':''}>${deckLabel(d, i)}</option>`).join('')}
        </select>`;
      const deck = decks[_deckUpSelectedDeckIdx];
      const names = new Set(deck.cards);
      const deckCards = data.cards.filter(c => names.has(c.name));
      body += renderDeckBreakdown(deckCards);
    }
  } else {
    body = renderCustomDeckBuilder(data);
  }

  screen.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin:0">⚔ Deck Upgrade</h2>
      ${targetSel}
    </div>
    ${modeBar}
    <div class="card">${body}</div>`;
}

window.setDeckUpMode = function(m) { _deckUpMode = m; renderDeckUpgradeScreen(); };
window.setDeckUpRecent = function(idx) { _deckUpSelectedDeckIdx = parseInt(idx,10) || 0; renderDeckUpgradeScreen(); };
window.setDeckUpTarget = function(v) { _deckUpTarget = parseInt(v,10) || MAX_LEVEL; renderDeckUpgradeScreen(); };

// Search only refreshes the suggestions area so the input keeps focus
window.setDeckUpSearch = function(v) {

  const data = (window._currentProfile||{}).data;

  if (data && box) box.innerHTML = buildDeckUpSuggestions(data);
};
window.addDeckUpCard = function(id) {

  if (_deckUpCustomIds.includes(id) || _deckUpCustomIds.length >= 8) return;
  _deckUpCustomIds.push(id);
  _deckUpSearch = '';
  refreshCustomDeckSections();
};
window.removeDeckUpCard = function(id) {
  _deckUpCustomIds = _deckUpCustomIds.filter(x => x !== parseInt(id, 10));
  refreshCustomDeckSections();
};
window.clearDeckUp = function() {
  _deckUpCustomIds = [];
  _deckUpSearch = '';
  refreshCustomDeckSections();
};

// Refresh slots, suggestions, breakdown, count, clear-button & search input value
// in place — without re-rendering the whole screen (which loses focus).
function refreshCustomDeckSections() {
  const data = (window._currentProfile||{}).data;
  if (!data) return;
  const slotsEl  = document.getElementById('deckup-slots');
  const sugEl    = document.getElementById('deckup-suggestions');
  const brkEl    = document.getElementById('deckup-breakdown');
  const countEl  = document.getElementById('deckup-count');
  const clearEl  = document.getElementById('deckup-clear');
  const input    = document.getElementById('deckup-search-input');
  const selectedCards = _deckUpCustomIds.map(id => data.cards.find(c => c.id === id)).filter(Boolean);
  if (slotsEl) slotsEl.innerHTML = buildDeckUpSlots(selectedCards);
  if (sugEl)   sugEl.innerHTML   = buildDeckUpSuggestions(data);
  if (brkEl)   brkEl.innerHTML   = selectedCards.length ? renderDeckBreakdown(selectedCards) : '<div class="empty-msg">Pick cards above to see upgrade requirements.</div>';
  if (countEl) countEl.textContent = `${_deckUpCustomIds.length} / 8 cards selected`;
  if (clearEl) clearEl.style.display = _deckUpCustomIds.length ? 'inline-flex' : 'none';
  if (input)   input.value = _deckUpSearch;

// Card ids in a deck link — the game's share link
// (link.clashroyale.com/…copyDeck?deck=26000000;27000001;…) or any text holding
// them. Deck cards are 26… troops, 27… buildings, 28… spells; tower troop ids
// (159…) don't match. Falls back to a RoyaleAPI deck URL, which names the cards:
// royaleapi.com/decks/stats/hog-rider,musketeer-ev1,…
function parseDeckLinkIds(text) {
  const ids = [...new Set((String(text || '').match(/\b2[678]\d{6}\b/g) || []).map(Number))];
  if (ids.length) return ids.slice(0, 8);
  const slugs = String(text || '').match(/decks\/stats\/([^\/?#\s]+)/)?.[1];
  if (!slugs) return [];
  const slug = n => n.toLowerCase().replace(/\./g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const bySlug = Object.fromEntries(allCards.map(c => [slug(c.name), c.id]));
  return [...new Set(decodeURIComponent(slugs).split(',').map(x => bySlug[x.replace(/-(ev\d+|hero)$/, '')]).filter(Boolean))].slice(0, 8);
}
window.importDeckLink = function(text) {
  const msg = document.getElementById('deckup-link-msg');
  const say = (t, err) => { if (msg) { msg.textContent = t; msg.style.color = err ? 'var(--red)' : 'var(--muted)'; } };
  if (!window._currentProfile?.data) return;
  const ids = parseDeckLinkIds(text);
  if (!ids.length) { say("That doesn't look like a deck link.", true); return; }
  loadDeckIds(ids);
};
// Puts these card ids in the custom deck (Deck Upgrade must be on screen in
// Custom mode) and names any you haven't unlocked
function loadDeckIds(ids) {
  const data = window._currentProfile?.data;
  const msg = document.getElementById('deckup-link-msg');
  if (!data) return;
  const owned = new Set((data.cards || []).map(c => c.id));
  const missing = ids.filter(id => !owned.has(id)).map(id => allCards.find(c => c.id === id)?.name || `card ${id}`);
  _deckUpCustomIds = ids.filter(id => owned.has(id)).slice(0, 8);
  _deckUpSearch = '';
  const input = document.getElementById('deckup-link-input');
  if (input) input.value = '';
  refreshCustomDeckSections();
  if (msg) {
    msg.textContent = missing.length ? `✓ Deck loaded. Not unlocked yet: ${missing.join(', ')}` : '✓ Deck loaded.';
    msg.style.color = 'var(--muted)';
  }
}

// A deck shared to the installed app (manifest share_target) arrives as
// ?title=&text=&url= — open it in Deck Upgrade once the profile is on screen.
function takeSharedDeck() {
  const q = new URLSearchParams(location.search);
  const text = ['title', 'text', 'url'].map(k => q.get(k) || '').join(' ').trim();
  if (!text) return;
  history.replaceState(null, '', location.pathname);
  if (!parseDeckLinkIds(text).length) return;
  _deckUpMode = 'custom';
  goTo('deckup');
  importDeckLink(text);
}

function buildDeckUpSlots(selectedCards) {

    const disp = toDisplayLevel(r, c.level);

function buildDeckUpSuggestions(data) {

    .filter(c => !_deckUpCustomIds.includes(c.id) && (c.name||'').toLowerCase().includes(_deckUpSearch))

function renderDeckBreakdown(cards) {
  if (!cards.length) return '<div class="empty-msg">No cards.</div>';
  const target = _deckUpTarget;
  const enriched = cards.map(c => {
    const r = (c.rarity||'common').toLowerCase();
    const disp = toDisplayLevel(r, c.level);
    const s = cardsToMaxStats(c, target);
    return { ...c, r, disp, needed: s.needed, gold: s.gold };
  }).sort((a,b) => (b.gold||0) - (a.gold||0));

  const rows = enriched.map(c => `
    <div class="stat-row">
      <span class="stat-label" style="display:flex;align-items:center;gap:8px;min-width:0">
        ${c.iconUrls?.medium ? `<img src="${c.iconUrls.medium}" alt="" style="width:32px;height:40px;object-fit:contain;flex-shrink:0">` : ''}
        <span style="display:flex;flex-direction:column;min-width:0">
          <span style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</span>
          <span style="font-size:11px;color:${RARITY_COLOR_MAP[c.r]||'var(--muted)'}">${RARITY_DISPLAY_NAME[c.r]||c.r} · Lv ${c.disp}${c.disp>=MAX_LEVEL?' (maxed)':c.disp>=target?' (at target)':' → '+target}</span>
        </span>
      </span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px">
        <span class="${c.needed>0?'text-red':'text-green'}">${c.needed>0?'+'+fmtNum(c.needed)+' cards':'✓ Enough'}</span>
        <span class="text-accent">${fmtNum(c.gold)} 💰</span>
      </span>
    </div>`).join('');

  // Rarity totals
  const byR = {};
  RARITY_ORDER_KEYS.forEach(r => byR[r] = { needed: 0, gold: 0 });
  let totalNeeded = 0, totalGold = 0;
  enriched.forEach(c => {
    if (byR[c.r]) { byR[c.r].needed += c.needed; byR[c.r].gold += c.gold; }
    totalNeeded += c.needed; totalGold += c.gold;
  });
  const rarityRows = RARITY_ORDER_KEYS.map(r => {
    const v = byR[r];
    if (!v.needed && !v.gold) return '';
    return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0">
      <span style="color:${RARITY_COLOR_MAP[r]};font-weight:600">${RARITY_DISPLAY_NAME[r]}</span>
      <span style="display:flex;gap:12px"><span class="text-red">+${fmtNum(v.needed)}</span><span class="text-accent">${fmtNum(v.gold)} 💰</span></span>
    </div>`;
  }).filter(Boolean).join('');

  return `
    ${rows}
    <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border)">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Totals by rarity</div>
      ${rarityRows}
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-weight:700;font-size:14px">
        <span>Total to Lv ${target}</span>
        <span style="display:flex;gap:12px"><span class="text-red">+${fmtNum(totalNeeded)}</span><span class="text-accent">${fmtNum(totalGold)} 💰</span></span>
      </div>
    </div>`;
}

const OV_SECTION_STYLE = "margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px";
const ovRow = (label, value, cls = '') =>
  `<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-value ${cls}">${value}</span></div>`;
const pct = (n, total) => total ? (n / total * 100).toFixed(1) + '%' : '—';

// Days played comes from the YearsPlayed badge, whose progress counts days.
function accountAgeDays(data) {
  return (data.badges || []).find(b => b.name === 'YearsPlayed')?.progress || 0;
}
function fmtAge(days) {
  const y = Math.floor(days / 365), w = Math.floor(days % 365 / 7), d = days % 365 % 7;
  return `${y}y ${w}w ${d}d`;
}
// The API has no playtime, so estimate it at 4 minutes a game — the same
// assumption deckai.app makes (its 493h 36m for 7,404 games is exactly that).
const EST_MINUTES_PER_GAME = 4;
const fmtHours = mins => `${Math.floor(mins / 60)}h ${Math.round(mins % 60)}m`;
const badgeProgress = (data, name) => (data.badges || []).find(b => b.name === name)?.progress || 0;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtSeasonId = id => { const [y, m] = (id || '').split('-'); return m ? `${MONTHS[+m - 1]} ${y}` : ''; };

// Everything found — cards + evolutions + heroes + tower troops — against the
// catalog, in total and per kind as [found, total]. Same ownership rules as the
// Overview's Evolutions & Heroes counts.
function cardsFoundCounts(data) {
  const cards = data.cards || [], troops = data.supportCards || [];
  const evoIds  = new Set(allCards.filter(hasEvoForm).map(c => c.id));
  const heroIds = new Set(allCards.filter(hasHeroForm).map(c => c.id));
  const evos = cards.filter(c => evoIds.has(c.id) && ownsEvo(c)).length;
  const heroes = cards.filter(c => heroIds.has(c.id) && ownsHero(c)).length;
  const kinds = {
    cards:  [cards.length, Math.max(allCards.length, cards.length)],
    evos:   [evos, evoIds.size],
    heroes: [heroes, heroIds.size],
    troops: [troops.length, Math.max(_towerTroopTotal, troops.length)],
  };
  const sum = i => Object.values(kinds).reduce((s, k) => s + k[i], 0);
  return { found: sum(0), total: sum(1), ...kinds };
}

function cardLevelChartHTML(data, [found, total], scope) {

// ── Trophy history ──
// The API only knows today's numbers, so the history is built up on this device:
// a point whenever a refresh finds a new value, plus one for every ladder or Path
// of Legends battle still in the log (startingTrophies + trophyChange — exact, and
// dated to the battle, so the first look already has the last ~30 games). Path of
// Legends battles carry the ranked rating, not Trophy Road trophies, so that's a
// series of its own. Points are [time ms, value], oldest first.
const TROPHY_HISTORY_KEY = 'cr_trophy_history_v1';
const TROPHY_POINTS_MAX = 1000;
const TROPHY_SERIES = { road: 'Trophies', pol: 'Path of Legends' };
const TROPHY_RANGES = { 7: '7 days', 30: '30 days', all: 'All' };
// 1v1 Trophy Road: type 'trail' (the API's coarse type for most matchmade modes,
// 2v2 included) with a Ladder game mode; older logs used type 'PvP'
const isTrophyRoadBattle = b => (b.team || []).length === 1
  && (b.type === 'PvP' || (b.type === 'trail' && /^Ladder/i.test(b.gameMode?.name || '')));
function trophyPointsFromBattles(battles) {
  const pts = { road: [], pol: [] };
  (battles || []).forEach(b => {
    const me = (b.team || [])[0];
    if (!b.battleTime || me?.trophyChange == null || me.startingTrophies == null) return;
    const series = b.type === 'pathOfLegend' ? 'pol' : isTrophyRoadBattle(b) ? 'road' : '';
    if (series) pts[series].push([parseApiTime(b.battleTime).getTime(), me.startingTrophies + me.trophyChange, me.startingTrophies]);
  });
  // Battles arrive newest-first: the oldest one also gives the value before it
  for (const s in pts) {
    const oldest = pts[s][pts[s].length - 1];
    if (oldest) pts[s].push([oldest[0] - 60000, oldest[2]]);
    pts[s] = pts[s].map(([t, v]) => [t, v]);
  }
  return pts;
}
// The value right now, from the profile: Trophy Road always, the Path of Legends
// rating only once the season result has one
function trophyNow(data) {
  return { road: data.trophies, pol: data.currentPathOfLegendSeasonResult?.trophies || null };
}
function mergeTrophyPoints(list, pts) {
  const byTime = new Map(list);
  pts.forEach(([t, v]) => byTime.set(t, v));
  return [...byTime].sort((a, b) => a[0] - b[0]).slice(-TROPHY_POINTS_MAX);
}
// The battles' points and the profile's value (as of `at`, when it was fetched)
// added to a history; persist reads and saves this device's history for the tag
function trophyHistory(data, battles, { persist = false, at = Date.now() } = {}) {
  let all = {};
  if (persist) try { all = JSON.parse(localStorage.getItem(TROPHY_HISTORY_KEY) || '{}'); } catch(e) {}
  const entry = all[data.tag] || { road: [], pol: [] };
  const fromBattles = trophyPointsFromBattles(battles), now = trophyNow(data);
  for (const s of ['road', 'pol']) {
    let list = mergeTrophyPoints(entry[s] || [], fromBattles[s]);
    if (now[s] != null && (!list.length || list[list.length - 1][1] !== now[s])) list = mergeTrophyPoints(list, [[at, now[s]]]);
    entry[s] = list;
  }
  if (persist) try { all[data.tag] = entry; localStorage.setItem(TROPHY_HISTORY_KEY, JSON.stringify(all)); } catch(e) {}
  return entry;
}
function recordTrophies(data, battles, at) { if (data?.tag) trophyHistory(data, battles, { persist: true, at }); }

const _trophyState = {};
// scope 'p' reads the saved history; 'f' (a friend) gets their current log only
function trophyHistoryHTML(data, battles, scope) {
  let hist = null;
  if (scope === 'p') try { hist = JSON.parse(localStorage.getItem(TROPHY_HISTORY_KEY) || '{}')[data.tag] || null; } catch(e) {}
  if (!hist) hist = trophyHistory(data, battles);
  const prev = _trophyState[scope]?.tag === data.tag ? _trophyState[scope] : null;
  const has = s => (hist[s] || []).length > 0;
  const moves = s => new Set((hist[s] || []).map(p => p[1])).size > 1;
  // Path of Legends first when it's the one that moves (Trophy Road is often done)
  const series = prev && has(prev.series) ? prev.series : has('pol') && (moves('pol') || !moves('road')) ? 'pol' : 'road';
  _trophyState[scope] = { tag: data.tag, hist, series, range: prev?.range || '30' };
  return `<div class="card" id="${scope}-trophy">${trophyCardBody(scope)}</div>`;
}
function trophyCardBody(scope) {
  const st = _trophyState[scope], all = st.hist[st.series] || [];
  const now = Date.now();
  const from = st.range === 'all' ? (all[0]?.[0] ?? now) : now - st.range * 864e5;
  // Points in range, led by the value carried in from before it, and drawn on to now
  const before = all.filter(p => p[0] < from).pop();
  let pts = all.filter(p => p[0] >= from);
  if (before) pts.unshift([from, before[1]]);
  if (pts.length) pts.push([now, pts[pts.length - 1][1]]);
  const cur = all.length ? all[all.length - 1][1] : null;
  const change = pts.length ? cur - pts[0][1] : 0;
  // The toggle only when both series have a history to draw
  const both = (st.hist.road || []).length > 1 && (st.hist.pol || []).length > 1;
  const icon = st.series === 'pol' ? '⚔️' : '🏆';
  const rangeLabel = st.range === 'all' ? `since ${new Date(all[0]?.[0] || now).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}` : `in ${TROPHY_RANGES[st.range]}`;
  const vals = pts.map(p => p[1]);
  const chart = trophyChartSVG(scope, pts);
  return `
    <h3 style="margin-bottom:10px">📈 Trophy History</h3>
    ${both ? `<div class="seg" style="margin-bottom:10px">
      ${Object.entries(TROPHY_SERIES).map(([s, l]) => `<button class="${st.series === s ? 'active' : ''}" onclick="setTrophySeries('${scope}','${s}')">${l}</button>`).join('')}
    </div>` : ''}
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px">
      <span style="font-size:24px;font-weight:700;font-family:'Rajdhani',sans-serif">${icon} ${fmtNum(cur)}</span>
      <span style="font-size:13px;white-space:nowrap"><span class="${change > 0 ? 'text-green' : change < 0 ? 'text-red' : 'text-muted'}" style="font-weight:700">${change > 0 ? '+' : ''}${fmtNum(change)}</span> <span class="text-muted">${rangeLabel}</span></span>
    </div>
    <div id="${scope}-trophy-readout" style="font-size:11px;color:var(--muted);min-height:16px;margin-bottom:4px">${st.chart ? `High ${fmtNum(Math.max(...vals))} · Low ${fmtNum(Math.min(...vals))}` : ''}</div>
    ${chart}
    <div class="filter-bar" style="margin:10px 0 0">
      ${Object.entries(TROPHY_RANGES).map(([r, l]) => `<button class="filter-btn ${st.range === r ? 'active' : ''}" onclick="setTrophyRange('${scope}','${r}')">${l}</button>`).join('')}
    </div>
    ${scope === 'p' ? `<div style="font-size:11px;color:var(--muted);margin-top:8px">Built up on this device from refreshes and your ${st.series === 'pol' ? 'ranked' : 'ladder'} battles, so it grows the more you use the app.</div>` : ''}`;
}
// A line over the range, with three recessive gridlines; touch or hover shows the
// value at that moment in the readout above.
function trophyChartSVG(scope, pts) {
  const W = 320, H = 120, L = 40, R = 6, T = 6, B = 18;
  if (new Set(pts.map(p => p[0])).size < 2 || pts.length < 3) {
    _trophyState[scope].chart = null;
    return `<div class="empty-msg" style="padding:14px 0;font-size:12px">Not enough history yet — the graph fills in as you play${scope === 'p' ? ' and refresh' : ''}.</div>`;
  }
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  if (hi - lo < 10) { lo -= 5; hi += 5; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const xy = pts.map(([t, v]) => [x(t), y(v), t, v]);
  _trophyState[scope].chart = { xy, W };
  const line = xy.map(([px, py], i) => `${i ? 'L' : 'M'}${px.toFixed(1)},${py.toFixed(1)}`).join('');
  const area = `${line}L${xy[xy.length - 1][0].toFixed(1)},${H - B}L${L},${H - B}Z`;
  const grid = [hi - pad, (hi + lo) / 2, lo + pad].map(v => `
    <line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${L - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtNum(Math.round(v))}</text>`).join('');
  const day = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;touch-action:pan-y" role="img" aria-label="Trophy history line chart"
         onpointermove="trophyHover(event,'${scope}')" onpointerdown="trophyHover(event,'${scope}')" onpointerleave="trophyHover(null,'${scope}')">
      ${grid}
      <path d="${area}" fill="var(--accent)" opacity=".12"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="${L}" y="${H - 4}" font-size="10" fill="var(--muted)">${day(t0)}</text>
      <text x="${W - R}" y="${H - 4}" font-size="10" fill="var(--muted)" text-anchor="end">Now</text>
      <g id="${scope}-trophy-hover" style="display:none">
        <line y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/>
        <circle r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      </g>
    </svg>`;
}
window.trophyHover = function(e, scope) {
  const st = _trophyState[scope], g = document.getElementById(`${scope}-trophy-hover`);
  const out = document.getElementById(`${scope}-trophy-readout`);
  if (!st?.chart || !g || !out) return;
  if (!e) { g.style.display = 'none'; out.innerHTML = out.dataset.idle || out.innerHTML; return; }
  if (!out.dataset.idle) out.dataset.idle = out.innerHTML;
  const svg = e.currentTarget, r = svg.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width * st.chart.W;
  // The last real point at or before the pointer (the line holds its value until the next one)
  const xy = st.chart.xy;
  let i = xy.findIndex(p => p[0] > px) - 1;
  if (i < 0) i = px < xy[0][0] ? 0 : xy.length - 1;
  const [cx, cy, t, v] = xy[i], prevV = i ? xy[i - 1][3] : v;
  g.style.display = '';
  g.querySelector('line').setAttribute('x1', cx); g.querySelector('line').setAttribute('x2', cx);
  g.querySelector('circle').setAttribute('cx', cx); g.querySelector('circle').setAttribute('cy', cy);
  const when = i === xy.length - 1 ? 'Now' : new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const d = v - prevV;
  out.innerHTML = `<span style="color:var(--text);font-weight:600">${fmtNum(v)}</span>${d ? ` <span class="${d > 0 ? 'text-green' : 'text-red'}">${d > 0 ? '+' : ''}${fmtNum(d)}</span>` : ''} · ${when}`;
};
window.setTrophySeries = function(scope, s) {
  const st = _trophyState[scope]; if (!st) return;
  st.series = s;
  const el = document.getElementById(`${scope}-trophy`);
  if (el) el.innerHTML = trophyCardBody(scope);
};
window.setTrophyRange = function(scope, r) {
  const st = _trophyState[scope]; if (!st) return;
  st.range = r;
  const el = document.getElementById(`${scope}-trophy`);
  if (el) el.innerHTML = trophyCardBody(scope);
};

// ── Progress: what changed since a day, a week or a month ago ──
// The API only has the profile as it is now, so this device keeps a compact
// snapshot per tag: the last refresh of each day, plus the first one it ever saw
// (the baseline until there's a day before today), for PROGRESS_DAYS. The
// Account tab compares the profile against the last snapshot from before the
// chosen range. Cards are display level × 4 + owned-form bits (1 evo, 2 hero).
const PROGRESS_KEY = 'cr_progress_v1';
const PROGRESS_DAYS = 32, PROGRESS_TAGS = 6;
const PROGRESS_RANGES = [['today', 'Today'], ['7', '7 days'], ['30', '30 days']];
function progressSnap(data, at) {
  const lv = c => toDisplayLevel((c.rarity || 'common').toLowerCase(), c.level);
  const map = list => Object.fromEntries((list || []).map(c => [c.id, lv(c) * 4 + ((c.evolutionLevel || 0) & 3)]));
  const badgeLevels = mastery => (data.badges || []).filter(b => (b.name || '').startsWith('Mastery') === mastery)
    .reduce((s, b) => s + (b.level || 0), 0);
  const pol = data.currentPathOfLegendSeasonResult, last = data.lastPathOfLegendSeasonResult;
  return { at, lastSeason: last ? [last.leagueNumber || 0, last.trophies || 0, last.rank || 0].join('/') : null, xp: data.expLevel, king: data.kingTowerLevel ?? null, cl: data.collectionLevel ?? null,
    trophies: data.trophies, pol: pol?.trophies ?? null, league: pol?.leagueNumber ?? null,
    battles: data.battleCount, wins: data.wins, mastery: badgeLevels(true), badges: badgeLevels(false),
    clan: data.clan?.name || null, cards: map(data.cards), troops: map(data.supportCards) };

const sameProgress = (a, b) => JSON.stringify({ ...a, at: 0 }) === JSON.stringify({ ...b, at: 0 });
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}') || {}; } catch(e) { return {}; }
}
function recordProgress(data, at = Date.now()) {
  if (!data?.tag) return;
  const all = loadProgress(), list = all[data.tag] || [];
  const snap = progressSnap(data, at), last = list[list.length - 1];
  if (last && (at < last.at || sameProgress(snap, last))) return;
  const day = t => new Date(t).toDateString();
  if (last && list.length > 1 && day(last.at) === day(at)) list[list.length - 1] = snap;
  else list.push(snap);
  // Keep one snapshot from before the window: it's the 30-day baseline
  while (list.length > 2 && list[1].at < at - PROGRESS_DAYS * 864e5) list.shift();
  all[data.tag] = list;
  const latest = t => all[t][all[t].length - 1]?.at || 0;
  Object.keys(all).sort((a, b) => latest(b) - latest(a)).slice(PROGRESS_TAGS).forEach(t => delete all[t]);
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(all)); } catch(e) {}
}

const _progressState = { range: '7', data: null };

  return `<div class="card" id="p-progress">${progressCardBody()}</div>`;
}
function progressCardBody() {
  const data = _progressState.data, r = _progressState.range;
  const list = loadProgress()[data.tag] || [];
  const from = r === 'today' ? new Date().setHours(0, 0, 0, 0) : Date.now() - r * 864e5;
  const cur = progressSnap(data, Date.now());
  // The last snapshot from before the range; with less history, the oldest there is
  const base = list.filter(s => s.at <= from).pop() || (list.length > 1 ? list[0] : null);
  const chips = `<div class="filter-bar" style="margin:0 0 8px">
    ${PROGRESS_RANGES.map(([k, l]) => `<button class="filter-btn ${r === k ? 'active' : ''}" onclick="setProgressRange('${k}')">${l}</button>`).join('')}
  </div>`;
  const head = `<h3 style="margin-bottom:10px">🆕 Progress</h3>${chips}`;
  if (!base) return `${head}<div class="empty-msg" style="padding:10px 0;font-size:12px">Tracking started ${progressWhen(list[0]?.at || Date.now())}. What changes — upgrades, unlocks, levels, rating — shows up here after your next refresh.</div>`;

    for (const [id, v] of Object.entries(cur[kind])) {
      const c = byId[id]; if (!c) continue;
      const old = base[kind]?.[id];
      if (old == null) { unlocked.push([c, kind === 'troops' ? 'troop' : 'card', v >> 2]); continue; }
      if (v >> 2 > old >> 2) upgraded.push([c, old >> 2, v >> 2]);
      if ((v & 1) && !(old & 1)) unlocked.push([c, 'evo']);
      if ((v & 2) && !(old & 2)) unlocked.push([c, 'hero']);
    }
  }
  upgraded.sort((a, b) => b[2] - a[2] || a[0].name.localeCompare(b[0].name));
  // From the upgrade table: what those level-ups cost (cards aside)
  const gold = upgraded.reduce((sum, [c, a, b]) => sum + computeUpgrade((c.rarity || 'common').toLowerCase(), a, 0, b).totalGold, 0);

  const sign = n => `<span class="${n > 0 ? 'text-green' : 'text-red'}" style="font-weight:700">${n > 0 ? '+' : ''}${fmtNum(n)}</span>`;
  const rows = [];
  const levelRow = (label, k) => { if (base[k] != null && cur[k] != null && cur[k] !== base[k]) rows.push(ovRow(label, `${fmtNum(base[k])} → <b>${fmtNum(cur[k])}</b>`)); };

  if (cur.trophies !== base.trophies) rows.push(ovRow('Trophies', `${sign(cur.trophies - base.trophies)} <span class="text-muted">· 🏆 ${fmtNum(cur.trophies)}</span>`));

    || (base.league != null && cur.league != null && cur.league < base.league);
  if (newSeason) {

    rows.push(ovRow('Path of Legends', `New season${r?.leagueNumber ? ` <span class="text-muted">· last one ended in ${esc(polLeagueName(r))}${r.rank ? ` #${fmtNum(r.rank)}` : ''}${r.trophies ? ` · ⚔️ ${fmtNum(r.trophies)}` : ''}</span>` : ''}`));
  } else {
    if (base.league != null && cur.league != null && cur.league !== base.league)
      rows.push(ovRow('League', `${polLeagueName({ leagueNumber: base.league })} → <b>${polLeagueName({ leagueNumber: cur.league })}</b>`));
    if (base.pol != null && cur.pol != null && cur.pol !== base.pol) rows.push(ovRow('Path of Legends', `${sign(cur.pol - base.pol)} <span class="text-muted">· ⚔️ ${fmtNum(cur.pol)}</span>`));

  const played = (cur.battles || 0) - (base.battles || 0), won = (cur.wins || 0) - (base.wins || 0);
  if (played > 0) rows.push(ovRow('Battles', `${fmtNum(played)} played · ${fmtNum(won)} won`));
  if (cur.mastery > base.mastery) rows.push(ovRow('Card Mastery', `+${cur.mastery - base.mastery} level${cur.mastery - base.mastery === 1 ? '' : 's'}`));
  if (cur.badges > base.badges) rows.push(ovRow('Badges', `+${cur.badges - base.badges} level${cur.badges - base.badges === 1 ? '' : 's'}`));
  if (cur.clan !== base.clan) rows.push(ovRow('Clan', cur.clan ? `${base.clan ? `${esc(base.clan)} → ` : 'Joined '}<b>${esc(cur.clan)}</b>` : `Left ${esc(base.clan)}`));

  const grid = (title, items) => items.length ? `
    <div style="${OV_SECTION_STYLE}">${title} <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">· ${items.length}</span></div>

    <div style="font-size:12px;color:var(--muted);margin-bottom:4px">Since ${progressWhen(base.at)}</div>

// "10:02 today", "yesterday 22:14", "21 Oct"
function progressWhen(t) {

  const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

// W/L per game mode over the battle log (~30 most recent games).

// ── Current in-game deck ──
// currentDeck lists the equipped deck in slot order, but its evolutionLevel says
// what the player OWNS (bit 1 = evolution, bit 2 = hero — 3 is both), not which
// form is equipped. The slot decides: slot 1 takes an evolution, slot 2 a hero or
// champion, slot 3 either. Only a card owned in both forms in slot 3 is
// ambiguous; the battle log settles it once that deck (or that card in slot 3)
// has been played, else it's shown as an evolution.
function currentDeckVariants(deck, battles, tag) {
  const mine = (battles || []).map(b => (b.team || []).find(p => p.tag === tag)).filter(p => p && (p.cards||[]).length === 8);
  const setKey = cards => cards.map(c => c.name).sort().join('|');
  const sameDeck = mine.find(p => setKey(p.cards) === setKey(deck));
  if (sameDeck) return deck.map(c => cardVariant(sameDeck.cards.find(x => x.name === c.name)));
  return deck.map((c, i) => {
    const evo = !!((c.evolutionLevel || 0) & 1), hero = !!((c.evolutionLevel || 0) & 2);
    if (i === 0) return evo ? 'evo' : '';
    if (i === 1) return hero ? 'hero' : '';
    if (i !== 2) return '';
    if (evo && hero) return cardVariant(mine.map(p => p.cards[2]).find(x => x?.name === c.name)) || 'evo';
    return evo ? 'evo' : hero ? 'hero' : '';
  });
}

// The equipped deck's key in deck history (sorted names + [evo]/[hero]), so the
// Decks tab can mark it "In use" — or '' if the API didn't give a deck.
// currentDeck is only the 1v1 deck slot — the API has nothing for 2v2 — so the
// 2v2 deck is taken from the latest 2v2 battle: "last played in 2v2", which
// lags a deck change until the next 2v2 game. Battles arrive newest-first.
function latest2v2Deck(battles, tag) {
  for (const b of battles || []) {
    if ((b.team || []).length < 2) continue;
    const me = b.team.find(p => p.tag === tag);
    if (me && (me.cards || []).length === 8) return me.cards;
  }
  return null;
}

// The equipped 1v1 deck as a Decks tab entry with no games, for when it isn't in
// the deck history yet (a new deck, or one only played on another device)
function equippedDeckEntry(data, battles, key) {
  const deck = data?.currentDeck || [];
  if (deck.length !== 8) return null;
  const forms = currentDeckVariants(deck, battles, data.tag), variants = {};
  deck.forEach((c, i) => { if (forms[i]) variants[c.name] = forms[i]; });
  const costs = deck.map(c => c.elixirCost ?? allCards.find(x => x.name === c.name)?.elixirCost).filter(n => n != null);
  return {
    key, cards: deck.map(c => c.name), variants, wins: 0, losses: 0, draws: 0, modes: [], last: '', unplayed: true,
    elixir: costs.length === 8 ? [costs.reduce((a, b) => a + b, 0) / 8] : []
  };
}

function currentDeckKey(data, battles) {
  const deck = data?.currentDeck || [];
  if (!deck.length) return '';
  const variants = currentDeckVariants(deck, battles, data.tag);
  return deck.map((c, i) => variants[i] ? `${c.name}[${variants[i]}]` : c.name).sort().join('|');
}

// ── Opponent cards: how you do against each card ──
// Every non-friendly battle counts once for each card on the other side (both
// opponents' decks in 2v2). Boat battles are left out — their "opponent" is a
// defence, not a player. Tallied per tag like deck history, deduped by
// battleTime, so it grows past the ~30-battle window.
const MATCHUPS_KEY = 'cr_matchups_v1';
const MATCHUP_MIN_GAMES = 4;
function tallyMatchups(entry, battles) {
  const seen = new Set(entry.seen);
  let changed = false;
  (battles || []).forEach(b => {
    if (!b.battleTime || seen.has(b.battleTime)) return;
    seen.add(b.battleTime);
    if (/friendly|clanMate|boat/i.test(b.type || '')) return;
    const opp = b.opponent || [];
    const names = new Set(opp.flatMap(p => (p.cards || []).map(c => c.name)));
    if (!names.size) return;
    const t = (b.team || [])[0]?.crowns || 0, o = opp[0]?.crowns || 0;
    const i = t > o ? 0 : t < o ? 1 : 2;  // [wins, losses, draws]
    names.forEach(n => (entry.cards[n] || (entry.cards[n] = [0, 0, 0]))[i]++);
    entry.battles++;

  });

}
const newMatchups = () => ({ since: Date.now(), battles: 0, seen: [], cards: {} });
function loadMatchups(tag) {
  try { return JSON.parse(localStorage.getItem(MATCHUPS_KEY) || '{}')[tag] || null; }
  catch(e) { return null; }
}
function recordMatchups(tag, battles) {
  if (!tag) return;
  try {
    const all = JSON.parse(localStorage.getItem(MATCHUPS_KEY) || '{}');
    const entry = all[tag] || newMatchups();
    if (!tallyMatchups(entry, battles)) return;
    all[tag] = entry;
    localStorage.setItem(MATCHUPS_KEY, JSON.stringify(all));
  } catch(e) {}
}
// scope 'p' reads the saved tally; 'f' (a friend) counts their current log only
function matchupsHTML(data, battles, scope) {
  let m = scope === 'p' ? loadMatchups(data.tag) : null;

  const since = scope === 'p' && m.since ? ` since ${new Date(m.since).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}` : '';
  const head = `<div style="${OV_SECTION_STYLE}">Opponent Cards <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">· ${m.battles} battle${m.battles === 1 ? '' : 's'}${since}</span></div>`;
  const rows = Object.entries(m.cards)
    .map(([name, [w, l, d]]) => ({ name, w, l, d, n: w + l + d, rate: w / Math.max(w + l + d, 1) }))

  if (!rows.length) return head + `<div style="font-size:12px;color:var(--muted)">Not enough battles yet — a card shows up here once ${scope === 'p' ? "you've" : "they've"} faced it ${MATCHUP_MIN_GAMES} times.</div>`;
  const art = buildCardArtMap(battles);

      <span class="mu-name">${esc(r.name)} <span class="text-muted" style="font-size:11px">· ${r.n}×</span></span>
      <span style="font-size:12px;white-space:nowrap"><span class="text-green">${r.w}W</span> <span class="text-red">${r.l}L</span>${r.d ? ` <span class="text-muted">${r.d}D</span>` : ''}</span>
      <span class="${cls}" style="font-weight:700;width:40px;text-align:right">${Math.round(r.rate * 100)}%</span>

    + (easiest.length ? `<div class="mu-sub">😎 Best against</div>${easiest.map(row).join('')}` : '')

// scope: 'p' for the profile, 'f' for the friend modal — see makePlanCtx().
function renderOverview(data, battles, scope = 'p') {
  const cards = data.cards || [];

  // Compute per-card enriched data
  const enriched = cards.map(c => {
    const r = (c.rarity||'common').toLowerCase();
    const disp = toDisplayLevel(r, c.level);
    const minL = MIN_LEVEL[r] || 1;
    const steps = LEVEL_DATA[r] || [];
    const idx = disp - minL;
    const isMaxed = disp >= MAX_LEVEL || idx >= steps.length;
    const nextStep = (!isMaxed && idx >= 0 && idx < steps.length) ? steps[idx] : null;
    const isUpgradable = !isMaxed && !!nextStep && (c.count||0) >= nextStep.cards;
    const canMax = !isMaxed && cardsNeededToMax(r, disp, c.count||0) === 0;
    return { ...c, r, disp, isMaxed, isUpgradable, canMax, nextStep };
  });

  const maxedCount      = enriched.filter(c => c.isMaxed).length;
  // Measure progress against every card in the game, not just the ones owned —
  // a card you haven't unlocked is still one you need at level 16 for a maxed
  // account, so it belongs in the denominator.
  const totalInGame     = allCards.length || cards.length;
  const upgradableNow   = enriched.filter(c => c.isUpgradable);
  const canMaxCards     = enriched.filter(c => c.canMax);
  const totalGoldReady  = upgradableNow.reduce((s, c) => s + (c.nextStep?.gold || 0), 0);
  const cardsTotal      = allCards.length || cards.length;
  const cardsNotFound   = Math.max(cardsTotal - cards.length, 0);
  const evoIds          = new Set(allCards.filter(hasEvoForm).map(c => c.id));
  const heroIds         = new Set(allCards.filter(hasHeroForm).map(c => c.id));
  const evolvedCount    = evoIds.size > 0
    ? cards.filter(c => evoIds.has(c.id) && ownsEvo(c)).length
    : cards.filter(ownsEvo).length;
  const heroCount       = cards.filter(c => heroIds.has(c.id) && ownsHero(c)).length;
  const supportCards    = data.supportCards || [];
  // Enrich tower troops for Upgrade Insights
  const troopEnriched   = supportCards.map(c => {
    const r    = (c.rarity || 'legendary').toLowerCase();
    const disp = toDisplayLevel(r, c.level);
    const minL = MIN_LEVEL[r] || 1;
    const steps = LEVEL_DATA[r] || [];
    const idx  = disp - minL;
    const isMaxed    = disp >= MAX_LEVEL || idx >= steps.length;
    const nextStep   = (!isMaxed && idx >= 0 && idx < steps.length) ? steps[idx] : null;
    const isUpgradable = !isMaxed && !!nextStep && (c.count||0) >= nextStep.cards;
    return { ...c, r, disp, isMaxed, nextStep, isUpgradable };
  });
  const troopMaxed      = troopEnriched.filter(c => c.isMaxed).length;
  const troopUpgradable = troopEnriched.filter(c => c.isUpgradable);
  const troopCanMax     = troopEnriched.filter(c => !c.isMaxed && cardsNeededToMax(c.r, c.disp, c.count||0) === 0).length;
  const troopGoldReady  = troopUpgradable.reduce((s, c) => s + (c.nextStep?.gold || 0), 0);
  const troopsTotal     = allCards.filter(c => c.iconUrls?.towerProjectileMedium).length || troopEnriched.length;
  const troopsNotFound  = Math.max(troopsTotal - troopEnriched.length, 0);
  const towerTroopCL    = supportCards.reduce((s, c) => {
    const r = (c.rarity||'common').toLowerCase();
    return s + toDisplayLevel(r, c.level);
  }, 0);
  const cardLevelCL     = enriched.reduce((s, c) => s + c.disp, 0) + towerTroopCL;
  const collectionLevel = cardLevelCL + (evolvedCount * 5) + (heroCount * 5);
  const kingTowerLevel  = calcKingTowerLevel(enriched.map(c => c.disp));
  const nextMilestone   = nextCLMilestone(collectionLevel);
  const prevMilestone   = collectionLevel < 20 ? 0 : collectionLevel >= 1500
    ? Math.floor(collectionLevel / 5) * 5
    : Math.floor(collectionLevel / 10) * 10;
  const milestoneProgress = Math.round((collectionLevel - prevMilestone) / (nextMilestone - prevMilestone) * 100);
  // King Tower Level — progress toward next level
  const nextKtlReq = KTL_REQ.find(r => r.lvl === kingTowerLevel + 1);
  const ktlProgress = nextKtlReq
    ? enriched.filter(c => c.disp >= nextKtlReq.min).length
    : null;

  // Top 5 suggested upgrades: upgradable sorted by cheapest gold first
  const suggested = [...upgradableNow]
    .sort((a, b) => (a.nextStep?.gold||0) - (b.nextStep?.gold||0))
    .slice(0, 5);

  const suggestedRows = suggested.map(c =>
    `<div class="stat-row">
      <span class="stat-label" style="display:flex;align-items:center;gap:6px">
        ${c.iconUrls?.medium?`<img src="${c.iconUrls.medium}" alt="" style="width:22px;height:28px;object-fit:contain;flex-shrink:0">`:''}
        <span>${esc(c.name)} <span style="color:var(--muted);font-size:11px">(Lv ${c.disp}→${c.disp+1})</span></span>
      </span>
      <span class="stat-value text-accent">${fmtNum(c.nextStep?.gold)} 💰</span>
    </div>`
  ).join('');

  return `
    <div class="card">
      <h3 style="margin-bottom:4px">⚡ Card Insights</h3>
      <div style="margin-top:20px;margin-bottom:10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px"><img src="cards-icon.webp" style="width:22px;height:18px;object-fit:contain;filter:brightness(0) invert(0.55)"> Cards</div>
      <div class="stat-row ov-link" onclick="ovGo('${scope}','cards','maxed')" style="border-bottom:none"><span class="stat-label">Maxed (Level 16)</span><strong class="text-accent">${maxedCount} / ${totalInGame}</strong></div>
      <div class="progress-wrap mt8">
        <div class="progress-bar" style="width:${Math.round(maxedCount/Math.max(totalInGame,1)*100)}%;background:var(--accent)"></div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px;margin-bottom:8px">${Math.round(maxedCount/Math.max(totalInGame,1)*100)}% maxed</div>
      ${cardsNotFound > 0 ? `<div class="stat-row ov-link" onclick="ovGo('${scope}','cards','notfound')"><span class="stat-label">Not Found</span><strong class="text-red">${cardsNotFound}</strong></div>` : ''}
      <div class="stat-row ov-link" onclick="ovGo('${scope}','cards','upgradable')"><span class="stat-label">Upgradable now</span><strong class="text-green">${upgradableNow.length}</strong></div>
      <div class="stat-row ov-link" onclick="ovGo('${scope}','cards','canmax')"><span class="stat-label">Can reach Level 16 now</span><strong class="text-blue">${canMaxCards.length}</strong></div>
      <div class="stat-row ov-link" onclick="ovGo('${scope}','cards','upgradable')"><span class="stat-label">Gold to upgrade all ready</span><strong class="text-accent">${fmtNum(totalGoldReady)} 💰</strong></div>

      ${troopEnriched.length ? `
      <div style="margin-top:14px">
        <div style="margin-bottom:10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px"><img src="tower-troop-icon.webp" style="width:14px;height:20px;object-fit:contain;filter:brightness(0) invert(0.55)"> Tower Troops</div>
        <div class="stat-row ov-link" onclick="ovGo('${scope}','towerTroops')" style="border-bottom:none"><span class="stat-label">Maxed (Level 16)</span><strong class="text-accent">${troopMaxed} / ${troopEnriched.length}</strong></div>
        <div class="progress-wrap mt8">
          <div class="progress-bar" style="width:${Math.round(troopMaxed/troopEnriched.length*100)}%;background:var(--accent)"></div>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px;margin-bottom:8px">${Math.round(troopMaxed/troopEnriched.length*100)}% maxed</div>
        ${troopsNotFound > 0 ? `<div class="stat-row ov-link" onclick="ovGo('${scope}','towerTroops')"><span class="stat-label">Not Found</span><strong class="text-red">${troopsNotFound}</strong></div>` : ''}
        <div class="stat-row ov-link" onclick="ovGo('${scope}','towerTroops')"><span class="stat-label">Upgradable now</span><strong class="text-green">${troopUpgradable.length}</strong></div>
        <div class="stat-row ov-link" onclick="ovGo('${scope}','towerTroops')"><span class="stat-label">Can reach Level 16 now</span><strong class="text-blue">${troopCanMax}</strong></div>
        ${troopGoldReady > 0 ? `<div class="stat-row ov-link" onclick="ovGo('${scope}','towerTroops')"><span class="stat-label">Gold to upgrade all ready</span><strong class="text-accent">${fmtNum(troopGoldReady)} 💰</strong></div>` : ''}
      </div>` : ''}

      <div style="margin-top:14px">
        <div style="margin-bottom:10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px"><img src="evo-hero-icon.webp" style="width:17px;height:20px;object-fit:contain;filter:grayscale(1) brightness(0) invert(0.55)"> Evolutions &amp; Heroes</div>
        <div class="stat-row ov-link" onclick="ovGo('${scope}','evolutions','unlocked')" style="border-bottom:none"><span class="stat-label">Evolutions unlocked</span><strong class="text-blue">${evolvedCount} / ${evoIds.size}</strong></div>
        <div class="progress-wrap mt8"><div class="progress-bar" style="width:${Math.round(evolvedCount/Math.max(evoIds.size,1)*100)}%;background:var(--blue)"></div></div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px;margin-bottom:8px">${Math.round(evolvedCount/Math.max(evoIds.size,1)*100)}% unlocked</div>
        <div class="stat-row ov-link" onclick="ovGo('${scope}','heroes','unlocked')" style="border-bottom:none"><span class="stat-label">Heroes unlocked</span><strong class="text-purple">${heroCount} / ${heroIds.size}</strong></div>
        <div class="progress-wrap mt8"><div class="progress-bar" style="width:${Math.round(heroCount/Math.max(heroIds.size,1)*100)}%;background:var(--purple)"></div></div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${Math.round(heroCount/Math.max(heroIds.size,1)*100)}% unlocked</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px">📊 Collection Level</h3>
      <div class="stat-row" onclick="toggleCardMax('${scope}-cl-breakdown')" style="cursor:pointer">
        <span class="stat-label">Collection Level <span id="${scope}-cl-breakdown-toggle" style="font-size:10px;color:var(--muted)">▼</span></span>
        <strong style="font-size:20px;font-family:'Rajdhani',sans-serif">${fmtNum(collectionLevel)}</strong>
      </div>
      <div id="${scope}-cl-breakdown-max" style="display:none;padding:6px 0 4px;border-bottom:1px solid var(--border);margin-bottom:2px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:2px 0"><span>Cards (levels)</span><span>+${fmtNum(cardLevelCL)}</span></div>
        ${evolvedCount > 0 ? `<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:2px 0"><span>Evolutions (×5 each)</span><span style="color:var(--blue)">+${evolvedCount * 5} (${evolvedCount} evos)</span></div>` : ''}
        ${heroCount > 0 ? `<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:2px 0"><span>Heroes (×5 each)</span><span style="color:var(--purple)">+${heroCount * 5} (${heroCount} heroes)</span></div>` : ''}
      </div>
      <div class="stat-row"><span class="stat-label">Next milestone</span><strong>${fmtNum(nextMilestone)}</strong></div>
      <div class="progress-wrap mt8">
        <div class="progress-bar" style="width:${milestoneProgress}%;background:var(--blue)"></div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${collectionLevel - prevMilestone} / ${nextMilestone - prevMilestone} levels to next milestone</div>
    </div>

    ${(() => {
      // Suggested Upgrades — scoped to whole account or a specific recent deck.
      const ctx = makePlanCtx(scope, data, planDeckOptions(data, battles, scope));
      const selStyle = "width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center;margin-bottom:10px";
      return `
        <div class="card">
          <h3 style="margin-bottom:6px">💡 Suggested Upgrades</h3>
          <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Cheapest upgrades you can do right now</p>
          <select onchange="setSuggestMode('${scope}', this.value)" style="${selStyle}">
            <option value="account">Whole account</option>
            ${ctx.decks.map(planDeckOptionHTML).join('')}
          </select>
          <div id="${scope}-suggested-output">${buildSuggestedOutput(ctx)}</div>
        </div>
        ${renderUpgradePlanner(ctx)}`;
    })()}`;
}

// Overview numbers open the list they count: "Upgradable now 54" → the Cards tab
// filtered to exactly those 54 (no leftover rarity or search filter).
window.ovGo = function(scope, tab, filter = '') {
  if (scope === 'f') {
    friendTab(tab);  // resets the modal pane's filters
    if (tab === 'cards' && filter) friendSetCard(filter, 'status');
    if (tab === 'evolutions' && filter) friendSetEvo(filter);
    if (tab === 'heroes' && filter) friendSetHero(filter);
    return;
  }
  if (tab === 'cards') {
    _cardRarity = 'all'; _cardLevel = 'all'; _cardSearch = '';
    const rar = document.getElementById('card-rarity-select'), q = document.getElementById('card-name-search');
    const lev = document.getElementById('card-level-select');
    if (rar) rar.value = 'all';
    if (lev) lev.value = 'all';
    if (q) q.value = '';
    switchTab('cards');
    setCardFilter(filter || 'all', 'status');
    return;
  }
  if (tab === 'evolutions') _evoFilter = filter || 'all';
  if (tab === 'heroes') _heroFilter = filter || 'all';
  switchTab(tab);
  // Already built? Apply now; otherwise loadEvolutionsGrid / loadHeroesGrid will
  if (tab === 'evolutions') setEvoFilter(_evoFilter);
  if (tab === 'heroes') setHeroFilter(_heroFilter);
};

// ── Cards pane ──
let _cardData = [];
let _cardFilter = 'all';
let _cardRarity = 'all';
let _cardLevel  = 'all';
let _cardSort   = DEFAULT_CARD_SORT;
let _cardSearch = '';

function renderCardsPane(data) {
  _cardData  = data.cards || [];
  _cardFilter = 'all';
  _cardRarity = 'all';
  _cardLevel  = 'all';
  _cardSort   = DEFAULT_CARD_SORT;
  _cardSearch = '';
  const totalCards = allCards.length || _cardData.length;
  return `
    <div style="font-size:13px;color:var(--muted);margin-bottom:12px">
      ${_cardData.length} / ${totalCards} cards unlocked
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <select id="card-rarity-select" onchange="setCardFilter(this.value,'rarity')"
        style="flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center">
        ${cardRarityOptionsHTML()}
      </select>
      <select id="card-level-select" onchange="setCardFilter(this.value,'level')"
        style="flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center">
        ${cardLevelOptionsHTML(_cardData)}
      </select>
    </div>
    <select id="card-sort-select" onchange="setCardFilter(this.value,'sort')"
      style="width:100%;margin-bottom:10px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center">
      ${cardSortOptionsHTML()}
    </select>
    <div class="filter-bar" id="card-status-filter">
      <button class="filter-btn active" onclick="setCardFilter('all','status')">All</button>
      <button class="filter-btn" onclick="setCardFilter('upgradable','status')">Upgradable</button>
      <button class="filter-btn" onclick="setCardFilter('canmax','status')">Can Max</button>
      <button class="filter-btn" onclick="setCardFilter('maxed','status')">Maxed</button>
      ${totalCards > _cardData.length ? `<button class="filter-btn" onclick="setCardFilter('notfound','status')">Not Found</button>` : ''}
    </div>
    <input type="text" id="card-name-search" placeholder="🔍 Search card name…" oninput="setCardSearch(this.value)" autocomplete="off"
      style="width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:13px;font-family:'Inter',sans-serif;margin-bottom:10px">
    <div id="cards-grid"></div>`;
}

window.setCardFilter = function(val, type) {
  if (type === 'status') {
    _cardFilter = val;
    document.querySelectorAll('#card-status-filter .filter-btn').forEach(b =>
      b.classList.toggle('active', b.getAttribute('onclick').includes(`'${val}'`))
    );
  }
  if (type === 'rarity') _cardRarity = val;
  if (type === 'level')  _cardLevel  = val;
  if (type === 'sort')   _cardSort   = val;
  renderCards();
};

window.setCardSearch = function(val) {
  _cardSearch = (val || '').toLowerCase().trim();
  renderCards();
};

function renderCards() {
  const grid = document.getElementById('cards-grid');
  if (!grid) return;

  const catalogStarMax = catalogStarMaxMap();
  const cards = prepareCardList(_cardData,
    { rarity:_cardRarity, level:_cardLevel, search:_cardSearch, status:_cardFilter, sort:_cardSort });

  if (!cards.length) {
    grid.innerHTML = '<div class="empty-msg">No cards match this filter.</div>';
    return;
  }

  grid.innerHTML = cards.map(c => {
    if (!c.owned) return unownedCardRowHTML(c);
    const needed = c.nextStep ? c.nextStep.cards : 0;
    const owned  = c.count || 0;
    const pct    = c.isMaxed ? 100 : needed ? Math.min(100, Math.round(owned / needed * 100)) : 0;
    const statusLabel = c.isMaxed ? '<span class="badge badge-gold">MAX ★</span>'
      : c.isUpgradable ? '<span class="badge badge-green">Ready</span>'
      : c.canMax       ? '<span class="badge badge-blue">Can Max</span>'
      : '';

    // Inline next-level deficit (non-maxed) + tap-to-expand for every card.
    // Expand: Lv 1-14 shows totals to Lv 16; Lv 15-16 shows only Open in Calculator.
    const stepDeficit = !c.isMaxed && c.nextStep ? Math.max(0, c.nextStep.cards - owned) : 0;
    const showFullExpand = !c.isMaxed && c.disp <= 14;
    const toMax = showFullExpand ? computeUpgrade(c.r, c.disp, owned, MAX_LEVEL) : null;
    const closedLabel = showFullExpand ? '▼ Total to Lv 16' : '▼ Options';
    const domId   = `card-${c.id}`;

    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px">
      <div class="flex-between mb8">
        <div style="display:flex;align-items:center;gap:10px">
          ${c.iconUrls?.medium ? `<img src="${c.iconUrls.medium}" alt="${esc(c.name)}" style="width:52px;height:64px;object-fit:contain;flex-shrink:0" loading="lazy" decoding="async">` : ''}
          <div>
            <span style="font-weight:600;font-size:15px">${esc(c.name)}</span><br>
            <span style="font-size:11px;color:${RARITY_COLOR[c.r]||'var(--muted)'}">${c.r.charAt(0).toUpperCase()+c.r.slice(1)}</span>
            ${(() => { const sl = c.starLevel||0; const ms = c.maxStarLevel || catalogStarMax[c.id] || 0; return sl > 0 && ms > 0 ? `&nbsp;<span style="font-size:12px;letter-spacing:1px">${'<span style="color:#FFD700">★</span>'.repeat(Math.min(sl,ms))}${'<span style="color:#555577">★</span>'.repeat(Math.max(0,ms-Math.min(sl,ms)))}</span>` : ''; })()}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span style="font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:var(--accent)">Lv ${c.disp}</span>
          ${statusLabel}
        </div>
      </div>
      ${!c.isMaxed && c.nextStep ? `
        <div class="flex-between" style="font-size:12px;color:var(--muted);margin-bottom:4px">
          <span>Cards: ${fmtNum(owned)} / ${fmtNum(needed)}</span>
          <span>${fmtNum(c.nextStep.gold)} 💰 to Lv ${c.disp+1}</span>
        </div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;background:${c.isUpgradable?'var(--green)':'var(--blue)'}"></div></div>
      ` : `
        <div style="font-size:12px;color:var(--accent);font-weight:600">Fully maxed! ✓</div>
      `}
      ${!c.isMaxed && c.nextStep ? `
        <div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--border)">
          <div class="flex-between" style="font-size:12px;color:var(--muted)">
            <span>Cards still needed to Lv ${c.disp+1}</span>
            <span class="${stepDeficit > 0 ? 'text-red' : 'text-green'}">${stepDeficit > 0 ? '+'+fmtNum(stepDeficit) : '✓ Enough cards'}</span>
          </div>
        </div>
      ` : ''}
      ${showFullExpand ? `
        <div onclick="toggleCardMax('${domId}')" style="cursor:pointer;margin-top:6px;font-size:11px;color:var(--muted);text-align:center;user-select:none">
          <span id="${domId}-toggle" data-closed="${closedLabel}">${closedLabel}</span>
        </div>
        <div id="${domId}-max" style="display:none;margin-top:6px">
          <div class="flex-between" style="font-size:12px;color:var(--muted);margin-bottom:4px">
            <span>Cards still needed to Lv 16</span>
            <span class="${toMax.totalCards > 0 ? 'text-red' : 'text-green'}">${toMax.totalCards > 0 ? '+'+fmtNum(toMax.totalCards) : '✓ Enough cards'}</span>
          </div>
          <div class="flex-between" style="font-size:12px;color:var(--muted)">
            <span>Total gold to Lv 16</span>
            <span style="color:var(--accent)">${fmtNum(toMax.totalGold)} 💰</span>
          </div>
          <button class="btn btn-secondary btn-sm" style="margin-top:8px;width:100%" onclick="openInCalculator(${c.id})">🧮 Open in Calculator</button>
        </div>
      ` : ''}
    </div>`;
  }).join('');
}

function resetCalculator() {
  document.getElementById('card-search').value = '';
  document.getElementById('card-dropdown').classList.remove('open');
  const note = document.getElementById('card-lookup-note');
  if (note) note.style.display = 'none';
  document.getElementById('calc-rarity').value = 'common';
  document.getElementById('calc-current').value = MIN_LEVEL['common'];
  document.getElementById('calc-count').value = 0;
  document.getElementById('calc-target').value = MAX_LEVEL;
  calcUpdate();
}

function openInCalculator(cardId) {
  goTo('calc');
  const cat = allCards.find(c => c.id === cardId);   // regular cards only
  const pc  = _playerCardsById[cardId];               // cards + tower troops
  const name = cat?.name || pc?.name || '';
  let r = (cat?.rarity || pc?.rarity || 'common').toLowerCase();
  if (!LEVEL_DATA[r]) r = 'common';

  const search = document.getElementById('card-search');
  if (search) search.value = name;
  const dd = document.getElementById('card-dropdown');
  if (dd) dd.classList.remove('open');
  document.getElementById('calc-rarity').value = r;

  const note = document.getElementById('card-lookup-note');
  if (pc) {
    const disp = toDisplayLevel(r, pc.level);
    document.getElementById('calc-current').value = disp;
    document.getElementById('calc-count').value = pc.count || 0;
    document.getElementById('calc-target').value = MAX_LEVEL;
    if (note) { note.textContent = `Loaded your ${name}: Level ${disp}, ${fmtNum(pc.count||0)} cards`; note.style.display = 'block'; }
  }
  calcUpdate();
  const res = document.getElementById('calc-result');
  if (res) res.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleCardMax(id) {
  const el     = document.getElementById(id + '-max');
  const toggle = document.getElementById(id + '-toggle');
  if (!el) return;
  const opening = el.style.display === 'none' || el.style.display === '';
  el.style.display = opening ? 'block' : 'none';
  if (toggle) {

function humanizeBadgeName(name) {

    .replace(/([A-Za-z])(\d)/g, '$1 $2')
