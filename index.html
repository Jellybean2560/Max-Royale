// King level and collection level as the profile header shows them: CL is every
// card's level, +5 per evolution and per hero, plus the tower troops' levels.
function profileLevels(data) {
  const cards = data.cards || [];
  const disp = c => toDisplayLevel((c.rarity||'common').toLowerCase(), c.level);
  const evoIds  = new Set(allCards.filter(hasEvoForm).map(c => c.id));
  const heroIds = new Set(allCards.filter(hasHeroForm).map(c => c.id));
  const evos = cards.filter(c => evoIds.has(c.id) && ownsEvo(c)).length;
  const heroes = cards.filter(c => heroIds.has(c.id) && ownsHero(c)).length;
  const cl = cards.reduce((s, c) => s + disp(c), 0) + evos * 5 + heroes * 5
           + (data.supportCards||[]).reduce((s, c) => s + disp(c), 0);
  return { king: calcKingTowerLevel(cards.map(disp)), cl, evos, heroes };
}

// "updated 12 min ago" at the end of the header's info line, so stale data is
// obvious — a browser tab never refreshes by itself. Turns gold after an hour.
function fmtAgo(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} h ago`;
  const d = Math.floor(h / 24);
  return `${d} day${d > 1 ? 's' : ''} ago`;
}
let _profileRefreshing = false;
function updateProfileAge() {
  const el = document.getElementById('ph-updated');
  if (!el) return;
  const at = window._currentProfile?.savedAt;
  el.classList.remove('stale');
  if (_profileRefreshing) { el.textContent = ' · ↻ updating…'; return; }
  if (!at) { el.textContent = ''; return; }
  el.textContent = ` · updated ${fmtAgo(Date.now() - at)}`;
  el.classList.toggle('stale', Date.now() - at > 60 * 60 * 1000);
  el.title = 'Last refreshed ' + new Date(at).toLocaleString();
}
setInterval(updateProfileAge, 30000);

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Upgrade Planner ──
const RARITY_DISPLAY_NAME = { common:'Common', rare:'Rare', epic:'Epic', legendary:'Legendary', champion:'Champion' };
const RARITY_COLOR_MAP = { common:'var(--text)', rare:'var(--blue)', epic:'var(--purple)', legendary:'var(--accent)', champion:'#e74c3c' };
const RARITY_ORDER_KEYS = ['common','rare','epic','legendary','champion'];
// The profile Overview and the friend modal's Overview each render Suggested
// Upgrades and the Upgrade Planner, and both can be in the DOM at once. Each gets
// its own context — data, decks, selections — and its own element ids, keyed by
// scope ('p' = profile, 'f' = friend), so neither can read or redraw the other.
const _planCtx = {};
function makePlanCtx(scope, data, decks) {
  return (_planCtx[scope] = { scope, data, decks, planMode: 'account', planTarget: MAX_LEVEL, suggestMode: 'account' });
}

function cardsToMaxStats(c, target) {
  const r = (c.rarity||'common').toLowerCase();
  const disp = toDisplayLevel(r, c.level);
  if (disp >= target) return { needed: 0, gold: 0, rarity: r };
  const { totalCards, totalGold } = computeUpgrade(r, disp, c.count||0, target);
  return { needed: totalCards, gold: totalGold, rarity: r };
}
function buildPlanSummary(cards, target) {
  const byR = {};
  RARITY_ORDER_KEYS.forEach(r => byR[r] = { needed: 0, gold: 0 });
  let totalNeeded = 0, totalGold = 0;
  cards.forEach(c => {
    const s = cardsToMaxStats(c, target);
    if (byR[s.rarity]) { byR[s.rarity].needed += s.needed; byR[s.rarity].gold += s.gold; }
    totalNeeded += s.needed; totalGold += s.gold;
  });
  return { byR, totalNeeded, totalGold };
}
// ── Deck history persistence ──
// The battle log only returns the ~25-30 most recent games, so deck win/loss
// totals would otherwise reset every time older battles scroll out of that
// window. We keep a running tally per player tag in localStorage, deduped by
// each battle's battleTime (unique per battle) so re-fetching the same
// overlapping battles on every load never double-counts.
function loadDeckHistory(tag) {
  try {
    const all = JSON.parse(localStorage.getItem('cr_deck_history_v1') || '{}');
    return all[tag] || { decks: {}, seen: [] };
  } catch(e) { return { decks: {}, seen: [] }; }
}
function saveDeckHistory(tag, history) {
  try {
    const all = JSON.parse(localStorage.getItem('cr_deck_history_v1') || '{}');
    history.at = Date.now();
    all[tag] = history;
    pruneHistoryTags(all, h => h.at || 0);
    localStorage.setItem('cr_deck_history_v1', JSON.stringify(all));
  } catch(e) {}
}

// Every profile seen keeps its own history (friends and clan members too, under
// their own tag); persist:false builds the map from these battles alone.
function buildDeckMapFromBattles(battles, playerTag, { persist = true } = {}) {
  const history = persist ? loadDeckHistory(playerTag) : { decks: {}, seen: [] };
  const seen = new Set(history.seen);
  let changed = false;

  (battles||[]).forEach(b => {
    const battleKey = b.battleTime;
    if (!battleKey || seen.has(battleKey)) return;

    const team = (playerTag && (b.team||[]).find(p => p.tag === playerTag)) || (b.team||[])[0] || {};
    if ((team.cards||[]).length !== 8) return; // a real deck is always 8 cards — anything else is a bad/mismatched record (e.g. tag-match fallback picking up the wrong entry)
    const key = deckKeyOf(team.cards);
    const tC = (b.team||[])[0]?.crowns||0, oC = (b.opponent||[])[0]?.crowns||0;
    const result = tC > oC ? 'win' : tC < oC ? 'loss' : 'draw';

    let d = history.decks[key];
    if (!d) {
      // Decks tallied before evo/hero tracking were keyed by card names alone.
      // The first time that card set is played again, it adopts the old tally.
      const legacyKey = team.cards.map(c => c.name).sort().join('|');
      const legacy = legacyKey !== key && history.decks[legacyKey];
      if (legacy && !legacy.variants) { d = legacy; delete history.decks[legacyKey]; }
      else d = { wins:0, losses:0, draws:0, modes:[], elixirSum:0, elixirCount:0 };
      history.decks[key] = d;
    }
    if (!d.variants) {
      // Battles arrive newest-first, so this is the deck as last played. Slot order
      // is kept so evolutions, heroes and champions sit in the first three tiles.
      d.cards = team.cards.map(c => c.name);
      d.variants = deckVariantsOf(team.cards);
    }
    d[result === 'loss' ? 'losses' : result + 's']++;
    if (!d.last || b.battleTime > d.last) d.last = b.battleTime;
    const modeLabel = battleModeLabel(b);
    if (!d.modes.includes(modeLabel)) d.modes.push(modeLabel);
    const avg = (team.cards||[]).reduce((s,c) => s + (c.elixirCost||0), 0) / Math.max((team.cards||[]).length,1);
    d.elixirSum += avg;
    d.elixirCount++;

    seen.add(battleKey);
    changed = true;
  });

  // Decks counted before "last played" was tracked pick it up from whichever
  // battles are still in the log (already-seen ones aren't counted again above)
  (battles||[]).forEach(b => {
    const team = (playerTag && (b.team||[]).find(p => p.tag === playerTag)) || (b.team||[])[0] || {};
    const d = (team.cards||[]).length === 8 && history.decks[deckKeyOf(team.cards)];
    if (d && b.battleTime && (!d.last || b.battleTime > d.last)) { d.last = b.battleTime; changed = true; }
  });

  if (changed && persist) {
    history.seen = [...seen].slice(-300); // bound growth; far more than one battle log window
    saveDeckHistory(playerTag, history);
  }

  const deckMap = {};
  Object.entries(history.decks).forEach(([key, d]) => {
    if ((d.cards||[]).length !== 8) return; // drop any bad entry saved before the 8-card guard existed
    deckMap[key] = {
      key, cards: d.cards, variants: d.variants || {}, wins: d.wins, losses: d.losses, draws: d.draws, modes: d.modes, last: d.last || '',
      elixir: d.elixirCount ? [d.elixirSum / d.elixirCount] : []
    };
  });
  return deckMap;
}
// Most-played decks first, from this device's saved deck history for that player
function planDeckOptions(data, battles, scope) {
  const dm = buildDeckMapFromBattles(battles || [], data.tag);
  return Object.values(dm).sort((a,b) => (b.wins+b.losses+b.draws) - (a.wins+a.losses+a.draws)).slice(0,8);
}
const planDeckOptionHTML = (d, i) =>
  `<option value="deck-${i}">Deck #${i+1} · ${d.wins}W ${d.losses}L (${d.cards.slice(0,3).map(esc).join(', ')}…)</option>`;

function renderUpgradePlanner(ctx) {
  const { data, decks, scope } = ctx;

  // Detect the lowest display level so the dropdown only shows meaningful targets
  const allDisp = (data.cards||[]).map(c => toDisplayLevel((c.rarity||'common').toLowerCase(), c.level));
  const minDisp = allDisp.length ? Math.min(...allDisp) : 1;
  const lowestTarget = Math.min(minDisp + 1, MAX_LEVEL);

  const selStyle = "flex:1;min-width:0;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center";

    <div class="card">

      <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Cards &amp; gold needed by rarity to reach your target level</p>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <select onchange="setPlanMode('${scope}', this.value)" style="${selStyle}">
          <option value="account">Whole account</option>
          ${decks.map(planDeckOptionHTML).join('')}
        </select>
        <select onchange="setPlanTarget('${scope}', this.value)" style="${selStyle}">

function _redrawPlan(scope, key, val) {
  const ctx = _planCtx[scope]; if (!ctx) return;
  ctx[key] = val;
  const isSuggest = key === 'suggestMode';

}
window.setPlanMode    = (scope, v) => _redrawPlan(scope, 'planMode', v);
window.setPlanTarget  = (scope, v) => _redrawPlan(scope, 'planTarget', parseInt(v,10) || MAX_LEVEL);

// ── Suggested Upgrades (scoped by account or deck) ──
window.setSuggestMode = (scope, v) => _redrawPlan(scope, 'suggestMode', v);
function buildSuggestedOutput(ctx) {
  const data = ctx.data;
  if (!data) return '';
  const enriched = (data.cards||[]).map(c => {
    const r = (c.rarity||'common').toLowerCase();
    const disp = toDisplayLevel(r, c.level);
    const steps = LEVEL_DATA[r] || [];
    const minL  = MIN_LEVEL[r] || 1;
    const idx   = disp - minL;
    const isMaxed = disp >= MAX_LEVEL || idx >= steps.length;
    const nextStep = (!isMaxed && idx >= 0 && idx < steps.length) ? steps[idx] : null;
    const isUpgradable = !isMaxed && !!nextStep && (c.count||0) >= nextStep.cards;
    return { ...c, r, disp, isMaxed, nextStep, isUpgradable };
  });
  // Any non-maxed card with a defined next step is a candidate — even if the
  // player doesn't yet have enough cards. We rank by next-step gold cost and
  // show up to 5 cheapest. A ✓ vs +X cards still needed label tells the user
  // whether it's actually doable right now.
  let upgradable = enriched.filter(c => !c.isMaxed && c.nextStep);
  if (ctx.suggestMode.startsWith('deck-')) {
    const deck = ctx.decks[parseInt(ctx.suggestMode.slice(5),10)];
    if (!deck) return '<div class="empty-msg">Deck not found.</div>';
    const deckNames = new Set(deck.cards);
    upgradable = upgradable.filter(c => deckNames.has(c.name));
  }
  if (!upgradable.length) return '<div class="empty-msg">No upgrades available in this scope.</div>';
  const sorted = [...upgradable].sort((a,b) => (a.nextStep?.gold||0) - (b.nextStep?.gold||0)).slice(0,5);
  return sorted.map(c => {
    const deficit = Math.max(0, (c.nextStep?.cards||0) - (c.count||0));
    const readyLbl = deficit > 0
      ? `<span class="text-red" style="font-size:11px">+${fmtNum(deficit)} cards</span>`
      : `<span class="text-green" style="font-size:11px">✓ Ready</span>`;
    return `<div class="stat-row">
      <span class="stat-label" style="display:flex;align-items:center;gap:6px">
        ${c.iconUrls?.medium?`<img src="${c.iconUrls.medium}" alt="" style="width:22px;height:28px;object-fit:contain;flex-shrink:0">`:''}
        <span>${esc(c.name)} <span style="color:var(--muted);font-size:11px">(Lv ${c.disp}→${c.disp+1})</span></span>
      </span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
        <span class="stat-value text-accent">${fmtNum(c.nextStep?.gold)} 💰</span>
        ${readyLbl}
      </span>
    </div>`;
  }).join('');
}
function buildPlanOutput(ctx) {
  const data = ctx.data;
  if (!data) return '';
  let cards = data.cards || [];
  let titleSuffix = '';
  if (ctx.planMode.startsWith('deck-')) {
    const deck = ctx.decks[parseInt(ctx.planMode.slice(5),10)];
    if (!deck) return '<div class="empty-msg">Deck not found.</div>';
    const deckNames = new Set(deck.cards);
    cards = cards.filter(c => deckNames.has(c.name));
    titleSuffix = ` (deck)`;
  }
  const target = ctx.planTarget;
  const sum = buildPlanSummary(cards, target);
  const rows = RARITY_ORDER_KEYS.map(r => {
    const v = sum.byR[r];
    if (v.needed === 0 && v.gold === 0) return '';
    return `<div class="stat-row">
      <span class="stat-label" style="color:${RARITY_COLOR_MAP[r]};font-weight:600">${RARITY_DISPLAY_NAME[r]}</span>
      <span style="display:flex;gap:12px;align-items:center;font-size:13px"><span class="text-red">+${fmtNum(v.needed)}</span><span class="text-accent">${fmtNum(v.gold)} 💰</span></span>
    </div>`;
  }).filter(Boolean).join('');
  if (sum.totalNeeded === 0 && sum.totalGold === 0) {
    return `<div class="empty-msg">All cards already at Lv ${target}! 🎉</div>`;
  }
  return `${rows}
    <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-weight:700;font-size:14px">
      <span>Total${titleSuffix}</span>
      <span style="display:flex;gap:12px"><span class="text-red">+${fmtNum(sum.totalNeeded)}</span><span class="text-accent">${fmtNum(sum.totalGold)} 💰</span></span>
    </div>`;
}

let _deckUpMode = 'recent';            // 'recent' or 'custom'

let _deckUpTarget = MAX_LEVEL;

function renderDeckUpgradeScreen() {
  const screen = document.getElementById('screen-deckup');
  if (!screen) return;
  const profile = window._currentProfile;
  if (!profile || !profile.data) {
    screen.innerHTML = `
      <h2 style="margin-bottom:16px">⚔ Deck Upgrade</h2>
      <div class="card"><div class="empty-msg">Load a player profile first (Player tab → Search).</div></div>`;
    return;
  }
  const data = profile.data;
  const battles = profile.battles || [];
  if (data.tag !== _deckUpTag) {
    // A custom deck is a list of card ids — on another account it would show a
    // count of cards that aren't in the slots. Start over per account.
    _deckUpTag = data.tag;
    _deckUpCustomIds = []; _deckUpSelectedDeckIdx = 0; _deckUpSearch = '';
  }
  const tracked = Object.values(buildDeckMapFromBattles(battles, data.tag))
    .sort((a,b) => (b.wins+b.losses+b.draws) - (a.wins+a.losses+a.draws))
    .slice(0,10);
  // The deck equipped in-game right now comes first, so it's the default
  const current = (data.currentDeck || []).length ? [{ cards: data.currentDeck.map(c => c.name), current: '1v1' }] : [];
  const deck2v2 = latest2v2Deck(battles, data.tag);
  const setKey = names => [...names].sort().join('|');
  if (deck2v2 && setKey(deck2v2.map(c => c.name)) !== setKey(current[0]?.cards || []))
    current.push({ cards: deck2v2.map(c => c.name), current: '2v2' });
  const decks = [...current, ...tracked];
  const deckLabel = (d, i) => d.current
    ? `🃏 Current ${d.current} deck (${d.cards.slice(0,3).map(esc).join(', ')}…)`
    : `Deck #${i + 1 - current.length} · ${d.wins}W ${d.losses}L (${d.cards.slice(0,3).map(esc).join(', ')}…)`;

  const modeBar = `

      <button class="filter-btn ${_deckUpMode==='custom'?'active':''}" onclick="setDeckUpMode('custom')">Custom Deck</button>
      <button class="filter-btn ${_deckUpMode==='saved'?'active':''}" onclick="setDeckUpMode('saved')">⭐ Saved (${loadSavedDecks().length})</button>
      <button class="filter-btn ${_deckUpMode==='compare'?'active':''}" onclick="setDeckUpMode('compare')">⚖️ Compare</button>
    </div>`;

  let body = '';
  if (_deckUpMode === 'recent') {
    if (!decks.length) {
      body = '<div class="empty-msg">No recent decks found in your battle log.</div>';
    } else {
      if (_deckUpSelectedDeckIdx >= decks.length) _deckUpSelectedDeckIdx = 0;
      body = `
        <select onchange="setDeckUpRecent(this.value)" style="width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:13px;margin-bottom:12px;appearance:none;-webkit-appearance:none;text-align:center">
          ${decks.map((d,i) => `<option value="${i}" ${i===_deckUpSelectedDeckIdx?'selected':''}>${deckLabel(d, i)}</option>`).join('')}

      const deck = decks[_deckUpSelectedDeckIdx];
      const names = new Set(deck.cards);

  } else if (_deckUpMode === 'compare') {

  } else {

  }

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin:0">⚔ Deck Upgrade</h2>

      ${targetSel}
    </div>
    ${modeBar}
    <div class="card">${body}</div>`;
}

// ── Deck compare: two decks side by side — the decks in use, your tracked decks
// and saved decks — with elixir, archetype, your record, your levels and the gold
// to bring each to the target, and top players' record with the exact deck ──
let _deckCmp = [0, 1];
function deckCompareOptions(data, battles, decks) {
  const out = [];

    if (d.variants) return d.variants;
    if (d.current === '1v1') { const f = currentDeckVariants(data.currentDeck, battles, data.tag), v = {}; data.currentDeck.forEach((c, i) => { if (f[i]) v[c.name] = f[i]; }); return v; }
    if (d.current === '2v2') return deckVariantsOf(latest2v2Deck(battles, data.tag) || []);
    return {};
  };
  decks.forEach((d, i) => {
    const v = formsOf(d);
    out.push({ label: d.current ? `🃏 Current ${d.current} deck` : `Deck #${i + 1 - decks.filter(x => x.current).length} · ${d.wins}W ${d.losses}L`, cards: deckSlotNames(d.cards, v).map(n => ({ name: n, form: v[n] || '' })) });
  });
  loadSavedDecks().forEach(d => out.push({ label: `⭐ ${d.from || 'Saved deck'}`, cards: d.cards }));

}
function deckCompareHTML(data, battles, decks, tracked) {

  _deckCmp = _deckCmp.map((x, i) => x < opts.length ? x : i);
  if (!_meta) { try { _meta = JSON.parse(localStorage.getItem(META_CACHE_KEY) || 'null'); } catch(e) {} }
  const P = _meta?.data ? metaParsed(_meta.data) : null;
  const history = buildDeckMapFromBattles(battles, data.tag);
  const owned = Object.fromEntries((data.cards || []).map(c => [c.name, c]));
  const byName = Object.fromEntries(allCards.map(c => [c.name, c]));
  const art = buildCardArtMap(battles);
  const info = [0, 1].map(k => {
    const o = opts[_deckCmp[k]], names = o.cards.map(c => c.name);
    const costs = names.map(n => byName[n]?.elixirCost).filter(x => x != null);
    const levels = names.map(n => owned[n]).filter(Boolean).map(cardDisplayLevel);
    const gold = names.reduce((sum, n) => {
      const c = owned[n]; if (!c) return sum;
      const l = cardDisplayLevel(c);
      return l < _deckUpTarget ? sum + computeUpgrade((c.rarity || 'common').toLowerCase(), l, c.count || 0, _deckUpTarget).totalGold : sum;
    }, 0);
    const mine = history[o.cards.map(c => c.form ? `${c.name}[${c.form}]` : c.name).sort().join('|')];
    const metaKey = o.cards.map(c => { const id = byName[c.name]?.id; return id == null ? null : id + (c.form === 'evo' ? 'e' : c.form === 'hero' ? 'h' : ''); });
    const exact = P && !metaKey.includes(null) ? P.decks.find(d => d.key === metaKey.slice().sort().join(',')) : null;
    return { o, names, elixir: costs.length === 8 ? costs.reduce((a, b) => a + b, 0) / 8 : null,
      wincons: META_WIN_CONS.filter(w => names.includes(w)), avgLv: levels.length ? levels.reduce((a, b) => a + b, 0) / levels.length : null,
      locked: names.filter(n => !owned[n]), gold, mine, exact };
  });
  const sel = k => `<select onchange="setDeckCmp(${k}, this.value)" style="${CLAN_SELECT_STYLE};margin-bottom:8px">
      ${opts.map((o, i) => `<option value="${i}"${i === _deckCmp[k] ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
  const shared = info[0].names.filter(n => info[1].names.includes(n));
  // One row: label, then each deck's value; better marks the side that wins (1 = higher is better, -1 = lower)
  const row = (label, vals, nums, better) => {
    const best = better && nums[0] != null && nums[1] != null && nums[0] !== nums[1] ? ((nums[0] > nums[1]) === (better > 0) ? 0 : 1) : -1;
    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
      <div style="grid-column:1 / -1;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">${label}</div>
      ${vals.map((v, i) => `<div style="font-size:13px;${best === i ? 'color:var(--green);font-weight:700' : ''}">${v}</div>`).join('')}
    </div>`;
  };
  const rec = d => d ? `${d.wins}W ${d.losses}L${d.draws ? ` ${d.draws}D` : ''} · ${Math.round(d.wins / Math.max(d.wins + d.losses + d.draws, 1) * 100)}%` : '—';

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${[0, 1].map(k => `<div style="min-width:0">${sel(k)}
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px">${info[k].o.cards.map(c => deckTileHTML(c.name, c.form, art[c.name], 'deck-list-tile')).join('')}</div>
      </div>`).join('')}
    </div>
    <div style="margin-top:10px">
      ${row('Avg elixir', info.map(x => x.elixir != null ? `💧 ${x.elixir.toFixed(1)}` : '—'), info.map(x => x.elixir), -1)}
      ${row('Archetype', info.map(x => x.wincons.length ? x.wincons.map(esc).join(' + ') : '<span class="text-muted">no win condition from the list</span>'))}
      ${row('Your record', info.map(x => rec(x.mine)), info.map(x => x.mine && x.mine.wins + x.mine.losses + x.mine.draws >= 3 ? recN(x.mine) : null), 1)}
      ${row('Top players', info.map(x => x.exact ? `${fmtNum(x.exact.n)} games · ${Math.round(x.exact.rate * 100)}%` : `<span class="text-muted">${P ? 'not in the top 300' : 'open Meta once'}</span>`), info.map(x => x.exact?.rate ?? null), 1)}
      ${row('Your avg level', info.map(x => x.avgLv != null ? x.avgLv.toFixed(1) : '—'), info.map(x => x.avgLv), 1)}
      ${row(`Gold to Lv ${_deckUpTarget}`, info.map(x => x.gold ? `${fmtNum(x.gold)} 💰` : '<span class="text-green">at target ✓</span>'), info.map(x => x.gold), -1)}
      ${info.some(x => x.locked.length) ? row('Not unlocked', info.map(x => x.locked.length ? `<span class="text-red">${x.locked.map(esc).join(', ')}</span>` : '—')) : ''}
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">${shared.length ? `${shared.length} card${shared.length === 1 ? '' : 's'} in common: ${shared.map(esc).join(', ')}` : 'No cards in common.'} · green = the better side</div>`;
}

// Card ids in a deck link — the game's share link
// (link.clashroyale.com/…copyDeck?deck=26000000;27000001;…) or any text holding
// them. Deck cards are 26… troops, 27… buildings, 28… spells; tower troop ids
// (159…) don't match. Falls back to a RoyaleAPI deck URL, which names the cards:
// royaleapi.com/decks/stats/hog-rider,musketeer-ev1,…
function parseDeckLinkIds(text) {
  const ids = [...new Set((String(text || '').match(/\b2[678]\d{6}\b/g) || []).map(Number))];
  if (ids.length) return ids.slice(0, 8);
  const slugs = String(text || '').match(/decks\/stats\/([^\/?#\s]+)/)?.[1];
  if (!slugs) return [];
  const slug = n => n.toLowerCase().replace(/\./g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const bySlug = Object.fromEntries(allCards.map(c => [slug(c.name), c.id]));
  return [...new Set(decodeURIComponent(slugs).split(',').map(x => bySlug[x.replace(/-(ev\d+|hero)$/, '')]).filter(Boolean))].slice(0, 8);
}
window.importDeckLink = function(text) {
  const msg = document.getElementById('deckup-link-msg');
  const say = (t, err) => { if (msg) { msg.textContent = t; msg.style.color = err ? 'var(--red)' : 'var(--muted)'; } };
  if (!window._currentProfile?.data) return;
  const ids = parseDeckLinkIds(text);
  if (!ids.length) { say("That doesn't look like a deck link.", true); return; }
  loadDeckIds(ids);
};
// Puts these card ids in the custom deck (Deck Upgrade must be on screen in
// Custom mode) and names any you haven't unlocked
function loadDeckIds(ids) {
  const data = window._currentProfile?.data;
  const msg = document.getElementById('deckup-link-msg');
  if (!data) return;
  const owned = new Set((data.cards || []).map(c => c.id));
  const missing = ids.filter(id => !owned.has(id)).map(id => allCards.find(c => c.id === id)?.name || `card ${id}`);
  _deckUpCustomIds = ids.filter(id => owned.has(id)).slice(0, 8);
  _deckUpSearch = '';
  const input = document.getElementById('deckup-link-input');
  if (input) input.value = '';
  refreshCustomDeckSections();
  if (msg) {
    msg.textContent = missing.length ? `✓ Deck loaded. Not unlocked yet: ${missing.join(', ')}` : '✓ Deck loaded.';
    msg.style.color = 'var(--muted)';
  }
}

// App shortcuts (manifest shortcuts, long-press the icon) open ?screen=<name>
const SHORTCUT_SCREENS = ['meta', 'calc', 'friends', 'clan', 'deckup'];
function takeStartScreen() {
  const screen = new URLSearchParams(location.search).get('screen');
  if (!screen) return;
  history.replaceState(null, '', location.pathname);
  if (SHORTCUT_SCREENS.includes(screen)) goTo(screen);
}

// A deck shared to the installed app (manifest share_target) arrives as
// ?title=&text=&url= — open it in Deck Upgrade once the profile is on screen.
function takeSharedDeck() {
  const q = new URLSearchParams(location.search);
  const text = ['title', 'text', 'url'].map(k => q.get(k) || '').join(' ').trim();
  if (!text) return;
  history.replaceState(null, '', location.pathname);
  if (!parseDeckLinkIds(text).length) return;
  _deckUpMode = 'custom';
  goTo('deckup');
  importDeckLink(text);
}

function buildDeckUpSlots(selectedCards) {
  return Array.from({length:8}, (_,i) => {
    const c = selectedCards[i];
    if (!c) return `<div style="background:var(--surface2);border:1px dashed var(--border);border-radius:8px;aspect-ratio:0.83;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px">Slot ${i+1}</div>`;
    const r = (c.rarity||'common').toLowerCase();
    const disp = toDisplayLevel(r, c.level);
    return `<div onclick="removeDeckUpCard(${c.id})" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:4px;cursor:pointer;position:relative;aspect-ratio:0.83;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden">
      ${c.iconUrls?.medium ? `<img src="${c.iconUrls.medium}" alt="${esc(c.name)}" style="max-width:100%;max-height:calc(100% - 16px);width:auto;height:auto;object-fit:contain;display:block" loading="lazy" decoding="async">` : '<div></div>'}
      <div style="font-size:10px;font-weight:700;color:var(--accent);text-align:center;width:100%">Lv ${disp}</div>
      <span style="position:absolute;top:2px;right:4px;color:var(--red);font-size:14px;font-weight:700">×</span>
    </div>`;
  }).join('');
}

function buildDeckUpSuggestions(data) {
  if (!_deckUpSearch || _deckUpCustomIds.length >= 8) return '';
  const matches = data.cards
    .filter(c => !_deckUpCustomIds.includes(c.id) && (c.name||'').toLowerCase().includes(_deckUpSearch))
    .slice(0,10);
  if (!matches.length) return '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">No matching cards in your collection.</div>';
  return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;max-height:280px;overflow-y:auto">
    ${matches.map(c => {
      const r = (c.rarity||'common').toLowerCase();
      const disp = toDisplayLevel(r, c.level);
      return `<div onclick="addDeckUpCard(${c.id})" style="display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--border)">
        ${c.iconUrls?.medium?`<img src="${c.iconUrls.medium}" alt="" style="width:28px;height:34px;object-fit:contain;flex-shrink:0">`:''}
        <span style="flex:1">${esc(c.name)}</span>
        <span style="font-size:11px;color:var(--muted)">Lv ${disp}</span>
      </div>`;
    }).join('')}
  </div>`;
}

function renderDeckBreakdown(cards) {
  if (!cards.length) return '<div class="empty-msg">No cards.</div>';
  const target = _deckUpTarget;
  const enriched = cards.map(c => {
    const r = (c.rarity||'common').toLowerCase();
    const disp = toDisplayLevel(r, c.level);
    const s = cardsToMaxStats(c, target);
    return { ...c, r, disp, needed: s.needed, gold: s.gold };
  }).sort((a,b) => (b.gold||0) - (a.gold||0));

  const rows = enriched.map(c => `
    <div class="stat-row">
      <span class="stat-label" style="display:flex;align-items:center;gap:8px;min-width:0">
        ${c.iconUrls?.medium ? `<img src="${c.iconUrls.medium}" alt="" style="width:32px;height:40px;object-fit:contain;flex-shrink:0">` : ''}
        <span style="display:flex;flex-direction:column;min-width:0">
          <span style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</span>
          <span style="font-size:11px;color:${RARITY_COLOR_MAP[c.r]||'var(--muted)'}">${RARITY_DISPLAY_NAME[c.r]||c.r} · Lv ${c.disp}${c.disp>=MAX_LEVEL?' (maxed)':c.disp>=target?' (at target)':' → '+target}</span>
        </span>
      </span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px">
        <span class="${c.needed>0?'text-red':'text-green'}">${c.needed>0?'+'+fmtNum(c.needed)+' cards':'✓ Enough'}</span>
        <span class="text-accent">${fmtNum(c.gold)} 💰</span>
      </span>
    </div>`).join('');

  // Rarity totals
  const byR = {};
  RARITY_ORDER_KEYS.forEach(r => byR[r] = { needed: 0, gold: 0 });
  let totalNeeded = 0, totalGold = 0;
  enriched.forEach(c => {
    if (byR[c.r]) { byR[c.r].needed += c.needed; byR[c.r].gold += c.gold; }
    totalNeeded += c.needed; totalGold += c.gold;
  });
  const rarityRows = RARITY_ORDER_KEYS.map(r => {
    const v = byR[r];
    if (!v.needed && !v.gold) return '';
    return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0">
      <span style="color:${RARITY_COLOR_MAP[r]};font-weight:600">${RARITY_DISPLAY_NAME[r]}</span>
      <span style="display:flex;gap:12px"><span class="text-red">+${fmtNum(v.needed)}</span><span class="text-accent">${fmtNum(v.gold)} 💰</span></span>
    </div>`;
  }).filter(Boolean).join('');

  return `
    ${rows}
    <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border)">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Totals by rarity</div>
      ${rarityRows}
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-weight:700;font-size:14px">
        <span>Total to Lv ${target}</span>
        <span style="display:flex;gap:12px"><span class="text-red">+${fmtNum(totalNeeded)}</span><span class="text-accent">${fmtNum(totalGold)} 💰</span></span>
      </div>
    </div>`;
}

// ── Overview: account + battle stats ──
// All straight from /players/{tag} (plus the battle log for the per-mode split),

const OV_SECTION_STYLE = "margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px";
const ovRow = (label, value, cls = '') =>
  `<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-value ${cls}">${value}</span></div>`;
const pct = (n, total) => total ? (n / total * 100).toFixed(1) + '%' : '—';

// Days played comes from the YearsPlayed badge, whose progress counts days.
function accountAgeDays(data) {
  return (data.badges || []).find(b => b.name === 'YearsPlayed')?.progress || 0;
}
function fmtAge(days) {
  const y = Math.floor(days / 365), w = Math.floor(days % 365 / 7), d = days % 365 % 7;
  return `${y}y ${w}w ${d}d`;
}
// The API has no playtime, so estimate it at 4 minutes a game — the same
// assumption deckai.app makes (its 493h 36m for 7,404 games is exactly that).
const EST_MINUTES_PER_GAME = 4;
const fmtHours = mins => `${Math.floor(mins / 60)}h ${Math.round(mins % 60)}m`;
const badgeProgress = (data, name) => (data.badges || []).find(b => b.name === name)?.progress || 0;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtSeasonId = id => { const [y, m] = (id || '').split('-'); return m ? `${MONTHS[+m - 1]} ${y}` : ''; };

// Everything found — cards + evolutions + heroes + tower troops — against the
// catalog, in total and per kind as [found, total]. Same ownership rules as the
// Overview's Evolutions & Heroes counts.
function cardsFoundCounts(data) {
  const cards = data.cards || [], troops = data.supportCards || [];
  const evoIds  = new Set(allCards.filter(hasEvoForm).map(c => c.id));
  const heroIds = new Set(allCards.filter(hasHeroForm).map(c => c.id));
  const evos = cards.filter(c => evoIds.has(c.id) && ownsEvo(c)).length;
  const heroes = cards.filter(c => heroIds.has(c.id) && ownsHero(c)).length;
  const kinds = {
    cards:  [cards.length, Math.max(allCards.length, cards.length)],
    evos:   [evos, evoIds.size],
    heroes: [heroes, heroIds.size],
    troops: [troops.length, Math.max(_towerTroopTotal, troops.length)],
  };
  const sum = i => Object.values(kinds).reduce((s, k) => s + k[i], 0);
  return { found: sum(0), total: sum(1), ...kinds };
}

// How many cards sit at each level, one bar per level split by rarity — folded
// out from the Account tab's Cards count
function cardLevelChartHTML(data, [found, total], scope) {
  const byLevel = {};
  (data.cards || []).forEach(c => {
    const r = (c.rarity || 'common').toLowerCase(), l = toDisplayLevel(r, c.level);
    (byLevel[l] || (byLevel[l] = {}))[r] = (byLevel[l][r] || 0) + 1;
  });
  const levels = Object.keys(byLevel).map(Number).sort((a, b) => b - a);
  if (!levels.length) return '<div class="empty-msg" style="padding:6px 0;font-size:12px">No cards yet.</div>';
  const count = l => Object.values(byLevel[l]).reduce((a, b) => a + b, 0);
  const most = Math.max(...levels.map(count));
  const used = RARITY_ORDER_KEYS.filter(r => levels.some(l => byLevel[l][r]));
  return levels.map(l => `
      <div onclick="openCardsAtLevel('${scope}',${l})" title="Show these cards" style="display:flex;align-items:center;gap:8px;padding:2px 0;font-size:12px;cursor:pointer">
        <span style="width:38px;flex-shrink:0;color:var(--muted)">Lv ${l}</span>
        <span style="flex:1;min-width:0;display:flex;height:12px">
          <span style="display:flex;width:${count(l) / most * 100}%;border-radius:3px;overflow:hidden;gap:1px">
            ${RARITY_ORDER_KEYS.filter(r => byLevel[l][r]).map(r => `<span title="${byLevel[l][r]} ${r}" style="flex:${byLevel[l][r]};background:${RARITY_COLOR[r]}"></span>`).join('')}
          </span>
        </span>
        <span style="width:24px;text-align:right;font-weight:700;flex-shrink:0">${count(l)}</span>
        <span style="color:var(--muted);font-size:14px;line-height:1">›</span>
      </div>`).join('')
    + (total > found ? `<div style="font-size:11px;color:var(--muted);margin-top:4px">+ ${total - found} not found yet</div>` : '')
    + `<div style="display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11px;color:var(--muted)">
        ${used.map(r => `<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:${RARITY_COLOR[r]}"></span>${r[0].toUpperCase() + r.slice(1)}</span>`).join('')}
      </div>`;
}

// ── Trophy history ──
// The API only knows today's numbers, so the history is built up on this device:
// a point whenever a refresh finds a new value, plus one for every ladder or Path
// of Legends battle still in the log (startingTrophies + trophyChange — exact, and
// dated to the battle, so the first look already has the last ~30 games). Path of
// Legends battles carry the ranked rating, not Trophy Road trophies, so that's a
// series of its own. Points are [time ms, value], oldest first.
const TROPHY_HISTORY_KEY = 'cr_trophy_history_v1';
const TROPHY_POINTS_MAX = 1000;
const TROPHY_SERIES = { road: 'Trophies', pol: 'Path of Legends' };

// 2v2 included) with a Ladder game mode; older logs used type 'PvP'
const isTrophyRoadBattle = b => (b.team || []).length === 1
  && (b.type === 'PvP' || (b.type === 'trail' && /^Ladder/i.test(b.gameMode?.name || '')));
function trophyPointsFromBattles(battles) {
  const pts = { road: [], pol: [] };
  (battles || []).forEach(b => {
    const me = (b.team || [])[0];
    if (!b.battleTime || me?.trophyChange == null || me.startingTrophies == null) return;
    const series = b.type === 'pathOfLegend' ? 'pol' : isTrophyRoadBattle(b) ? 'road' : '';
    if (series) pts[series].push([parseApiTime(b.battleTime).getTime(), me.startingTrophies + me.trophyChange, me.startingTrophies]);
  });
  // Battles arrive newest-first: the oldest one also gives the value before it
  for (const s in pts) {
    const oldest = pts[s][pts[s].length - 1];
    if (oldest) pts[s].push([oldest[0] - 60000, oldest[2]]);
    pts[s] = pts[s].map(([t, v]) => [t, v]);
  }
  return pts;
}
// The value right now, from the profile: Trophy Road always, the Path of Legends
// rating only once the season result has one
function trophyNow(data) {
  return { road: data.trophies, pol: data.currentPathOfLegendSeasonResult?.trophies || null };
}
function mergeTrophyPoints(list, pts) {
  const byTime = new Map(list);
  pts.forEach(([t, v]) => byTime.set(t, v));
  return [...byTime].sort((a, b) => a[0] - b[0]).slice(-TROPHY_POINTS_MAX);
}
// The battles' points and the profile's value (as of `at`, when it was fetched)
// added to a history; persist reads and saves this device's history for the tag
function trophyHistory(data, battles, { persist = false, at = Date.now() } = {}) {
  let all = {};
  if (persist) try { all = JSON.parse(localStorage.getItem(TROPHY_HISTORY_KEY) || '{}'); } catch(e) {}
  const entry = all[data.tag] || { road: [], pol: [] };
  const fromBattles = trophyPointsFromBattles(battles), now = trophyNow(data);
  for (const s of ['road', 'pol']) {
    let list = mergeTrophyPoints(entry[s] || [], fromBattles[s]);
    if (now[s] != null && (!list.length || list[list.length - 1][1] !== now[s])) list = mergeTrophyPoints(list, [[at, now[s]]]);
    entry[s] = list;
  }
  if (persist) try {
    all[data.tag] = entry;
    pruneHistoryTags(all, e => Math.max(e.road?.at(-1)?.[0] || 0, e.pol?.at(-1)?.[0] || 0));
    localStorage.setItem(TROPHY_HISTORY_KEY, JSON.stringify(all));
  } catch(e) {}
  return entry;
}
function recordTrophies(data, battles, at) { if (data?.tag) trophyHistory(data, battles, { persist: true, at }); }

const _trophyState = {};
// The saved history (recordHistory), else just the current log
function trophyHistoryHTML(data, battles, scope) {
  let hist = null;
  try { hist = JSON.parse(localStorage.getItem(TROPHY_HISTORY_KEY) || '{}')[data.tag] || null; } catch(e) {}
  if (!hist) hist = trophyHistory(data, battles);
  const prev = _trophyState[scope]?.tag === data.tag ? _trophyState[scope] : null;
  const has = s => (hist[s] || []).length > 0;
  const moves = s => new Set((hist[s] || []).map(p => p[1])).size > 1;
  // Path of Legends first when it's the one that moves (Trophy Road is often done)
  const series = prev && has(prev.series) ? prev.series : has('pol') && (moves('pol') || !moves('road')) ? 'pol' : 'road';
  _trophyState[scope] = { tag: data.tag, hist, series, range: prev?.range || '30' };
  return `<div class="card" id="${scope}-trophy">${trophyCardBody(scope)}</div>`;
}
function trophyCardBody(scope) {
  const st = _trophyState[scope], all = st.hist[st.series] || [];
  const now = Date.now();
  const from = st.range === 'all' ? (all[0]?.[0] ?? now) : now - st.range * 864e5;
  // Points in range, led by the value carried in from before it, and drawn on to now
  const before = all.filter(p => p[0] < from).pop();
  let pts = all.filter(p => p[0] >= from);
  if (before) pts.unshift([from, before[1]]);
  if (pts.length) pts.push([now, pts[pts.length - 1][1]]);
  const cur = all.length ? all[all.length - 1][1] : null;
  const change = pts.length ? cur - pts[0][1] : 0;
  // The toggle only when both series have a history to draw
  const both = (st.hist.road || []).length > 1 && (st.hist.pol || []).length > 1;
  const icon = st.series === 'pol' ? '⚔️' : '🏆';
  const rangeLabel = st.range === 'all' ? `since ${new Date(all[0]?.[0] || now).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}` : `in ${TROPHY_RANGES[st.range]}`;
  const vals = pts.map(p => p[1]);
  const chart = trophyChartSVG(scope, pts);
  return `
    <h3 style="margin-bottom:10px">📈 Trophy History</h3>
    ${both ? `<div class="seg" style="margin-bottom:10px">
      ${Object.entries(TROPHY_SERIES).map(([s, l]) => `<button class="${st.series === s ? 'active' : ''}" onclick="setTrophySeries('${scope}','${s}')">${l}</button>`).join('')}
    </div>` : ''}

      <span style="font-size:24px;font-weight:700;font-family:'Rajdhani',sans-serif">${icon} ${fmtNum(cur)}</span>
      <span style="font-size:13px;white-space:nowrap"><span class="${change > 0 ? 'text-green' : change < 0 ? 'text-red' : 'text-muted'}" style="font-weight:700">${change > 0 ? '+' : ''}${fmtNum(change)}</span> <span class="text-muted">${rangeLabel}</span></span>
    </div>
    <div id="${scope}-trophy-readout" style="font-size:11px;color:var(--muted);min-height:16px;margin-bottom:4px">${st.chart ? `High ${fmtNum(Math.max(...vals))} · Low ${fmtNum(Math.min(...vals))}` : ''}</div>
    ${chart}
    <div class="filter-bar" style="margin:10px 0 0">
      ${Object.entries(TROPHY_RANGES).map(([r, l]) => `<button class="filter-btn ${st.range === r ? 'active' : ''}" onclick="setTrophyRange('${scope}','${r}')">${l}</button>`).join('')}
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">${scope === 'p'
      ? `Built up on this device from refreshes and your ${st.series === 'pol' ? 'ranked' : 'ladder'} battles, so it grows the more you use the app.`
      : `Built up on this device from their ${st.series === 'pol' ? 'ranked' : 'ladder'} battles each time their profile is loaded, so it grows the more you look them up.`}</div>`;
}
// A line over the range, with three recessive gridlines; touch or hover shows the
// value at that moment in the readout above.
function trophyChartSVG(scope, pts) {
  const W = 320, H = 120, L = 40, R = 6, T = 6, B = 18;
  if (new Set(pts.map(p => p[0])).size < 2 || pts.length < 3) {
    _trophyState[scope].chart = null;
    return `<div class="empty-msg" style="padding:14px 0;font-size:12px">Not enough history yet — the graph fills in ${scope === 'p' ? 'as you play and refresh' : 'each time their profile is loaded'}.</div>`;
  }
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  if (hi - lo < 10) { lo -= 5; hi += 5; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const xy = pts.map(([t, v]) => [x(t), y(v), t, v]);
  _trophyState[scope].chart = { xy, W };
  const line = xy.map(([px, py], i) => `${i ? 'L' : 'M'}${px.toFixed(1)},${py.toFixed(1)}`).join('');
  const area = `${line}L${xy[xy.length - 1][0].toFixed(1)},${H - B}L${L},${H - B}Z`;
  const grid = [hi - pad, (hi + lo) / 2, lo + pad].map(v => `
    <line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${L - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtNum(Math.round(v))}</text>`).join('');
  const day = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;touch-action:pan-y" role="img" aria-label="Trophy history line chart"
         onpointermove="trophyHover(event,'${scope}')" onpointerdown="trophyHover(event,'${scope}')" onpointerleave="trophyHover(null,'${scope}')">
      ${grid}
      <path d="${area}" fill="var(--accent)" opacity=".12"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="${L}" y="${H - 4}" font-size="10" fill="var(--muted)">${day(t0)}</text>
      <text x="${W - R}" y="${H - 4}" font-size="10" fill="var(--muted)" text-anchor="end">Now</text>
      <g id="${scope}-trophy-hover" style="display:none">
        <line y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/>
        <circle r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      </g>
    </svg>`;
}
window.trophyHover = function(e, scope) {

  let i = xy.findIndex(p => p[0] > px) - 1;

  const setKey = cards => cards.map(c => c.name).sort().join('|');
  const sameDeck = mine.find(p => setKey(p.cards) === setKey(deck));
  if (sameDeck) return deck.map(c => cardVariant(sameDeck.cards.find(x => x.name === c.name)));
  return deck.map((c, i) => {
    const evo = !!((c.evolutionLevel || 0) & 1), hero = !!((c.evolutionLevel || 0) & 2);
    if (i === 0) return evo ? 'evo' : '';
    if (i === 1) return hero ? 'hero' : '';
    if (i !== 2) return '';
    if (evo && hero) return cardVariant(mine.map(p => p.cards[2]).find(x => x?.name === c.name)) || 'evo';
    return evo ? 'evo' : hero ? 'hero' : '';
  });
}

// The equipped deck's key in deck history (sorted names + [evo]/[hero]), so the
// Decks tab can mark it "In use" — or '' if the API didn't give a deck.
// currentDeck is only the 1v1 deck slot — the API has nothing for 2v2 — so the
// 2v2 deck is taken from the latest 2v2 battle: "last played in 2v2", which
// lags a deck change until the next 2v2 game. Battles arrive newest-first.
function latest2v2Deck(battles, tag) {
  for (const b of battles || []) {
    if ((b.team || []).length < 2) continue;
    const me = b.team.find(p => p.tag === tag);
    if (me && (me.cards || []).length === 8) return me.cards;
  }
  return null;
}

// The equipped 1v1 deck as a Decks tab entry with no games, for when it isn't in
// the deck history yet (a new deck, or one only played on another device)
function equippedDeckEntry(data, battles, key) {
  const deck = data?.currentDeck || [];
  if (deck.length !== 8) return null;
  const forms = currentDeckVariants(deck, battles, data.tag), variants = {};
  deck.forEach((c, i) => { if (forms[i]) variants[c.name] = forms[i]; });
  const costs = deck.map(c => c.elixirCost ?? allCards.find(x => x.name === c.name)?.elixirCost).filter(n => n != null);
  return {
    key, cards: deck.map(c => c.name), variants, wins: 0, losses: 0, draws: 0, modes: [], last: '', unplayed: true,
    elixir: costs.length === 8 ? [costs.reduce((a, b) => a + b, 0) / 8] : []
  };
}

function currentDeckKey(data, battles) {
  const deck = data?.currentDeck || [];
  if (!deck.length) return '';
  const variants = currentDeckVariants(deck, battles, data.tag);
  return deck.map((c, i) => variants[i] ? `${c.name}[${variants[i]}]` : c.name).sort().join('|');
}

// ── Opponent cards: how you do against each card ──
// Every non-friendly battle counts once for each card on the other side (both
// opponents' decks in 2v2). Boat battles are left out — their "opponent" is a
// defence, not a player. Tallied per tag like deck history, deduped by
// battleTime, so it grows past the ~30-battle window.
const MATCHUPS_KEY = 'cr_matchups_v1';
const MATCHUP_MIN_GAMES = 4;
function tallyMatchups(entry, battles) {
  const seen = new Set(entry.seen);

  (battles || []).forEach(b => {
    if (!b.battleTime || seen.has(b.battleTime)) return;
    seen.add(b.battleTime);
    if (/friendly|clanMate|boat/i.test(b.type || '')) return;
    const opp = b.opponent || [];
    const names = new Set(opp.flatMap(p => (p.cards || []).map(c => c.name)));
    if (!names.size) return;
    const t = (b.team || [])[0]?.crowns || 0, o = opp[0]?.crowns || 0;
    const i = t > o ? 0 : t < o ? 1 : 2;  // [wins, losses, draws]
    names.forEach(n => (entry.cards[n] || (entry.cards[n] = [0, 0, 0]))[i]++);
    entry.battles++;
    changed = true;
  });
  entry.seen = [...seen].slice(-300);
  const lvChanged = tallyLevels(entry, battles || []);
  return changed || lvChanged;
}

// ── Level advantage: your deck's average card level minus the opponent's ──
// 1v1 Trophy Road and Path of Legends only — challenges and tournaments set the
// levels, friendlies aren't matchmade. Within half a level counts as even.
// Kept in the matchup entry (lv) with its own seen list, so the battles tallied
// before this existed still count once.
const LEVEL_EVEN = 0.5;
const isLevelledBattle = b => b.type === 'pathOfLegend' || isTrophyRoadBattle(b);
function deckAvgLevel(cards) {
  const lv = (cards || []).filter(c => c.level).map(c => toDisplayLevel((c.rarity || 'common').toLowerCase(), c.level));
  return lv.length === 8 ? lv.reduce((a, b) => a + b, 0) / 8 : null;
}
function tallyLevels(entry, battles) {
  const lv = entry.lv || (entry.lv = { seen: [], n: 0, sum: 0, ahead: [0, 0, 0], even: [0, 0, 0], behind: [0, 0, 0] });
  const seen = new Set(lv.seen);
  let changed = false;
  battles.forEach(b => {
    if (!b.battleTime || seen.has(b.battleTime)) return;
    seen.add(b.battleTime);
    changed = true;
    if (!isLevelledBattle(b)) return;
    const mine = deckAvgLevel(b.team?.[0]?.cards), theirs = deckAvgLevel(b.opponent?.[0]?.cards);
    if (mine == null || theirs == null) return;

    lv[diff >= LEVEL_EVEN ? 'ahead' : diff <= -LEVEL_EVEN ? 'behind' : 'even'][r === 'win' ? 0 : r === 'loss' ? 1 : 2]++;

// The saved tally for the tag, else one from the current log only
function matchupEntry(data, battles) {
  const saved = loadMatchups(data.tag);

  const m = newMatchups(); tallyMatchups(m, battles);
  return saved ? { ...saved, lv: m.lv } : m;
}
const wldRate = ([w, l, d]) => w / Math.max(w + l + d, 1);
const rateCls = r => r < 0.45 ? 'text-red' : r > 0.55 ? 'text-green' : '';
function levelAdvantageHTML(data, battles, scope) {
  const lv = matchupEntry(data, battles).lv;
  const head = `<div style="${OV_SECTION_STYLE}">Level Advantage <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">· ${lv?.n || 0} battle${lv?.n === 1 ? '' : 's'}</span></div>`;
  if (!lv || lv.n < 3) return head + `<div style="font-size:12px;color:var(--muted)">Needs a few Trophy Road or Path of Legends battles — it fills in as ${scope === 'p' ? 'you play' : 'they play'}.</div>`;
  const avg = lv.sum / lv.n, abs = Math.abs(avg), who = scope === 'p' ? 'Your' : 'Their';
  const rows = [['ahead', '⬆️ Higher levels'], ['even', '⚖️ About even'], ['behind', '⬇️ Lower levels']].filter(([k]) => lv[k].some(Boolean));
  return head
    + `<div style="font-size:12px;margin-bottom:4px">${who} cards are on average <b class="${avg >= LEVEL_EVEN ? 'text-green' : avg <= -LEVEL_EVEN ? 'text-red' : ''}">${abs < 0.05 ? 'level with' : `${abs.toFixed(1)} level${abs.toFixed(1) === '1.0' ? '' : 's'} ${avg > 0 ? 'above' : 'below'}`}</b> the opponent's.</div>`
    + rows.map(([k, label]) => ovRow(label, `${wldText(lv[k])} · <span class="${rateCls(wldRate(lv[k]))}">${Math.round(wldRate(lv[k]) * 100)}%</span>`)).join('')
    + `<div style="font-size:11px;color:var(--muted);margin-top:6px">Average card level of both decks · within ${LEVEL_EVEN} counts as even · Trophy Road and Path of Legends only</div>`;
}

// ── Record per archetype: the opponent-card tally read for the win conditions
// the Meta screen names archetypes by (a deck with two counts for both) ──
function archetypeRecordHTML(data, battles, scope) {

// ── Streaks and tilt, from the battle log (friendlies and boat battles left out) ──
const TILT_GAP_MS = 30 * 60 * 1000;  // the next game counts as "right after" within this
const competitiveBattles = battles => (battles || []).filter(b => b.battleTime && !/friendly|clanMate|boat/i.test(b.type || ''));
function lossStreak(battles) {
  let n = 0;
  for (const b of competitiveBattles(battles)) { if (battleResult(b) !== 'loss') break; n++; }
  return n;
}
function streakNoteHTML(battles, scope) {
  const n = lossStreak(battles);
  if (n < 3) return '';
  return `<div class="card" style="padding:10px 12px;font-size:13px;border-color:var(--red)">😤 <b>${n} losses in a row</b>${scope === 'p' ? ' — maybe take a short break before the next one.' : '.'}</div>`;
}
function momentumHTML(battles, scope) {
  const list = competitiveBattles(battles);  // newest first
  const after = { win: [0, 0, 0], loss: [0, 0, 0] };
  for (let i = 0; i < list.length - 1; i++) {
    const next = list[i], prev = list[i + 1], r = battleResult(prev);
    if (r === 'draw' || parseApiTime(next.battleTime) - parseApiTime(prev.battleTime) > TILT_GAP_MS) continue;
    const nr = battleResult(next);
    after[r][nr === 'win' ? 0 : nr === 'loss' ? 1 : 2]++;
  }
  const n = k => after[k][0] + after[k][1] + after[k][2];
  const streak = lossStreak(battles);
  if (n('loss') + n('win') < 4 && streak < 2) return '';
  const row = (k, label) => n(k) ? ovRow(label, `${wldText(after[k])} · ${Math.round(wldRate(after[k]) * 100)}%`) : '';
  const tilt = n('loss') >= 4 && n('win') >= 4 && wldRate(after.loss) < wldRate(after.win) - 0.15;
  return `<div style="${OV_SECTION_STYLE}">Momentum <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">· last ${list.length} battles</span></div>`
    + (streak >= 2 ? ovRow('Losses in a row now', `😤 ${streak}`, 'text-red') : '')
    + row('win', 'Right after a win') + row('loss', 'Right after a loss')
    + (tilt ? `<div style="font-size:12px;margin-top:4px">📉 ${scope === 'p' ? 'You win' : 'They win'} clearly less right after a loss — a break after one might pay off.</div>` : '')
    + `<div style="font-size:11px;color:var(--muted);margin-top:6px">The next game within 30 minutes · friendlies and boat battles left out</div>`;
}

const newMatchups = () => ({ since: Date.now(), battles: 0, seen: [], cards: {} });
function loadMatchups(tag) {
  try { return JSON.parse(localStorage.getItem(MATCHUPS_KEY) || '{}')[tag] || null; }
  catch(e) { return null; }
}
function recordMatchups(tag, battles, at = Date.now()) {
  if (!tag) return;
  try {
    const all = JSON.parse(localStorage.getItem(MATCHUPS_KEY) || '{}');
    const entry = all[tag] || newMatchups();
    if (!tallyMatchups(entry, battles)) return;
    entry.at = at;
    all[tag] = entry;
    pruneHistoryTags(all, e => e.at || e.since || 0);
    localStorage.setItem(MATCHUPS_KEY, JSON.stringify(all));
  } catch(e) {}
}
// The saved tally (recordHistory), else just the current log
function matchupsHTML(data, battles, scope) {

  const art = buildCardArtMap(battles);

      <span class="${cls}" style="font-weight:700;width:40px;text-align:right">${Math.round(r.rate * 100)}%</span>

    + (easiest.length ? `<div class="mu-sub">😎 Best against</div>${easiest.map(row).join('')}` : '')
    + `<div style="font-size:11px;color:var(--muted);margin-top:6px">Win rate in battles where the other side played the card · faced ${MATCHUP_MIN_GAMES}+ times · friendlies and boat battles left out</div>`;

// scope: 'p' for the profile, 'f' for the friend modal — see makePlanCtx().
function renderOverview(data, battles, scope = 'p') {
  const cards = data.cards || [];

  // Compute per-card enriched data
  const enriched = cards.map(c => {
    const r = (c.rarity||'common').toLowerCase();
    const disp = toDisplayLevel(r, c.level);
    const minL = MIN_LEVEL[r] || 1;
    const steps = LEVEL_DATA[r] || [];
    const idx = disp - minL;
    const isMaxed = disp >= MAX_LEVEL || idx >= steps.length;
    const nextStep = (!isMaxed && idx >= 0 && idx < steps.length) ? steps[idx] : null;
    const isUpgradable = !isMaxed && !!nextStep && (c.count||0) >= nextStep.cards;
    const canMax = !isMaxed && cardsNeededToMax(r, disp, c.count||0) === 0;
    return { ...c, r, disp, isMaxed, isUpgradable, canMax, nextStep };
  });

  const maxedCount      = enriched.filter(c => c.isMaxed).length;
  // Measure progress against every card in the game, not just the ones owned —
  // a card you haven't unlocked is still one you need at level 16 for a maxed
  // account, so it belongs in the denominator.
  const totalInGame     = allCards.length || cards.length;
  const upgradableNow   = enriched.filter(c => c.isUpgradable);
  const canMaxCards     = enriched.filter(c => c.canMax);
  const totalGoldReady  = upgradableNow.reduce((s, c) => s + (c.nextStep?.gold || 0), 0);
  const cardsTotal      = allCards.length || cards.length;
  const cardsNotFound   = Math.max(cardsTotal - cards.length, 0);
  const evoIds          = new Set(allCards.filter(hasEvoForm).map(c => c.id));
  const heroIds         = new Set(allCards.filter(hasHeroForm).map(c => c.id));
  const evolvedCount    = evoIds.size > 0
    ? cards.filter(c => evoIds.has(c.id) && ownsEvo(c)).length
    : cards.filter(ownsEvo).length;
  const heroCount       = cards.filter(c => heroIds.has(c.id) && ownsHero(c)).length;
  const supportCards    = data.supportCards || [];
  // Enrich tower troops for Upgrade Insights
  const troopEnriched   = supportCards.map(c => {
    const r    = (c.rarity || 'legendary').toLowerCase();
    const disp = toDisplayLevel(r, c.level);
    const minL = MIN_LEVEL[r] || 1;
    const steps = LEVEL_DATA[r] || [];
    const idx  = disp - minL;
    const isMaxed    = disp >= MAX_LEVEL || idx >= steps.length;
    const nextStep   = (!isMaxed && idx >= 0 && idx < steps.length) ? steps[idx] : null;
    const isUpgradable = !isMaxed && !!nextStep && (c.count||0) >= nextStep.cards;
    return { ...c, r, disp, isMaxed, nextStep, isUpgradable };
  });
  const troopMaxed      = troopEnriched.filter(c => c.isMaxed).length;
  const troopUpgradable = troopEnriched.filter(c => c.isUpgradable);
  const troopCanMax     = troopEnriched.filter(c => !c.isMaxed && cardsNeededToMax(c.r, c.disp, c.count||0) === 0).length;
  const troopGoldReady  = troopUpgradable.reduce((s, c) => s + (c.nextStep?.gold || 0), 0);
  const troopsTotal     = allCards.filter(c => c.iconUrls?.towerProjectileMedium).length || troopEnriched.length;
  const troopsNotFound  = Math.max(troopsTotal - troopEnriched.length, 0);
  const towerTroopCL    = supportCards.reduce((s, c) => {
    const r = (c.rarity||'common').toLowerCase();
    return s + toDisplayLevel(r, c.level);
  }, 0);
  const cardLevelCL     = enriched.reduce((s, c) => s + c.disp, 0) + towerTroopCL;
  const collectionLevel = cardLevelCL + (evolvedCount * 5) + (heroCount * 5);
  const kingTowerLevel  = calcKingTowerLevel(enriched.map(c => c.disp));
  const nextMilestone   = nextCLMilestone(collectionLevel);
  const prevMilestone   = collectionLevel < 20 ? 0 : collectionLevel >= 1500
    ? Math.floor(collectionLevel / 5) * 5
    : Math.floor(collectionLevel / 10) * 10;
  const milestoneProgress = Math.round((collectionLevel - prevMilestone) / (nextMilestone - prevMilestone) * 100);
  // King Tower Level — progress toward next level
  const nextKtlReq = KTL_REQ.find(r => r.lvl === kingTowerLevel + 1);
  const ktlProgress = nextKtlReq
    ? enriched.filter(c => c.disp >= nextKtlReq.min).length
    : null;

  // Top 5 suggested upgrades: upgradable sorted by cheapest gold first
  const suggested = [...upgradableNow]
    .sort((a, b) => (a.nextStep?.gold||0) - (b.nextStep?.gold||0))
    .slice(0, 5);

  const suggestedRows = suggested.map(c =>
    `<div class="stat-row">

// ── Gold budget: what to upgrade with the gold you have. One level at a time,
// only with cards already owned: for a deck the lowest card first (the deck's
// weakest link), for collection level the cheapest level-up first (each is +1).
// The amount is remembered in cr_budget_gold ──
const BUDGET_KEY = 'cr_budget_gold';
const _budgetState = {};
function goldBudgetHTML(data, battles, scope, decks) {
  let gold = '';
  try { gold = localStorage.getItem(BUDGET_KEY) || ''; } catch(e) {}
  const cur = (data.currentDeck || []).map(c => c.name);
  const prev = _budgetState[scope];
  const focus = prev?.tag === data.tag ? prev.focus : cur.length ? 'current' : 'cl';
  _budgetState[scope] = { tag: data.tag, data, decks, current: cur, focus, gold };
  const selStyle = "flex:1;min-width:0;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center";
  return `
    <div class="card">
      <h3 style="margin-bottom:6px">💰 Gold Budget</h3>
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px">What to upgrade with the gold ${scope === 'p' ? 'you have' : 'they have'} — only with cards already collected</p>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <input type="number" inputmode="numeric" min="0" step="1000" placeholder="Gold, e.g. 50000" value="${esc(gold)}" oninput="setBudgetGold('${scope}', this.value)" style="flex:1;min-width:120px">
        <select onchange="setBudgetFocus('${scope}', this.value)" style="${selStyle}">
          ${cur.length ? `<option value="current"${focus === 'current' ? ' selected' : ''}>Current deck</option>` : ''}
          ${decks.map((d, i) => `<option value="deck-${i}"${focus === `deck-${i}` ? ' selected' : ''}>Deck #${i + 1} · ${d.wins}W ${d.losses}L (${d.cards.slice(0, 2).map(esc).join(', ')}…)</option>`).join('')}
          <option value="cl"${focus === 'cl' ? ' selected' : ''}>Most collection levels</option>
        </select>
      </div>
      <div id="${scope}-budget-output">${goldBudgetOutput(scope)}</div>
    </div>`;
}
function goldBudgetPlan(cards, gold, byLowest) {
  // Per card: its level, cards left over and the next step
  const st = cards.map(c => {
    const r = (c.rarity || 'common').toLowerCase();
    return { c, r, from: toDisplayLevel(r, c.level), lv: toDisplayLevel(r, c.level), count: c.count || 0, gold: 0 };
  });
  const next = x => {
    const step = (LEVEL_DATA[x.r] || [])[x.lv - (MIN_LEVEL[x.r] || 1)];
    return x.lv < MAX_LEVEL && step && x.count >= step.cards ? step : null;
  };
  let left = gold, spent = 0, steps = 0;
  for (;;) {
    const options = st.map(x => ({ x, step: next(x) })).filter(o => o.step && o.step.gold <= left);
    if (!options.length) break;
    options.sort((a, b) => byLowest ? (a.x.lv - b.x.lv) || (a.step.gold - b.step.gold) : (a.step.gold - b.step.gold) || (a.x.lv - b.x.lv));
    const { x, step } = options[0];
    x.lv++; x.count -= step.cards; x.gold += step.gold;
    left -= step.gold; spent += step.gold; steps++;
  }
  const blocked = st.map(x => ({ x, step: (LEVEL_DATA[x.r] || [])[x.lv - (MIN_LEVEL[x.r] || 1)] }))
    .filter(o => o.x.lv < MAX_LEVEL && o.step && o.x.count >= o.step.cards).sort((a, b) => a.step.gold - b.step.gold)[0];
  return { ups: st.filter(x => x.lv > x.from), spent, left, steps, nextGold: blocked?.step.gold || 0 };
}
function goldBudgetOutput(scope) {
  const st = _budgetState[scope];
  if (!st) return '';
  const gold = parseInt(st.gold, 10) || 0;
  let names = null;
  if (st.focus === 'current') names = st.current;
  else if (st.focus.startsWith('deck-')) names = st.decks[parseInt(st.focus.slice(5), 10)]?.cards || [];
  const set = names ? new Set(names) : null;
  const cards = (st.data.cards || []).filter(c => !set || set.has(c.name));
  if (!gold) return '<div class="empty-msg" style="padding:8px 0;font-size:12px">Enter how much gold you have.</div>';
  const plan = goldBudgetPlan(cards, gold, !!set);
  if (!plan.ups.length) return `<div class="empty-msg" style="padding:8px 0;font-size:12px">${plan.nextGold ? `Not enough for any upgrade here — the cheapest ready one costs ${fmtNum(plan.nextGold)} 💰.` : 'No card here has enough cards for its next level yet.'}</div>`;
  plan.ups.sort((a, b) => b.gold - a.gold);
  return plan.ups.map(x => `<div class="stat-row">
      <span class="stat-label" style="display:flex;align-items:center;gap:6px;min-width:0">
        ${x.c.iconUrls?.medium ? `<img src="${x.c.iconUrls.medium}" alt="" style="width:22px;height:28px;object-fit:contain;flex-shrink:0">` : ''}
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.c.name)} <span style="color:var(--muted);font-size:11px">(Lv ${x.from}→${x.lv})</span></span>
      </span>
      <span class="stat-value text-accent" style="flex-shrink:0">${fmtNum(x.gold)} 💰</span>
    </div>`).join('')
    + `<div class="stat-row"><span class="stat-label">Spent</span><strong>${fmtNum(plan.spent)} 💰 <span class="text-muted" style="font-weight:400">· ${fmtNum(plan.left)} left · +${plan.steps} level${plan.steps === 1 ? '' : 's'}</span></strong></div>`
    + (plan.nextGold ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">The next ready upgrade would cost ${fmtNum(plan.nextGold)} 💰.</div>` : '')
    + `<div style="font-size:11px;color:var(--muted);margin-top:4px">${set ? 'Lowest card first, so the deck levels up evenly' : 'Cheapest level-ups first — each one is +1 collection level'} · from the upgrade table, so approximate</div>`;
}
window.setBudgetGold = function(scope, v) {
  const st = _budgetState[scope]; if (!st) return;
  st.gold = String(v || '').replace(/\D/g, '');
  try { localStorage.setItem(BUDGET_KEY, st.gold); } catch(e) {}
  const el = document.getElementById(`${scope}-budget-output`);
  if (el) el.innerHTML = goldBudgetOutput(scope);
};
window.setBudgetFocus = function(scope, v) {
  const st = _budgetState[scope]; if (!st) return;
  st.focus = v;
  const el = document.getElementById(`${scope}-budget-output`);
  if (el) el.innerHTML = goldBudgetOutput(scope);
};

    friendTab(tab);

    if (tab === 'evolutions' && filter) friendSetEvo(filter);
    if (tab === 'heroes' && filter) friendSetHero(filter);

  if (tab === 'cards') {
    _cardRarity = 'all'; _cardLevel = 'all'; _cardSearch = '';
    const rar = document.getElementById('card-rarity-select'), q = document.getElementById('card-name-search');
    const lev = document.getElementById('card-level-select');
    if (rar) rar.value = 'all';
    if (lev) lev.value = 'all';
    if (q) q.value = '';
    switchTab('cards');
    setCardFilter(filter || 'all', 'status');
    return;
  }
  if (tab === 'evolutions') _evoFilter = filter || 'all';
  if (tab === 'heroes') _heroFilter = filter || 'all';

  if (tab === 'evolutions') setEvoFilter(_evoFilter);
  if (tab === 'heroes') setHeroFilter(_heroFilter);
};

function resetCalculator() {
  document.getElementById('card-search').value = '';
  document.getElementById('card-dropdown').classList.remove('open');
  const note = document.getElementById('card-lookup-note');
  if (note) note.style.display = 'none';
  document.getElementById('calc-rarity').value = 'common';
  document.getElementById('calc-current').value = MIN_LEVEL['common'];
  document.getElementById('calc-count').value = 0;
  document.getElementById('calc-target').value = MAX_LEVEL;
  calcUpdate();
}

// scope 'f' loads the card as the player open in the modal has it, and closes the modal
function openInCalculator(cardId, scope = 'p') {
  const who = scope === 'f' ? _friendData : null;
  if (who && document.getElementById('friend-modal').style.display === 'block') closeFriendModal();
  if (_calcView !== 'calc') setCalcView('calc');
  goTo('calc');
  const cat = allCards.find(c => c.id === cardId);   // regular cards only
  const pc  = who ? [...(who.cards || []), ...(who.supportCards || [])].find(c => c.id === cardId)
                  : _playerCardsById[cardId];         // cards + tower troops
  const name = cat?.name || pc?.name || '';
  let r = (cat?.rarity || pc?.rarity || 'common').toLowerCase();
  if (!LEVEL_DATA[r]) r = 'common';

  const search = document.getElementById('card-search');
  if (search) search.value = name;
  const dd = document.getElementById('card-dropdown');
  if (dd) dd.classList.remove('open');
  document.getElementById('calc-rarity').value = r;

  const note = document.getElementById('card-lookup-note');
  if (pc) {
    const disp = toDisplayLevel(r, pc.level);
    document.getElementById('calc-current').value = disp;
    document.getElementById('calc-count').value = pc.count || 0;
    document.getElementById('calc-target').value = MAX_LEVEL;
    if (note) { note.textContent = `Loaded ${who ? `${who.name}'s` : 'your'} ${name}: Level ${disp}, ${fmtNum(pc.count||0)} cards`; note.style.display = 'block'; }
  }
  calcUpdate();
  const res = document.getElementById('calc-result');
  if (res) res.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleCardMax(id) {
  const el     = document.getElementById(id + '-max');
  const toggle = document.getElementById(id + '-toggle');
  if (!el) return;
  const opening = el.style.display === 'none' || el.style.display === '';
  el.style.display = opening ? 'block' : 'none';
  if (toggle) {
    const closedText = toggle.dataset.closed || (id.endsWith('cl-breakdown') ? '▼' : '▼ Total to Lv 16');
    toggle.textContent = opening ? (toggle.dataset.open || '▲') : closedText;
  }
}

async function loadTowerTroopsGrid() {
  const grid = document.getElementById('tower-troops-grid');
  if (!grid || !grid.querySelector('.spinner')) return;

  try {
    await maybeLoadCards();

    // Build a quick lookup from the full /cards catalog
    const catalogById = {};
    allCards.forEach(c => { catalogById[c.id] = c; });

    // Tower troops arrive in data.supportCards (separate from deck cards).
    // Each entry: { id, name, level, rarity, iconUrls: { medium, … } }
    // Fallback: if the API ever moves them into data.cards, filter by
    // iconUrls.towerProjectileMedium from the catalog (same naming pattern
    // as evolutionMedium / heroMedium).
    let troops = _towerTroopSupportCards;
    if (!troops.length) {
      // Fallback: identify via catalog flag and match against player cards
      const troopIds = new Set(allCards.filter(c => c.iconUrls?.towerProjectileMedium).map(c => c.id));
      if (troopIds.size) {
        troops = _towerTroopAllPlayerCards.filter(c => troopIds.has(c.id));
      }
    }

    if (!troops.length) {
      grid.innerHTML = '<div class="empty-msg">No tower troop data available from the API.</div>';
      return;
    }

    // Build enriched troop data (mirrors renderCards logic)
    const rarityColor = { common:'var(--text)', rare:'var(--blue)', epic:'var(--purple)', legendary:'var(--accent)', champion:'#e74c3c' };
    const enriched = troops.map(c => {
      const r       = (c.rarity || 'legendary').toLowerCase();
      const disp    = toDisplayLevel(r, c.level);
      const minL    = MIN_LEVEL[r] || 1;
      const steps   = LEVEL_DATA[r] || [];
      const idx     = disp - minL;
      const isMaxed = disp >= MAX_LEVEL || idx >= steps.length;
      const nextStep     = (!isMaxed && idx >= 0 && idx < steps.length) ? steps[idx] : null;
      const isUpgradable = !isMaxed && !!nextStep && (c.count||0) >= nextStep.cards;
      const canMax       = !isMaxed && cardsNeededToMax(r, disp, c.count||0) === 0;
      // Image: prefer towerProjectileMedium, fall back to medium
      const cat    = catalogById[c.id] || {};
      const imgUrl = cat.iconUrls?.towerProjectileMedium || c.iconUrls?.towerProjectileMedium
                  || cat.iconUrls?.medium               || c.iconUrls?.medium || '';
      return { ...c, r, disp, isMaxed, nextStep, isUpgradable, canMax, imgUrl };
    });

    const totalCL = enriched.reduce((s, c) => s + c.disp, 0);

    const troopRows = enriched.map(c => {
      const owned  = c.count || 0;
      const needed = c.nextStep ? c.nextStep.cards : 0;
      const pct    = c.isMaxed ? 100 : needed ? Math.min(100, Math.round(owned / needed * 100)) : 0;
      const statusLabel = c.isMaxed
        ? '<span class="badge badge-gold">MAX ★</span>'
        : c.isUpgradable ? '<span class="badge badge-green">Ready</span>'
        : c.canMax       ? '<span class="badge badge-blue">Can Max</span>'
        : '';
      const stepDeficit = !c.isMaxed && c.nextStep ? Math.max(0, c.nextStep.cards - owned) : 0;
      const showFullExpand = !c.isMaxed && c.disp <= 14;
      const toMax = showFullExpand ? computeUpgrade(c.r, c.disp, owned, MAX_LEVEL) : null;
      const closedLabel = showFullExpand ? '▼ Total to Lv 16' : '▼ Options';
      const domId   = `troop-${c.id}`;
      return `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px">
          <div class="flex-between mb8">
            <div style="display:flex;align-items:center;gap:10px">
              ${c.imgUrl ? `<img src="${c.imgUrl}" alt="${esc(c.name)}" style="width:52px;height:64px;object-fit:contain;flex-shrink:0" loading="lazy" decoding="async">` : ''}
              <div>
                <span style="font-weight:600;font-size:15px">${esc(c.name)}</span><br>
                <span style="font-size:11px;color:${rarityColor[c.r]||'var(--muted)'}">${c.r.charAt(0).toUpperCase()+c.r.slice(1)}</span>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              <span style="font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:var(--accent)">Lv ${c.disp}</span>
              ${statusLabel}
            </div>
          </div>
          ${!c.isMaxed && c.nextStep ? `
            <div class="flex-between" style="font-size:12px;color:var(--muted);margin-bottom:4px">
              <span>Cards: ${fmtNum(owned)} / ${fmtNum(needed)}</span>
              <span>${fmtNum(c.nextStep.gold)} 💰 to Lv ${c.disp+1}</span>
            </div>
            <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;background:${c.isUpgradable?'var(--green)':'var(--blue)'}"></div></div>
          ` : `<div style="font-size:12px;color:var(--accent);font-weight:600">Fully maxed! ✓</div>`}
          ${!c.isMaxed && c.nextStep ? `
            <div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--border)">
              <div class="flex-between" style="font-size:12px;color:var(--muted)">
                <span>Cards still needed to Lv ${c.disp+1}</span>
                <span class="${stepDeficit > 0 ? 'text-red' : 'text-green'}">${stepDeficit > 0 ? '+'+fmtNum(stepDeficit) : '✓ Enough cards'}</span>
              </div>
            </div>
          ` : ''}
          ${showFullExpand ? `
            <div onclick="toggleCardMax('${domId}')" style="cursor:pointer;margin-top:6px;font-size:11px;color:var(--muted);text-align:center;user-select:none">
              <span id="${domId}-toggle" data-closed="${closedLabel}">${closedLabel}</span>
            </div>
            <div id="${domId}-max" style="display:none;margin-top:6px">
              <div class="flex-between" style="font-size:12px;color:var(--muted);margin-bottom:4px">
                <span>Cards still needed to Lv 16</span>
                <span class="${toMax.totalCards > 0 ? 'text-red' : 'text-green'}">${toMax.totalCards > 0 ? '+'+fmtNum(toMax.totalCards) : '✓ Enough cards'}</span>
              </div>
              <div class="flex-between" style="font-size:12px;color:var(--muted)">
                <span>Total gold to Lv 16</span>
                <span style="color:var(--accent)">${fmtNum(toMax.totalGold)} 💰</span>
              </div>
              <button class="btn btn-secondary btn-sm" style="margin-top:8px;width:100%" onclick="openInCalculator(${c.id})">🧮 Open in Calculator</button>
            </div>
          ` : ''}
        </div>`;
    }).join('');

    grid.innerHTML = `
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px">
        ${troops.length} / ${Math.max(_towerTroopTotal, troops.length)} tower troops unlocked

  } catch(e) {
    grid.innerHTML = `<div class="error-msg">${e.message}</div>`;
  }

// Card mastery badges are always named `Mastery<InternalName>`, where the internal
// name is Supercell's code name for the card. Most match the display name, but 27
// don't (MasteryAxeMan is Executioner, MasteryRageBarbarian is Lumberjack, …).
// This map covers every current mismatch; it was derived by cross-referencing live
// badge data against Supercell's internal `sc_key` values published in
// RoyaleAPI/cr-api-data. Anything not listed falls through to a display-name match,
// so newly released cards keep working as long as their internal name matches.
const MASTERY_NAME_OVERRIDES = {
  angrybarbarians: 'Elite Barbarians', archer: 'Archers',        assassin: 'Bandit',
  axeman:          'Executioner',      barblog: 'Barbarian Barrel',
  blowdartgoblin:  'Dart Goblin',      darkmagic: 'Void',        darkwitch: 'Night Witch',
  dartbarrell:     'Flying Machine',   elitearcher: 'Magic Archer',
  firespirits:     'Fire Spirit',      firespirithut: 'Furnace', ghost: 'Royal Ghost',
  giantbuffer:     'Rune Giant',       heal: 'Heal Spirit',      icegolemite: 'Ice Golem',
  icespirits:      'Ice Spirit',       log: 'The Log',           mergemaiden: 'Spirit Empress',
  minisparkys:     'Zappies',          movingcannon: 'Cannon Cart',
  ragebarbarian:   'Lumberjack',       skeletonballoon: 'Skeleton Barrel',
  skeletonwarriors:'Guards',           snowball: 'Giant Snowball',
  witchmother:     'Mother Witch',     zapmachine: 'Sparky'
};
const _normBadgeKey = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g, '');

// Mastery is 3 levels per task set. Most cards have 2 task sets (6 levels); the
// cards below have a 3rd set (9 levels). List from the Card Mastery wiki page,
// verified against 447 live mastery badges: no 2-set card was ever seen above API
// level 7 and no 3-set card above 10 — i.e. the API level runs 1..(levels+1), so
// levels actually completed is level-1. The badge's own maxLevel is a useless
// constant 10 for every card, and `target` never clears for 2-set cards, so neither
// can be used to tell when a mastery is finished.
const MASTERY_THIRD_SET = new Set([
  'Arrows', 'Electro Spirit', 'Fire Spirit', 'Firecracker', 'Mortar', 'Royal Giant',
  'Battle Healer', 'Battle Ram', 'Dart Goblin', 'Earthquake', 'Flying Machine',
  'Hog Rider', 'Mini P.E.K.K.A', 'Musketeer', 'Valkyrie', 'Wizard',
  'Baby Dragon', 'Balloon', 'Bowler', 'P.E.K.K.A', 'Wall Breakers',
  'Electro Wizard', 'Graveyard', 'Mega Knight', 'Princess', 'The Log'
].map(_normBadgeKey));

function _masteryLevelsFor(cardName) {
  return MASTERY_THIRD_SET.has(_normBadgeKey(cardName)) ? 9 : 6;
}

function _isMasteryBadge(badgeName) { return /^Mastery/.test(badgeName || ''); }

// Returns the catalog card a mastery badge belongs to, or null if it can't be
// resolved (e.g. a brand-new card with an internal name we don't know yet).
function _masteryCardFor(badgeName) {
  if (!_isMasteryBadge(badgeName)) return null;
  const key = _normBadgeKey(String(badgeName).slice('Mastery'.length));
  if (!key) return null;
  const override = MASTERY_NAME_OVERRIDES[key];
  if (override) return allCards.find(c => c.name === override) || null;
  return allCards.find(c => _normBadgeKey(c.name) === key) || null;
}

window.setBadgeSort = function(v) { _badgeSort = v; _renderBadgeCards(); };
