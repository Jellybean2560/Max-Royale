<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#e8b84b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Max Royale">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Max Royale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #22223a;
    --surface3: #2a2a45;
    --accent: #e8b84b;
    --accent2: #f4d03f;
    --blue: #4a9eff;
    --green: #2ecc71;
    --red: #e74c3c;
    --purple: #9b59b6;
    --text: #e8e8f0;
    --muted: #888899;
    --border: #33334d;
    --nav-h: 64px;
    --radius: 12px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; overflow: hidden; }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; height: 100%; }
  #content { flex: 1; overflow-y: auto; padding-bottom: var(--nav-h); }
  .screen { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
  .screen.active { display: block; }

  /* ── Bottom Nav ── */
  #nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  /* Icons sit at a fixed height (not centred), so a label that wraps — "Deck
     Upgrade" with six buttons on a phone — doesn't push its icon out of line */
  .nav-btn { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; background: none; border: none; color: var(--muted); font-family: 'Inter', sans-serif; font-size: 11px; line-height: 1.15; text-align: center; cursor: pointer; transition: color .2s; padding: 12px 2px 0; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-btn.icon-box { gap: 6px; }
  .nav-btn.icon-box .icon-wrapper { width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; background: var(--surface2); transition: background .2s, border-color .2s; }
  .nav-btn.active.icon-box .icon-wrapper { background: var(--accent); border-color: var(--accent); }

  /* ── Typography ── */
  h1, h2, h3 { font-family: 'Rajdhani', sans-serif; font-weight: 700; }
  h1 { font-size: 28px; }
  h2 { font-size: 22px; }
  h3 { font-size: 18px; }

  /* ── Cards / Surfaces ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card-sm { background: var(--surface2); border-radius: 8px; padding: 12px; margin-bottom: 8px; }

  /* ── Inputs ── */
  input, select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; padding: 10px 12px; outline: none; transition: border-color .2s; }
  input:focus, select:focus { border-color: var(--accent); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field { margin-bottom: 14px; }

  /* ── Buttons ── */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: 8px; border: none; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .2s, transform .1s; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-secondary { background: var(--surface3); color: var(--text); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-full { width: 100%; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Tags / Badges ── */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge-gold { background: #3d2f00; color: var(--accent); }
  .badge-blue { background: #002244; color: var(--blue); }
  .badge-green { background: #003322; color: var(--green); }
  .badge-red { background: #330011; color: var(--red); }
  .badge-purple { background: #220033; color: var(--purple); }

  /* ── Progress bar ── */
  .progress-wrap { background: var(--surface3); border-radius: 4px; height: 8px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 4px; transition: width .4s; }

  /* ── Tabs ── */
  .tab-bar { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .tab-bar::-webkit-scrollbar { display: none; }
  /* Fades on the edge(s) that have more tabs beyond them — set by updateTabFade() */
  .tab-bar.fade-right { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); }
  .tab-bar.fade-left { -webkit-mask-image: linear-gradient(to right, transparent, #000 36px); mask-image: linear-gradient(to right, transparent, #000 36px); }
  .tab-bar.fade-left.fade-right { -webkit-mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent); }
  /* Profile header + tab bar stay pinned while the tab content scrolls (#content scrolls) */
  .ph-sticky { position: sticky; top: 0; z-index: 40; background: var(--bg); margin-top: -16px; padding-top: 16px; }
  .ph-sticky .ph-head { margin-bottom: 10px; }
  .ph-sticky .tab-bar { margin-bottom: 0; padding-bottom: 10px; }
  .ftab-sticky { position: sticky; z-index: 1; background: var(--bg); margin-left: -16px; margin-right: -16px; padding: 10px 16px; }
  .tab-btn { flex-shrink: 0; padding: 10px 16px; border-radius: 22px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s; white-space: nowrap; }
  .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

  /* ── Divider ── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* ── Stat row ── */
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--muted); font-size: 14px; }
  .stat-value { font-weight: 600; }
  /* Overview numbers that open the matching list (ovGo) */
  .ov-link { cursor: pointer; }
  .ov-link > .stat-label { flex: 1; }
  .ov-link::after { content: '›'; color: var(--muted); font-size: 18px; line-height: 1; margin-left: 8px; }
  .ov-link:active { opacity: .6; }
  /* Battle log day headers */
  .day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 14px 2px 8px; font-size: 13px; }
  .day-head > span:first-child { font-weight: 700; text-transform: uppercase; letter-spacing: .5px; font-size: 12px; }
  .filter-sep { flex-shrink: 0; width: 1px; background: var(--border); margin: 4px 2px; }

  /* ── Loading / Error states ── */
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: var(--red); background: #330011; border: 1px solid var(--red); border-radius: 8px; padding: 12px; margin: 12px 0; font-size: 14px; }
  .empty-msg { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }


  /* ── Calculator ── */
  .calc-result { background: var(--surface2); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
  .calc-result h3 { color: var(--accent); margin-bottom: 12px; }
  .level-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .level-table th { text-align: left; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border); font-weight: 500; }
  .level-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
  .level-table tr:last-child td { border-bottom: none; }
  .level-table .highlight td { color: var(--accent); font-weight: 600; }
  .totals-box { margin-top: 14px; background: var(--surface3); border-radius: 8px; padding: 12px; }

  /* ── Card picker dropdown ── */
  .dropdown-wrap { position: relative; }
  .dropdown-list { position: absolute; top: 100%; left: 0; right: 0; z-index: 200; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; max-height: 200px; overflow-y: auto; display: none; }
  .dropdown-list.open { display: block; }
  .dropdown-item { padding: 9px 12px; cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .dropdown-item:hover { background: var(--surface3); }
  .dropdown-item .rarity-tag { font-size: 11px; color: var(--muted); }

  /* ── Player / Clan lookup ── */
  .lookup-header { background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .player-name { font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; }
  .ph-head { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; }
  .ph-name { background: none; border: none; padding: 0; color: var(--text); font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .ph-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph-caret { font-size: 12px; color: var(--muted); }
  .ph-icon { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 14px; line-height: 1; flex-shrink: 0; }
  .ph-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .ph-updated { white-space: nowrap; }
  /* Slow card and badge art: a soft tile holds its place, then it fades in. Only
     when it's really slow — an image still loading after 150 ms gets the tile, and
     only those fade (.ld-fade) — so art stored on the device appears instantly,
     without a flash, when flicking through tabs. .ld / .ld-fade are set by the
     image load listener in the script. */
  img[loading="lazy"]:not(.ld) { color: transparent; animation: img-wait 1ms .15s forwards; }
  @keyframes img-wait { to { background-color: var(--surface2); border-radius: 6px; } }
  img.ld-fade { animation: img-in .18s ease-out; }
  @keyframes img-in { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { img.ld-fade { animation: none; } }
  .ph-updated.stale { color: var(--accent); }
  /* Compare tab: label | you | them */
  .cmp-row { display: grid; grid-template-columns: minmax(0,1fr) 76px 76px; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; align-items: center; }
  .cmp-row > span:not(:first-child) { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmp-head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .cmp-card { grid-template-columns: 30px minmax(0,1fr) 52px 52px; }
  .cmp-card > span:nth-child(2) { text-align: left; }
  .cmp-card img { width: 30px; height: 36px; object-fit: contain; display: block; }
  .cmp-win { color: var(--green); font-weight: 700; }
  /* Opponent-card matchups */
  .mu-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .mu-row img { width: 26px; height: 32px; object-fit: contain; flex-shrink: 0; }
  .mu-row .mu-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mu-sub { font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 2px; }
  .acct-chip { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 6px 12px; font-size: 13px; font-family: 'Inter', sans-serif; cursor: pointer; }
  .player-tag { color: var(--muted); font-size: 13px; font-family: monospace; }
  .trophies { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); }

  /* ── Card grid ── */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
  .card-item { background: var(--surface2); border-radius: 8px; padding: 10px 8px; text-align: center; border: 1px solid var(--border); }
  .card-item.maxed { border-color: var(--accent); }
  .card-item.upgradable { border-color: var(--green); }
  .card-item .card-name { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.3; }
  .card-item .card-level { font-size: 13px; font-weight: 700; }
  .card-item .card-count { font-size: 11px; color: var(--muted); }

  /* ── Battle log ── */
  .battle-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .battle-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .battle-result { font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 700; }
  .battle-result.win { color: var(--green); }
  .battle-result.loss { color: var(--red); }
  .battle-result.draw { color: var(--muted); }
  .battle-mode { font-size: 12px; color: var(--muted); }
  .battle-crowns { font-size: 13px; }
  .deck-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .deck-card-chip { display: inline-flex; align-items: center; justify-content: center; background: var(--surface3); border-radius: 4px; width: 38px; height: 46px; overflow: hidden; flex-shrink: 0; }
  .deck-card-chip img { width: 100%; height: 100%; object-fit: contain; }
  .deck-card-chip.text-chip { width: auto; height: auto; padding: 3px 7px; font-size: 10px; }
  .deck-list-tile { display: block; border-radius: 4px; overflow: hidden; }
  .deck-list-tile img { width: 100%; height: auto; display: block; }
  .deck-tile { position: relative; }
  .deck-tile.v-evo  { box-shadow: 0 0 0 2px var(--purple); }
  .deck-tile.v-hero { box-shadow: 0 0 0 2px var(--accent); }
  .deck-tile-text { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 9px; color: var(--text); min-height: 46px; padding: 2px; }
  .variant-tag { position: absolute; left: 50%; bottom: 1px; transform: translateX(-50%); font-size: 7px; font-weight: 700; letter-spacing: 0.3px; line-height: 11px; padding: 0 3px; border-radius: 3px; pointer-events: none; }
  .variant-tag.v-evo  { background: var(--purple); color: #fff; }
  .variant-tag.v-hero { background: var(--accent); color: #1a1a2e; }

  /* ── Deck builder ── */
  .deck-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .deck-stats { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .deck-stat { text-align: center; }
  .deck-stat .val { font-size: 20px; font-weight: 700; font-family: 'Rajdhani', sans-serif; }
  .deck-stat .lbl { font-size: 11px; color: var(--muted); }
  .winrate-bar { margin: 8px 0; }

  /* ── Achievements ── */
  .ach-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
  .ach-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .ach-name { font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 700; }
  .ach-stars { color: var(--accent); font-size: 16px; letter-spacing: 2px; }
  .ach-info { font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  /* ── Clan ── */
  .clan-header { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .clan-name { font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; }
  .clan-desc { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .member-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
  .member-name { font-weight: 600; font-size: 14px; }
  .member-role { font-size: 11px; color: var(--muted); text-transform: capitalize; }
  .member-stats { text-align: right; font-size: 13px; }

  /* ── Sort / Filter bar ── */
  .seg { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; background: none; border: none; color: var(--muted); font-family: 'Inter', sans-serif; font-size: 13px; padding: 6px 10px; border-radius: 16px; cursor: pointer; }
  .seg button.active { background: var(--accent); color: #000; font-weight: 600; }
  .filter-bar { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn { flex-shrink: 0; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--muted); font-size: 12px; cursor: pointer; transition: all .2s; white-space: nowrap; }
  .filter-btn.active { background: var(--surface3); color: var(--text); border-color: var(--accent); }
  .switch { appearance: none; -webkit-appearance: none; width: 40px; height: 22px; margin: 0; border-radius: 11px; background: var(--surface3); border: 1px solid var(--border); position: relative; cursor: pointer; flex-shrink: 0; transition: background .2s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
  .switch:checked { background: var(--accent); border-color: var(--accent); }
  .switch:checked::after { transform: translateX(18px); background: #1a1a2e; }

  /* ── Misc ── */
  .flex-row { display: flex; align-items: center; gap: 10px; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .mt8 { margin-top: 8px; }
  .mt16 { margin-top: 16px; }
  .mb8 { margin-bottom: 8px; }
  .text-accent { color: var(--accent); }
  .text-muted { color: var(--muted); }
  .text-green { color: var(--green); }
  .text-red { color: var(--red); }
  .text-blue { color: var(--blue); }
  .monospace { font-family: monospace; }
</style>
</head>
<body>
<div id="app">
  <div id="content">

    <!-- ═══════════════ CALCULATOR ═══════════════ -->
    <div id="screen-calc" class="screen">
      <h2 style="margin-bottom:16px">🧮 Upgrade Calculator</h2>

      <div class="card">
        <div class="field">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <label style="margin:0">Card Lookup</label>
            <button onclick="resetCalculator()" style="background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:14px;padding:3px 10px;font-size:11px;font-family:'Inter',sans-serif;cursor:pointer">↺ Reset</button>
          </div>
          <div class="dropdown-wrap" style="margin-top:6px">
            <input type="text" id="card-search" placeholder="Type card name…" oninput="onCardSearch(this.value)" autocomplete="off">
            <div class="dropdown-list" id="card-dropdown"></div>
          </div>
          <div id="card-lookup-note" style="display:none;font-size:12px;color:var(--accent);margin-top:6px"></div>
        </div>
        <div class="field">
          <label>Rarity</label>
          <select id="calc-rarity">
            <option value="common">Common</option>
            <option value="rare">Rare</option>
            <option value="epic">Epic</option>
            <option value="legendary">Legendary</option>
            <option value="champion">Champion</option>
          </select>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="field">
            <label>Current Level</label>
            <input type="number" id="calc-current" min="1" max="16" value="1" oninput="calcUpdate()">
          </div>
          <div class="field">
            <label>Cards Owned</label>
            <input type="number" id="calc-count" min="0" value="0" oninput="calcUpdate()">
          </div>
        </div>
        <div class="field">
          <label>Target Level</label>
          <input type="number" id="calc-target" min="2" max="16" value="16" oninput="calcUpdate()">
        </div>
      </div>

      <div id="calc-result"></div>
    </div>

    <!-- ═══════════════ PLAYER LOOKUP ═══════════════ -->
    <div id="screen-lookup" class="screen active">
      <!-- Shown only while no profile is on screen: first run, or after a failed
           lookup. Once a profile loads, the tag lives in the Accounts menu. -->
      <div id="lookup-start">
        <div style="text-align:center;padding:36px 0 22px">
          <img src="icon.png" alt="Max Royale" style="width:96px;height:96px;margin-bottom:16px">
          <div style="font-family:'Rajdhani',sans-serif;font-size:34px;font-weight:700;color:var(--accent);letter-spacing:1px">Max Royale</div>
          <div style="font-size:13px;color:var(--muted);margin-top:6px">Enter a player tag to get started</div>
        </div>
        <div class="card">

<script>
// ═══════════════════════════════════════════════
//  UPGRADE DATA
// ═══════════════════════════════════════════════
// Index 0 = upgrade from minLevel to minLevel+1
const LEVEL_DATA = {
  common: [
    {cards:2,    gold:5},      // 1→2
    {cards:4,    gold:20},     // 2→3
    {cards:10,   gold:50},     // 3→4
    {cards:20,   gold:150},    // 4→5
    {cards:50,   gold:400},    // 5→6
    {cards:100,  gold:1000},   // 6→7
    {cards:200,  gold:2000},   // 7→8
    {cards:400,  gold:4000},   // 8→9
    {cards:800,  gold:8000},   // 9→10
    {cards:1000, gold:15000},  // 10→11
    {cards:1500, gold:25000},  // 11→12
    {cards:2500, gold:40000},  // 12→13
    {cards:3500, gold:60000},  // 13→14
    {cards:5500, gold:90000},  // 14→15
    {cards:7500, gold:120000}, // 15→16
  ],
  rare: [
    {cards:2,    gold:50},     // 3→4
    {cards:4,    gold:150},    // 4→5
    {cards:10,   gold:400},    // 5→6
    {cards:20,   gold:1000},   // 6→7
    {cards:50,   gold:2000},   // 7→8
    {cards:100,  gold:4000},   // 8→9
    {cards:200,  gold:8000},   // 9→10
    {cards:300,  gold:15000},  // 10→11
    {cards:400,  gold:25000},  // 11→12
    {cards:550,  gold:40000},  // 12→13
    {cards:750,  gold:60000},  // 13→14
    {cards:1000, gold:90000},  // 14→15
    {cards:1400, gold:120000}, // 15→16
  ],
  epic: [
    {cards:2,   gold:400},     // 6→7
    {cards:4,   gold:2000},    // 7→8
    {cards:10,  gold:4000},    // 8→9
    {cards:20,  gold:8000},    // 9→10
    {cards:30,  gold:15000},   // 10→11
    {cards:50,  gold:25000},   // 11→12
    {cards:70,  gold:40000},   // 12→13
    {cards:100, gold:60000},   // 13→14
    {cards:130, gold:90000},   // 14→15
    {cards:180, gold:120000},  // 15→16
  ],
  legendary: [
    {cards:2,  gold:5000},     // 9→10
    {cards:4,  gold:15000},    // 10→11
    {cards:6,  gold:25000},    // 11→12
    {cards:9,  gold:40000},    // 12→13
    {cards:12, gold:60000},    // 13→14
    {cards:14, gold:90000},    // 14→15
    {cards:20, gold:120000},   // 15→16
  ],
  champion: [
    {cards:2,  gold:25000},    // 11→12
    {cards:5,  gold:40000},    // 12→13
    {cards:8,  gold:60000},    // 13→14
    {cards:11, gold:90000},    // 14→15
    {cards:15, gold:120000},   // 15→16
  ],
};

const XP_DATA = {
  common:    [4,5,6,10,25,50,100,200,400,600,800,1600,2000,50000,200000],
  rare:      [6,10,25,50,100,200,400,600,800,1600,2000,50000,200000],
  epic:      [25,100,200,400,600,800,1600,2000,50000,200000],
  legendary: [250,600,800,1600,2000,50000,200000],
  champion:  [800,1600,2000,50000,200000],
};

const MIN_LEVEL = { common:1, rare:3, epic:6, legendary:9, champion:11 };
const MAX_LEVEL = 16;

// Normalize card counts across rarities so 1 legendary card = its fair share of
// common-card effort. Weight = (total common cards to max) / (total cards of rarity to max).
const _COMMON_TOTAL = LEVEL_DATA.common.reduce((s,x) => s + x.cards, 0);
const RARITY_WEIGHT = Object.fromEntries(
  Object.entries(LEVEL_DATA).map(([r,steps]) => [r, _COMMON_TOTAL / steps.reduce((s,x) => s + x.cards, 0)])
);

// King Tower Level requirements (May 2026 update)
const KTL_REQ = [
  {lvl:2, need:9, min:1},{lvl:3, need:9, min:2},{lvl:4, need:10, min:3},
  {lvl:5, need:10, min:4},{lvl:6, need:10, min:5},{lvl:7, need:10, min:6},
  {lvl:8, need:10, min:7},{lvl:9, need:10, min:8},{lvl:10, need:10, min:9},
  {lvl:11, need:10, min:10},{lvl:12, need:11, min:11},{lvl:13, need:11, min:12},
  {lvl:14, need:12, min:13},{lvl:15, need:13, min:14},{lvl:16, need:14, min:15}
];
function calcKingTowerLevel(dispLevels) {
  let ktl = 1;
  for (const r of KTL_REQ) {
    if (dispLevels.filter(l => l >= r.min).length >= r.need) ktl = r.lvl;
    else break;
  }
  return ktl;
}
function nextCLMilestone(cl) {
  if (cl < 20) return 20;
  if (cl >= 1500) return Math.ceil((cl + 1) / 5) * 5;
  return Math.ceil((cl + 1) / 10) * 10;
}

function toDisplayLevel(rarity, apiLevel) {
  return apiLevel + (MIN_LEVEL[rarity] || 1) - 1;
}

// XP earned so far (sum of XP for all upgrades already done, i.e. minLevel → dispLevel)
function xpEarned(rarity, dispLevel) {
  const xp = XP_DATA[rarity] || [];
  const minL = MIN_LEVEL[rarity] || 1;
  let total = 0;
  for (let i = 0; i < dispLevel - minL && i < xp.length; i++) total += xp[i];
  return total;
}

// XP still available from dispLevel → 16
function xpToMax(rarity, dispLevel) {
  const xp = XP_DATA[rarity] || [];
  const minL = MIN_LEVEL[rarity] || 1;
  let total = 0;
  for (let i = dispLevel - minL; i < xp.length; i++) total += xp[i];
  return total;
}

// Cards still needed (beyond what's owned) to fully upgrade to level 16
function cardsNeededToMax(rarity, dispLevel, ownedCount) {
  const steps = LEVEL_DATA[rarity] || [];
  const minL = MIN_LEVEL[rarity] || 1;
  let needed = 0, remaining = ownedCount;
  for (let lv = dispLevel; lv < MAX_LEVEL; lv++) {
    const idx = lv - minL;
    if (idx < 0 || idx >= steps.length) break;
    const req = steps[idx].cards;
    if (remaining >= req) { remaining -= req; }
    else { needed += req - remaining; remaining = 0; }
  }
  return needed; // 0 = can max right now
}

// ── Shared card list pipeline ──
// The main Cards tab and the friend Cards pane show the same collection with the
// same filters and sorts, so the option lists and the decorate/filter/sort logic
// live here. Each pane keeps its own state and passes it in; adding a sort or a
// filter here reaches both panes at once.
const RARITY_ORDER = { common:0, rare:1, epic:2, legendary:3, champion:4 };

const CARD_SORT_OPTIONS = [
  ['closest-max', 'Closest to Max'], ['level-desc', 'Level ↓'],
  ['level-asc',   'Level ↑'],       ['rarity',     'Rarity']
];
const CARD_RARITY_OPTIONS = [
  ['all','All Rarities'], ['common','Common'], ['rare','Rare'],
  ['epic','Epic'], ['legendary','Legendary'], ['champion','Champion']
];
const DEFAULT_CARD_SORT = CARD_SORT_OPTIONS[0][0];

const _optionsHTML = opts => opts.map(([v,label]) => `<option value="${v}">${label}</option>`).join('');
const cardSortOptionsHTML   = () => _optionsHTML(CARD_SORT_OPTIONS);
const cardRarityOptionsHTML = () => _optionsHTML(CARD_RARITY_OPTIONS);
// The levels this player's cards are at, highest first
const cardLevelOptionsHTML = cards => _optionsHTML([['all', 'All Levels'],
  ...[...new Set((cards || []).map(c => toDisplayLevel((c.rarity || 'common').toLowerCase(), c.level)))]
    .sort((a, b) => b - a).map(l => [String(l), `Level ${l}`])]);

const CARD_STATUS_FILTERS = {
  notfound:   c => !c.owned,
  maxed:      c => c.isMaxed,
  upgradable: c => c.isUpgradable,
  locked:     c => !c.isMaxed && !c.isUpgradable,
  canmax:     c => c.canMax
};

const CARD_SORTS = {
  // "Closest to Max": maxed cards, then cards with enough banked to max right now,
  // then by level — highest first — and within a level by fewest rarity-weighted
  // cards still needed. Level comes before cards because cards alone ignore gold
  // and level-ups: a L12 legendary could rank between L13 champions on a 0.4%
  // difference in its share of cards left, while needing a whole extra level.
  'closest-max': (a,b) => (b.isMaxed - a.isMaxed) || (b.canMax - a.canMax) || (b.disp - a.disp)
                       || (a.normalizedPotential - b.normalizedPotential) || a.name.localeCompare(b.name),
  'level-desc':  (a,b) => b.disp - a.disp,
  'level-asc':   (a,b) => a.disp - b.disp,
  'rarity':      (a,b) => (RARITY_ORDER[b.r]||0) - (RARITY_ORDER[a.r]||0) || b.disp - a.disp
};

// Adds the derived fields the card rows and every sort need: display level, maxed
// /upgradable state, and normalizedPotential (cards still needed to reach level 16,
// weighted so rarities are comparable).
function decorateCard(c) {
  const r = (c.rarity||'common').toLowerCase();
  const disp = toDisplayLevel(r, c.level);
  const steps = LEVEL_DATA[r] || [];
  const idx = disp - (MIN_LEVEL[r] || 1);
  const isMaxed = disp >= MAX_LEVEL || idx >= steps.length;
  const nextStep = (!isMaxed && idx >= 0 && idx < steps.length) ? steps[idx] : null;
  const isUpgradable = !isMaxed && !!nextStep && (c.count||0) >= nextStep.cards;
  const totalCardsNeeded = isMaxed ? 0 : cardsNeededToMax(r, disp, c.count||0);
  return { ...c, r, disp, isMaxed, isUpgradable, nextStep, totalCardsNeeded,
           canMax: !isMaxed && totalCardsNeeded === 0,
           normalizedPotential: totalCardsNeeded * (RARITY_WEIGHT[r] || 1) };
}

const RARITY_COLOR = { common:'var(--text)', rare:'var(--blue)', epic:'var(--purple)', legendary:'var(--accent)', champion:'#e74c3c' };

// Cards the player hasn't unlocked aren't in /players/{tag} at all, so synthesise
// them from the catalog. Treated as level-1 with 0 copies purely so the sorts have
// real numbers to work with — they're pinned to the bottom of the list regardless.
function unownedCardEntries(rawCards) {
  const ownedIds = new Set((rawCards||[]).map(c => c.id));
  return allCards.filter(c => !ownedIds.has(c.id))
    .map(c => ({ ...decorateCard({ ...c, level: 1, count: 0 }), owned: false }));
}

// Greyed-out row for a card the player doesn't have yet, matching how the
// Evolutions and Heroes tabs show locked items.
function unownedCardRowHTML(c) {
  return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;opacity:0.35;filter:grayscale(1)">
    <div class="flex-between">
      <div style="display:flex;align-items:center;gap:10px">
        ${c.iconUrls?.medium ? `<img src="${c.iconUrls.medium}" alt="${esc(c.name)}" style="width:52px;height:64px;object-fit:contain;flex-shrink:0" loading="lazy" decoding="async">` : ''}
        <div>
          <span style="font-weight:600;font-size:15px">${esc(c.name)}</span><br>
          <span style="font-size:11px;color:${RARITY_COLOR[c.r]||'var(--muted)'}">${c.r.charAt(0).toUpperCase()+c.r.slice(1)}</span>
        </div>
      </div>
      <span class="badge">Not unlocked</span>
    </div>
  </div>`;
}

// state: { rarity, level, search, status, sort } — the controls both panes expose.
function prepareCardList(rawCards, state) {
  let cards = (rawCards||[]).map(c => ({ ...decorateCard(c), owned: true }))
    .concat(unownedCardEntries(rawCards));
  if (state.rarity && state.rarity !== 'all') cards = cards.filter(c => c.r === state.rarity);
  if (state.level && state.level !== 'all') cards = cards.filter(c => c.owned && c.disp === +state.level);
  if (state.search) cards = cards.filter(c => (c.name||'').toLowerCase().includes(state.search));
  const statusFilter = CARD_STATUS_FILTERS[state.status];
  if (statusFilter) cards = cards.filter(statusFilter);
  // Unowned cards sit at the bottom under every sort; among themselves they follow
  // the chosen sort like everything else.
  const sort = CARD_SORTS[state.sort];
  if (sort) cards.sort((a,b) => (a.owned === b.owned) ? sort(a,b) : (a.owned ? -1 : 1));
  // The Upgradable filter always orders by normalized potential whatever the sort
  // says — it answers "what should I upgrade next", not "let me browse".
  if (state.status === 'upgradable') cards.sort((a,b) => a.normalizedPotential - b.normalizedPotential);
  return cards;
}

// Builds the maxStarLevel lookup from the /cards catalog so rows show the right
// number of empty stars (e.g. Poison has maxStarLevel 1, not 3).
function catalogStarMaxMap() {
  const m = {};
  allCards.forEach(ac => { if (ac.maxStarLevel) m[ac.id] = ac.maxStarLevel; });
  return m;
}


function computeUpgrade(rarity, currentLevel, currentCount, targetLevel) {
  const data = LEVEL_DATA[rarity];
  const minL = MIN_LEVEL[rarity];
  const results = [];
  let cardsLeft = currentCount;
  let totalCards = 0, totalGold = 0;

  for (let lvl = currentLevel; lvl < targetLevel; lvl++) {
    const idx = lvl - minL;
    if (idx < 0 || idx >= data.length) break;
    const step = data[idx];
    const need = Math.max(0, step.cards - cardsLeft);
    totalCards += need;
    totalGold += step.gold;
    cardsLeft = Math.max(0, cardsLeft - step.cards);
    results.push({ from: lvl, to: lvl + 1, cardsNeeded: need, gold: step.gold, cardsRequired: step.cards });
  }
  return { steps: results, totalCards, totalGold };
}

// ═══════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════
let currentScreen = 'lookup';

// The screens share one scroller (#content), so each remembers its own position —
// otherwise switching screens lands you halfway down the next one.
const _screenScroll = {};
function goTo(name) {
  const sc = document.getElementById('content');
  if (name === currentScreen) {  // re-tapping the active bottom button: back to top
    sc.scrollTop = 0;  // instant — smooth scrolling proved unreliable (see revealTab)
    return;
  }
  _screenScroll[currentScreen] = sc.scrollTop;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  const navBtn = document.getElementById('nav-' + name);
  if (navBtn) navBtn.classList.add('active');
  currentScreen = name;
  if (name === 'calc') { maybeLoadCards(); calcUpdate(); }
  if (name === 'friends') renderFriends();
  if (name === 'deckup') renderDeckUpgradeScreen();
  if (name === 'meta') renderMetaScreen();
  if (name === 'clan') refreshClanIfStale();
  sc.scrollTop = _screenScroll[name] || 0;
}

// Scroll a tab bar sideways so this button is fully visible, clear of the fade
function revealTab(btn) {
  const bar = btn?.parentElement;
  if (!bar) return;
  const b = btn.getBoundingClientRect(), r = bar.getBoundingClientRect(), pad = 40;
  // Instant, not smooth: a smooth scroll can be cancelled or never run (seen in testing)
  if (b.left < r.left + pad) bar.scrollLeft += b.left - r.left - pad;
  else if (b.right > r.right - pad) bar.scrollLeft += b.right - r.right + pad;
  updateTabFade(bar);
}
function updateTabFade(bar) {
  if (!bar) return;
  bar.classList.toggle('fade-left', bar.scrollLeft > 2);
  bar.classList.toggle('fade-right', bar.scrollLeft + bar.clientWidth < bar.scrollWidth - 2);
}
// scroll doesn't bubble, so listen in the capture phase for every tab bar
document.addEventListener('scroll', e => { if (e.target.classList?.contains('tab-bar')) updateTabFade(e.target); }, true);
window.addEventListener('resize', () => document.querySelectorAll('.tab-bar').forEach(updateTabFade));

// Swipe left/right on a profile's content to move to the next/previous tab.
// A clearly horizontal, quick swipe only — and never one that starts in
// something that scrolls sideways itself (the tab bar, mode filters) or a field.
function attachTabSwipe(container, getButtons, activate) {
  let x0 = 0, y0 = 0, t0 = 0, armed = false;
  container.addEventListener('touchstart', e => {
    const t = e.touches[0];
    armed = e.touches.length === 1 && !swipeBlocked(e.target, container);
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
  }, { passive: true });
  container.addEventListener('touchend', e => {
    if (!armed) return;
    armed = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2 || Date.now() - t0 > 700) return;
    const btns = getButtons(), i = btns.findIndex(b => b.classList.contains('active'));
    const next = i < 0 ? null : btns[i + (dx < 0 ? 1 : -1)];
    if (next) activate(next);
  }, { passive: true });
}
function swipeBlocked(el, root) {
  for (let n = el; n && n !== root; n = n.parentElement) {
    if (n.matches?.('input, textarea, select, .tab-bar, .filter-bar')) return true;
    if (n.scrollWidth > n.clientWidth + 2 && /(auto|scroll)/.test(getComputedStyle(n).overflowX)) return true;
  }
  return false;
}

function switchTab(name) {
  // Panes are shown with inline display, not the `active` class. Scoped to
  // [data-tab] — the friend modal's buttons are .tab-btn too (with data-ftab).
  document.querySelectorAll('#player-result .tab-pane').forEach(p => {
    const on = p.id === 'tab-' + name;
    p.classList.toggle('active', on);
    p.style.display = on ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  revealTab(document.querySelector(`.tab-btn[data-tab="${name}"]`));
  // Scrolled down past the header? Show the new tab from its top, header still pinned
  const sc = document.getElementById('content'), pr = document.getElementById('player-result');
  if (sc && pr) {
    const naturalTop = pr.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;
    if (sc.scrollTop > naturalTop) sc.scrollTop = naturalTop;
  }
  // The Cards grid is built here rather than by renderCardsPane(), which only emits
  // the shell. Any path that shows the tab must go through switchTab() — a stray
  // document click listener used to do this, which meant a programmatic tab switch

  if (name === 'cards') renderCards();

  if (name === 'heroes') loadHeroesGrid();
  if (name === 'towerTroops') loadTowerTroopsGrid();

// ═══════════════════════════════════════════════
//  API HELPER
// ═══════════════════════════════════════════════
async function apiGet(path) {
  const cleanPath = path.replace(/#/g, '%23');
  const url = `https://quiet-frost-f9f0.jellevandenwouwer.workers.dev${cleanPath}`;
  let res;
  // The proxy chain (Worker → RoyaleAPI proxy → Supercell) now and then answers
  // a 500 from nginx, 502-504 or Cloudflare's 520-527 for a moment; two quick
  // retries hide that.
  for (let attempt = 0; ; attempt++) {
    try {
      res = await fetch(url);
    } catch(e) {
      throw new Error('Connection failed — check your internet connection and try again.');
    }
    if (res.status < 500 || attempt >= 2) break;
    await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
  }
  if (res.status >= 500)
    throw new Error(`The Clash Royale API isn't responding right now (error ${res.status}). Try again in a moment.`);
  if (!res.ok) {
    const txt = await res.text().catch(() => '');
    let msg = '';
    try { msg = JSON.parse(txt).message; } catch(e) { msg = txt.slice(0, 300); }
    const err = new Error(`API error ${res.status}${msg ? ': ' + msg : ''}`);
    err.status = res.status;
    throw err;
  }
  return res.json();
}
// A lookup's error in words: a 404 means the tag doesn't exist, anything else
// (no connection, API down) says so instead of blaming the tag
function lookupErrorText(e, what, tag) {
  return e.status === 404 ? `No ${what} found with tag ${normalizeTag(tag)}. Check the tag and try again.` : e.message;
}

// Clash Royale tags are uppercase and only use 0289PYLQGRJCUV — never the letter
// O — but people type them in lowercase, with spaces, or with O for 0, and the API
// 404s on all of those.
function normalizeTag(raw) {
  const t = String(raw || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g, '0');
  return t ? '#' + t : '';
}

function fmtNum(n) { return n == null ? '—' : n.toLocaleString(); }

// API timestamps look like 20261012T105805.000Z
function parseApiTime(ts) {
  const y = ts.slice(0,4), mo = ts.slice(4,6), d = ts.slice(6,8);
  const h = ts.slice(9,11), mi = ts.slice(11,13), s = ts.slice(13,15);
  return new Date(`${y}-${mo}-${d}T${h}:${mi}:${s}Z`);
}
function formatBattleTime(ts) {
  if (!ts) return '';
  const date = parseApiTime(ts);
  const diff = Math.floor((Date.now() - date) / 1000);
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

//  CALCULATOR
// ═══════════════════════════════════════════════
let allCards = [];
let _playerCardsById = {};  // populated after a player lookup; used by Card Lookup

// Clash Royale content updates typically land the first Monday of the month.
// Treat the card catalog cache as stale once the first Tuesday of the month
// (the day after) has passed, so new cards/icons picked up automatically
// without needing a manual cache-version bump every release.
function _firstTuesdayOfMonth(year, month) {
  const d = new Date(year, month, 1);
  const offset = (2 - d.getDay() + 7) % 7; // days from the 1st to the first Tuesday
  d.setDate(d.getDate() + offset);
  return d.getTime();
}
function _mostRecentMonthlyCacheCutoff() {
  const now = new Date();
  const thisMonthCutoff = _firstTuesdayOfMonth(now.getFullYear(), now.getMonth());
  if (now.getTime() >= thisMonthCutoff) return thisMonthCutoff;
  // Before this month's first Tuesday — the last real cutoff was last month's.
  const prevMonth = now.getMonth() - 1;
  const y = prevMonth < 0 ? now.getFullYear() - 1 : now.getFullYear();
  return _firstTuesdayOfMonth(y, (prevMonth + 12) % 12);
}

const CARDS_CACHE_KEY = 'cr_cards_cache_v7';

// What the catalog looks like as far as the UI cares: which cards exist, and which
// have hero / evolution art published. Comparing this tells us whether a background
// refresh actually changed anything worth re-rendering for.
function _cardsSignature(items) {
  return items.map(c => `${c.id}:${c.maxEvolutionLevel || 0}${c.iconUrls?.heroMedium ? 'h' : ''}${c.iconUrls?.evolutionMedium ? 'e' : ''}`).join(',');
}

// Whether a catalog card has an evolution / hero form. The catalog's
// maxEvolutionLevel says so (bit 1 = evolution, bit 2 = hero, 3 = both) as soon
// as the form ships, while its art can lag weeks behind — counting by art alone
// left a new evolution out of every count and tab until the picture appeared.
// The art is still accepted, in case a card ever has art but no level.
function hasEvoForm(c)  { return !!((c.maxEvolutionLevel || 0) & 1) || !!c.iconUrls?.evolutionMedium; }
function hasHeroForm(c) { return !!((c.maxEvolutionLevel || 0) & 2) || !!c.iconUrls?.heroMedium; }
// What a player owns, from their card's evolutionLevel — the same bits: 1 =
// evolution, 2 = hero, 3 = both. Checked Oct 2026 across ~500 cards of six
// accounts: evolution-only cards read 1, hero-only 2, the four dual cards 2 or 3.
// (The old rule read dual cards as "evolution only at the max level, hero at
// anything above 0"; it gave the same answers for those four, but would have
// turned an owned evolution into a hero the day an evolution card gains a hero.)
function ownsEvo(pc)  { return !!((pc?.evolutionLevel || 0) & 1); }
function ownsHero(pc) { return !!((pc?.evolutionLevel || 0) & 2); }
// Form art, or the plain card while Supercell hasn't published the form's art yet
const heroImg = c => c.iconUrls?.heroMedium || c.iconUrls?.medium || '';

// Every cache-key bump leaves the previous catalog behind in localStorage. Drop
// them so old versions don't sit there eating quota forever.
try {
  Object.keys(localStorage)
    .filter(k => k.startsWith('cr_cards_cache_') && k !== CARDS_CACHE_KEY)
    .forEach(k => localStorage.removeItem(k));
} catch(e) {}

// How many tower troops exist (the catalog's supportItems), so "found" counts can
// show one as missing; 0 until a catalog with it has loaded
let _towerTroopTotal = 0;
function _storeCards(items, supportItems) {
  allCards = items.sort((a,b) => a.name.localeCompare(b.name));
  _cardsCheckedAt = Date.now();
  if (supportItems?.length) _towerTroopTotal = supportItems.length;
  try { localStorage.setItem(CARDS_CACHE_KEY, JSON.stringify({ items: allCards, supportCount: _towerTroopTotal, savedAt: Date.now() })); } catch(e) {}
}

async function maybeLoadCards() {
  if (allCards.length) return;
  // Try the cached card list first (zero network)
  try {
    const cached = JSON.parse(localStorage.getItem(CARDS_CACHE_KEY) || 'null');
    if (cached && Array.isArray(cached.items) && cached.items.length && cached.savedAt >= _mostRecentMonthlyCacheCutoff()) {
      allCards = cached.items;
      _towerTroopTotal = cached.supportCount || 0;
      revalidateCards(); // may be mid-season stale — see below
      return;
    }
  } catch(e) {}
  try {
    const res = await apiGet('/cards');
    _storeCards(res.items || [], res.supportItems);
  } catch(e) {
    // silent — card picker is optional
  }
}

// The monthly cutoff assumes the catalog only changes on Clash Royale's balance
// Tuesday, but new cards, heroes and evolutions ship mid-season too — a card added
// on the 10th would otherwise stay invisible until the next first Tuesday, showing
// "122 / 122 unlocked" when the game says 123. So a cache hit is served instantly
// (still zero-latency) and refreshed in the background; if the catalog really did
// change, re-render the profile so the counts and new tabs pick it up.
let _cardsRevalidating = false;
let _cardsCheckedAt = 0;  // when the catalog last came from the network
async function revalidateCards() {
  if (_cardsRevalidating) return;
  _cardsRevalidating = true;
  _cardsCheckedAt = Date.now();
  try {
    const res = await apiGet('/cards'), items = res.items || [];
    if (!items.length) return;
    const before = _cardsSignature(allCards) + '/' + _towerTroopTotal;
    _storeCards(items, res.supportItems);
    if (_cardsSignature(allCards) + '/' + _towerTroopTotal !== before) redrawForCatalogChange();
  } catch(e) {
    // Offline or blocked — the cached catalog is still good enough to render.
  } finally {
    _cardsRevalidating = false;
  }
}
// The check above runs when the app starts; an installed app can stay open for
// days, so every profile refresh (manual or the background one) checks again,
// at most once an hour.
const CARDS_RECHECK_MS = 60 * 60 * 1000;
function recheckCardsIfStale() {
  if (allCards.length && Date.now() - _cardsCheckedAt > CARDS_RECHECK_MS) revalidateCards();
}

// Re-render the open profile in place, keeping the user on the tab they were on.
function redrawForCatalogChange() {
  const profile = window._currentProfile;
  if (!profile || !document.getElementById('tab-overview')) return;

function onCardSearch(query) {

function calcUpdate() {
  const rarity = document.getElementById('calc-rarity').value;
  const current = parseInt(document.getElementById('calc-current').value) || 1;
  const count = parseInt(document.getElementById('calc-count').value) || 0;
  const target = parseInt(document.getElementById('calc-target').value) || 16;
  const minL = MIN_LEVEL[rarity];
  const maxL = minL + LEVEL_DATA[rarity].length;

  // Nothing to cost: say so instead of quietly showing a different upgrade
  // (a maxed card used to show 15 → 16, a lower target the next level up)
  if (current >= maxL || Math.min(maxL, target) <= Math.max(minL, current)) {
    document.getElementById('calc-result').innerHTML = `<div class="calc-result"><div class="empty-msg" style="padding:8px 0">${
      current >= maxL ? `✓ Already at the max level (${maxL}) — nothing left to upgrade.` : `Pick a target level above the current level (${Math.max(minL, current)}).`}</div></div>`;
    return;
  }
  const clampedCurrent = Math.max(minL, Math.min(maxL - 1, current));
  const clampedTarget = Math.max(clampedCurrent + 1, Math.min(maxL, target));

  const { steps, totalCards, totalGold } = computeUpgrade(rarity, clampedCurrent, count, clampedTarget);

  const rows = steps.map(s =>
    `<tr>
      <td>${s.from}→${s.to}</td>
      <td>${s.cardsRequired.toLocaleString()}</td>
      <td class="${s.cardsNeeded > 0 ? 'text-red' : 'text-green'}">${s.cardsNeeded > 0 ? '+'+s.cardsNeeded.toLocaleString() : '✓'}</td>
      <td>${s.gold ? s.gold.toLocaleString() : '—'}</td>
    </tr>`
  ).join('');

  // Find the icon for the currently-searched card (regular cards or tower troops)
  const searchName = (document.getElementById('card-search').value || '').trim().toLowerCase();
  let cardIcon = '';
  if (searchName) {
    const cat = allCards.find(c => (c.name||'').toLowerCase() === searchName);
    cardIcon = cat?.iconUrls?.medium
      || Object.values(_playerCardsById).find(c => (c.name||'').toLowerCase() === searchName)?.iconUrls?.medium
      || '';
  }

  const html = `
    <div class="calc-result">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <h3 style="margin:0">Upgrade Path: ${rarity.charAt(0).toUpperCase()+rarity.slice(1)} ${clampedCurrent} → ${clampedTarget}</h3>
        ${cardIcon ? `<img src="${cardIcon}" alt="" style="width:48px;height:58px;object-fit:contain;flex-shrink:0">` : ''}
      </div>
      <table class="level-table">
        <thead><tr><th>Level</th><th>Cards req.</th><th>Need</th><th>Gold</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="totals-box mt8">
        <div class="flex-between">
          <span class="text-muted">Total cards needed</span>
          <strong class="${totalCards > 0 ? 'text-red' : 'text-green'}">${totalCards > 0 ? '+'+totalCards.toLocaleString() : '✓ Enough cards'}</strong>
        </div>
        <div class="flex-between mt8">
          <span class="text-muted">Total gold needed</span>
          <strong class="text-accent">${totalGold.toLocaleString()} 💰</strong>
        </div>
      </div>
    </div>`;

  document.getElementById('calc-result').innerHTML = html;
}

document.getElementById('calc-rarity').addEventListener('change', () => {
  const rarity = document.getElementById('calc-rarity').value;
  const minL = MIN_LEVEL[rarity];
  const maxL = minL + LEVEL_DATA[rarity].length;
  document.getElementById('calc-current').value = minL;
  document.getElementById('calc-target').value = maxL;
  calcUpdate();
});

// ── Backup / restore ──
// Deck history, matchups and suggested friends only exist on this device, so a
// new phone or cleared site data would lose them. A backup is one JSON file of
// those localStorage keys (caches are left out — they refetch); restoring
// replaces them.
const BACKUP_KEYS = ['cr_player_tag', 'cr_saved_accounts', 'cr_friends', 'cr_friends_sort',
                     'cr_deck_history_v1', 'cr_matchups_v1', 'cr_coplayers_v1', 'cr_trophy_history_v1',
                     'cr_progress_v1', 'cr_clan_tools'];
window.exportBackup = function() {
  const data = {};
  BACKUP_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v != null) data[k] = v; });
  const blob = new Blob([JSON.stringify({ app: 'max-royale', version: 1, savedAt: new Date().toISOString(), data })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `max-royale-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
window.importBackup = async function(input) {
  const file = input.files?.[0];
  input.value = '';  // so picking the same file again still fires onchange
  if (!file) return;
  let b = null;
  try { b = JSON.parse(await file.text()); } catch(e) {}
  if (b?.app !== 'max-royale' || !b.data || typeof b.data !== 'object') { alert("That file isn't a Max Royale backup."); return; }
  const when = b.savedAt ? new Date(b.savedAt).toLocaleString() : 'an unknown date';
  if (!confirm(`Restore the backup from ${when}?\n\nThis replaces the accounts, friends and deck history on this device.`)) return;
  BACKUP_KEYS.forEach(k => typeof b.data[k] === 'string' ? localStorage.setItem(k, b.data[k]) : localStorage.removeItem(k));
  document.getElementById('saved-accounts').style.display = 'none';

function compareCardRows(me, them) {

  const mine = lvl(me), theirs = lvl(them);
  const byName = {};
  [...allCards, ...(me.cards || []), ...(them.cards || [])].forEach(c => { if (c.name && !byName[c.name]) byName[c.name] = c; });
  return Object.values(byName).map(c => ({ c, me: mine[c.name] || 0, them: theirs[c.name] || 0 }))

const FRIEND_STATS_MAX_AGE_MS = 15 * 60 * 1000;

  const list = getFriends(), f = list.find(x => x.tag === tag);

async function refreshFriendStats(force = false) {

  if (!due.length) return;
  _friendStatsProgress = { done: 0, total: due.length };
  _renderFriendsList();

    while (due.length) {

  _friendStatsProgress = null;

}

// ── Suggested friends ──
// The API has no friends list, so suggest from who you play WITH: a 2v2
// teammate seen in 2+ games (a random matchmade teammate almost never repeats —
// your real partner does, e.g. 12 of 30), or anyone in a Friendly battle (only
// possible with friends and clanmates). Co-players accumulate per tag in
// localStorage, deduped by battleTime like deck history, so suggestions outgrow
// the ~30-battle window.
const COPLAYERS_KEY = 'cr_coplayers_v1';
const SUGGEST_MIN_TEAMMATE_GAMES = 2;
function loadCoPlayers(tag) {
  try { return JSON.parse(localStorage.getItem(COPLAYERS_KEY) || '{}')[tag] || { seen: [], players: {}, dismissed: [] }; }
  catch(e) { return { seen: [], players: {}, dismissed: [] }; }
}
function saveCoPlayers(tag, entry) {
  try {
    const all = JSON.parse(localStorage.getItem(COPLAYERS_KEY) || '{}');
    all[tag] = entry;
    localStorage.setItem(COPLAYERS_KEY, JSON.stringify(all));
  } catch(e) {}
}
// Head-to-head rides along: per co-player, [wins, losses, draws] against them in
// friendly battles (vs) and next to them in any battle (tm). Those have their own
// dedupe list (hseen), so battles counted for suggestions before results were
// kept still get their result tallied once. Works on any battle log that has
// myTag in it — a friend's log too, which fills in games yours has rolled past.
function recordCoPlayers(myTag, battles) {
  if (!myTag) return;
  const entry = loadCoPlayers(myTag);
  const seen = new Set(entry.seen), hseen = new Set(entry.hseen || []);
  let changed = false;
  (battles || []).forEach(b => {
    if (!b.battleTime || (seen.has(b.battleTime) && hseen.has(b.battleTime))) return;
    const mySide = (b.team || []).some(p => p.tag === myTag) ? (b.team || []) : (b.opponent || []).some(p => p.tag === myTag) ? (b.opponent || []) : null;
    if (!mySide) return;
    const oppSide = (mySide === b.team ? b.opponent : b.team) || [];
    changed = true;
    const isFriendly = /friendly|clanMate|casual/i.test(b.type || '');
    const player = p => {
      const e = entry.players[p.tag] || (entry.players[p.tag] = { name: p.name, mates: 0, friendlies: 0 });
      e.name = p.name; e.clan = p.clan?.name || e.clan || '';
      if (!e.last || b.battleTime > e.last) e.last = b.battleTime;
      return e;
    };
    const others = side => side.filter(p => p.tag && p.tag !== myTag);
    if (!seen.has(b.battleTime)) {
      seen.add(b.battleTime);
      others(mySide).forEach(p => player(p)[isFriendly ? 'friendlies' : 'mates']++);
      if (isFriendly) others(oppSide).forEach(p => player(p).friendlies++);
    }
    if (!hseen.has(b.battleTime)) {
      hseen.add(b.battleTime);
      const mine = mySide[0]?.crowns, theirs = oppSide[0]?.crowns;
      if (mine == null || theirs == null || !oppSide.length) return;  // boat battles: no result
      const r = mine > theirs ? 0 : mine < theirs ? 1 : 2;
      const tally = (p, k) => { const e = player(p); (e[k] || (e[k] = [0, 0, 0]))[r]++; };
      others(mySide).forEach(p => tally(p, 'tm'));
      if (isFriendly) others(oppSide).forEach(p => tally(p, 'vs'));
    }
  });
  if (!changed) return;
  entry.seen = [...seen].slice(-300);
  entry.hseen = [...hseen].slice(-300);
  // Bound growth: random one-off teammates pile up, so keep the 300 most recent
  // (saved friends always stay, with their head-to-head record)
  const friends = new Set(getFriends().map(f => f.tag));
  const tags = Object.keys(entry.players).filter(t => !friends.has(t));
  if (tags.length > 300) {
    tags.sort((a, b) => (entry.players[b].last || '').localeCompare(entry.players[a].last || ''))
        .slice(300).forEach(t => delete entry.players[t]);
  }
  saveCoPlayers(myTag, entry);
}

// The loaded profile's record with a player: { vs, tm, last } or null
function headToHead(tag, coPlayers) {
  const me = window._currentProfile?.data?.tag;

  const e = (coPlayers || loadCoPlayers(me)).players[tag];
  return e && (e.vs || e.tm) ? e : null;
}

// opts.quiet: refresh in place without a spinner, keeping whatever is already on
// screen if the fetch fails. Used by the installed-app auto-refresh.
// Each lookup takes a ticket; a response whose ticket is no longer the latest is
// dropped, so a slow background refresh can't overwrite an account you switched to.
let _loadPlayerSeq = 0;
async function loadPlayer(tagOverride, opts = {}) {
  const tag = normalizeTag(tagOverride || document.getElementById('player-tag').value);
  if (!tag) return;
  const seq = ++_loadPlayerSeq;
  document.getElementById('player-tag').value = tag;
  recheckCardsIfStale();
  const el = document.getElementById('player-result');
  if (!opts.quiet) { el.innerHTML = '<div class="spinner"></div>'; showLookupStart(false); }
  _profileRefreshing = !!opts.quiet;
  updateProfileAge();
  try {
    const [data, battles] = await Promise.all([
      apiGet('/players/' + encodeURIComponent(tag)),
      apiGet('/players/' + encodeURIComponent(tag) + '/battlelog').catch(() => []),
      maybeLoadCards()
    ]);
    if (seq !== _loadPlayerSeq) return;
    _profileRefreshing = false;
    // Saved only once the tag proved real: a mistyped tag must not become the
    // account the app reopens on
    localStorage.setItem('cr_player_tag', data.tag);
    recordMatchups(data.tag, battles);
    recordTrophies(data, battles);
    recordProgress(data);
    if (opts.quiet) renderProfilePreservingView(data, battles);
    else renderProfile(data, battles);
    // Save this account (name + tag) so the user can switch between accounts
    saveAccount(data.tag, data.name);
    // Cache this player's cards (+ tower troops) for the calculator's Card Lookup
    _playerCardsById = {};
    [...(data.cards || []), ...(data.supportCards || [])].forEach(c => {
      _playerCardsById[c.id] = c;
    });
    // Persist the full profile so we can render instantly on next app open
    saveProfileCache(data.tag, data, battles);
    recordCoPlayers(data.tag, battles);
    window._currentProfile = { data, battles, savedAt: Date.now() };
    updateProfileAge();
    syncClanToProfile(data);
  } catch(e) {
    if (seq !== _loadPlayerSeq) return;
    _profileRefreshing = false;
    updateProfileAge();
    // A quiet refresh keeps the profile already on screen — a dropped connection
    // shouldn't replace good data with an error. With no profile showing (it
    // superseded a lookup whose spinner is still up), say what went wrong.
    if (!opts.quiet || !document.getElementById('tab-overview')) {
      const msg = esc(lookupErrorText(e, 'player', tag));
      const prev = window._currentProfile;
      if (prev) {
        // A mistyped tag or a failed refresh: put the profile you had back, with
        // the error above it (tap to dismiss)
        renderProfile(prev.data, prev.battles);
        updateProfileAge();
        el.insertAdjacentHTML('afterbegin', `<div class="error-msg" onclick="this.remove()" style="cursor:pointer;margin-bottom:10px">${msg} <span style="opacity:.6">✕</span></div>`);
      } else {
        el.innerHTML = `<div class="error-msg">${msg}</div>`;
        showLookupStart(true);
      }
    }
  }
}

// The Clan screen follows the loaded profile's clan — unless the user has looked

// shouldn't yank away. fromCache: render the cached clan, no network (app start).
let _profileClanTag = '';
function syncClanToProfile(data, { fromCache = false } = {}) {
  const input = document.getElementById('clan-tag');

// True when launched from the home screen / Chrome's "Install app" rather than as

function isInstalledApp() {

// An installed app is expected to be current when you open it, so refresh the
// cached profile in the background instead of waiting for a Refresh tap. Skipped
// if the cache is younger than this, so app-switching doesn't hammer the API.
const AUTO_REFRESH_MIN_AGE_MS = 2 * 60 * 1000;
let _autoRefreshing = false;
async function autoRefreshProfile() {
  const tag = localStorage.getItem('cr_player_tag');
  if (!tag || _autoRefreshing) return;
  const cached = loadProfileCache(tag);
  if (cached && Date.now() - (cached.savedAt || 0) < AUTO_REFRESH_MIN_AGE_MS) return;
  _autoRefreshing = true;
  try { await loadPlayer(tag, { quiet: true }); } finally { _autoRefreshing = false; }
}

// King level and collection level as the profile header shows them: CL is every
// card's level, +5 per evolution and per hero, plus the tower troops' levels.
function profileLevels(data) {
  const cards = data.cards || [];
  const disp = c => toDisplayLevel((c.rarity||'common').toLowerCase(), c.level);
  const evoIds  = new Set(allCards.filter(hasEvoForm).map(c => c.id));
  const heroIds = new Set(allCards.filter(hasHeroForm).map(c => c.id));
  const evos = cards.filter(c => evoIds.has(c.id) && ownsEvo(c)).length;
  const heroes = cards.filter(c => heroIds.has(c.id) && ownsHero(c)).length;
  const cl = cards.reduce((s, c) => s + disp(c), 0) + evos * 5 + heroes * 5
           + (data.supportCards||[]).reduce((s, c) => s + disp(c), 0);
  return { king: calcKingTowerLevel(cards.map(disp)), cl, evos, heroes };
}

// "updated 12 min ago" at the end of the header's info line, so stale data is
// obvious — a browser tab never refreshes by itself. Turns gold after an hour.
function fmtAgo(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} h ago`;
  const d = Math.floor(h / 24);
  return `${d} day${d > 1 ? 's' : ''} ago`;
}
let _profileRefreshing = false;
function updateProfileAge() {
  const el = document.getElementById('ph-updated');
  if (!el) return;
  const at = window._currentProfile?.savedAt;
  el.classList.remove('stale');
  if (_profileRefreshing) { el.textContent = ' · ↻ updating…'; return; }
  if (!at) { el.textContent = ''; return; }
  el.textContent = ` · updated ${fmtAgo(Date.now() - at)}`;
  el.classList.toggle('stale', Date.now() - at > 60 * 60 * 1000);
  el.title = 'Last refreshed ' + new Date(at).toLocaleString();
}
setInterval(updateProfileAge, 30000);

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Upgrade Planner ──
const RARITY_DISPLAY_NAME = { common:'Common', rare:'Rare', epic:'Epic', legendary:'Legendary', champion:'Champion' };
const RARITY_COLOR_MAP = { common:'var(--text)', rare:'var(--blue)', epic:'var(--purple)', legendary:'var(--accent)', champion:'#e74c3c' };
const RARITY_ORDER_KEYS = ['common','rare','epic','legendary','champion'];
// The profile Overview and the friend modal's Overview each render Suggested
// Upgrades and the Upgrade Planner, and both can be in the DOM at once. Each gets
// its own context — data, decks, selections — and its own element ids, keyed by
// scope ('p' = profile, 'f' = friend), so neither can read or redraw the other.
const _planCtx = {};
function makePlanCtx(scope, data, decks) {
  return (_planCtx[scope] = { scope, data, decks, planMode: 'account', planTarget: MAX_LEVEL, suggestMode: 'account' });
}

function cardsToMaxStats(c, target) {
  const r = (c.rarity||'common').toLowerCase();
  const disp = toDisplayLevel(r, c.level);
  if (disp >= target) return { needed: 0, gold: 0, rarity: r };
  const { totalCards, totalGold } = computeUpgrade(r, disp, c.count||0, target);
  return { needed: totalCards, gold: totalGold, rarity: r };
}
function buildPlanSummary(cards, target) {
  const byR = {};
  RARITY_ORDER_KEYS.forEach(r => byR[r] = { needed: 0, gold: 0 });
  let totalNeeded = 0, totalGold = 0;
  cards.forEach(c => {
    const s = cardsToMaxStats(c, target);
    if (byR[s.rarity]) { byR[s.rarity].needed += s.needed; byR[s.rarity].gold += s.gold; }
    totalNeeded += s.needed; totalGold += s.gold;
  });
  return { byR, totalNeeded, totalGold };
}
// ── Deck history persistence ──
// The battle log only returns the ~25-30 most recent games, so deck win/loss
// totals would otherwise reset every time older battles scroll out of that
// window. We keep a running tally per player tag in localStorage, deduped by
// each battle's battleTime (unique per battle) so re-fetching the same
// overlapping battles on every load never double-counts.
function loadDeckHistory(tag) {
  try {
    const all = JSON.parse(localStorage.getItem('cr_deck_history_v1') || '{}');
    return all[tag] || { decks: {}, seen: [] };
  } catch(e) { return { decks: {}, seen: [] }; }
}
function saveDeckHistory(tag, history) {
  try {
    const all = JSON.parse(localStorage.getItem('cr_deck_history_v1') || '{}');
    all[tag] = history;
    localStorage.setItem('cr_deck_history_v1', JSON.stringify(all));
  } catch(e) {}
}

// persist:false builds the map from these battles alone and saves nothing — for
// friends, whose decks must never land in this device's deck history.
function buildDeckMapFromBattles(battles, playerTag, { persist = true } = {}) {
  const history = persist ? loadDeckHistory(playerTag) : { decks: {}, seen: [] };
  const seen = new Set(history.seen);
  let changed = false;

  (battles||[]).forEach(b => {
    const battleKey = b.battleTime;
    if (!battleKey || seen.has(battleKey)) return;

    const team = (playerTag && (b.team||[]).find(p => p.tag === playerTag)) || (b.team||[])[0] || {};
    if ((team.cards||[]).length !== 8) return; // a real deck is always 8 cards — anything else is a bad/mismatched record (e.g. tag-match fallback picking up the wrong entry)
    const key = deckKeyOf(team.cards);
    const tC = (b.team||[])[0]?.crowns||0, oC = (b.opponent||[])[0]?.crowns||0;
    const result = tC > oC ? 'win' : tC < oC ? 'loss' : 'draw';

    let d = history.decks[key];
    if (!d) {
      // Decks tallied before evo/hero tracking were keyed by card names alone.
      // The first time that card set is played again, it adopts the old tally.
      const legacyKey = team.cards.map(c => c.name).sort().join('|');
      const legacy = legacyKey !== key && history.decks[legacyKey];
      if (legacy && !legacy.variants) { d = legacy; delete history.decks[legacyKey]; }
      else d = { wins:0, losses:0, draws:0, modes:[], elixirSum:0, elixirCount:0 };
      history.decks[key] = d;
    }
    if (!d.variants) {
      // Battles arrive newest-first, so this is the deck as last played. Slot order
      // is kept so evolutions, heroes and champions sit in the first three tiles.
      d.cards = team.cards.map(c => c.name);
      d.variants = deckVariantsOf(team.cards);
    }
    d[result === 'loss' ? 'losses' : result + 's']++;
    if (!d.last || b.battleTime > d.last) d.last = b.battleTime;
    const modeLabel = battleModeLabel(b);
    if (!d.modes.includes(modeLabel)) d.modes.push(modeLabel);
    const avg = (team.cards||[]).reduce((s,c) => s + (c.elixirCost||0), 0) / Math.max((team.cards||[]).length,1);
    d.elixirSum += avg;
    d.elixirCount++;

    seen.add(battleKey);
    changed = true;
  });

  // Decks counted before "last played" was tracked pick it up from whichever
  // battles are still in the log (already-seen ones aren't counted again above)
  (battles||[]).forEach(b => {
    const team = (playerTag && (b.team||[]).find(p => p.tag === playerTag)) || (b.team||[])[0] || {};
    const d = (team.cards||[]).length === 8 && history.decks[deckKeyOf(team.cards)];
    if (d && b.battleTime && (!d.last || b.battleTime > d.last)) { d.last = b.battleTime; changed = true; }
  });

  if (changed && persist) {
    history.seen = [...seen].slice(-300); // bound growth; far more than one battle log window
    saveDeckHistory(playerTag, history);
  }

  const deckMap = {};
  Object.entries(history.decks).forEach(([key, d]) => {
    if ((d.cards||[]).length !== 8) return; // drop any bad entry saved before the 8-card guard existed
    deckMap[key] = {
      key, cards: d.cards, variants: d.variants || {}, wins: d.wins, losses: d.losses, draws: d.draws, modes: d.modes, last: d.last || '',
      elixir: d.elixirCount ? [d.elixirSum / d.elixirCount] : []
    };
  });
  return deckMap;
}
// Most-played decks first. The profile reads (and extends) this device's saved
// deck history; a friend only gets the decks in their current battle log.
function planDeckOptions(data, battles, scope) {
  const dm = buildDeckMapFromBattles(battles || [], data.tag, { persist: scope === 'p' });
  return Object.values(dm).sort((a,b) => (b.wins+b.losses+b.draws) - (a.wins+a.losses+a.draws)).slice(0,8);
}
const planDeckOptionHTML = (d, i) =>
  `<option value="deck-${i}">Deck #${i+1} · ${d.wins}W ${d.losses}L (${d.cards.slice(0,3).map(esc).join(', ')}…)</option>`;

function renderUpgradePlanner(ctx) {
  const { data, decks, scope } = ctx;

  // Detect the lowest display level so the dropdown only shows meaningful targets
  const allDisp = (data.cards||[]).map(c => toDisplayLevel((c.rarity||'common').toLowerCase(), c.level));
  const minDisp = allDisp.length ? Math.min(...allDisp) : 1;
  const lowestTarget = Math.min(minDisp + 1, MAX_LEVEL);

  const selStyle = "flex:1;min-width:0;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center";

      <h3 style="margin-bottom:6px">📈 Upgrade Planner</h3>
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Cards &amp; gold needed by rarity to reach your target level</p>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <select onchange="setPlanMode('${scope}', this.value)" style="${selStyle}">
          <option value="account">Whole account</option>

            .map(lv => `<option value="${lv}">to Lv ${lv}</option>`).join('')}
        </select>
