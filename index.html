      ${rows.slice(0, _metaFormsAll ? rows.length : META_FORMS_SHOWN).map(t => {
        const real = metaRealForms(t), forms = order.map(f => real.find(c => c.form === f)).filter(Boolean);
        return `
        <div style="padding:7px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:5px">
            ${t.card?.iconUrls?.medium ? `<img src="${t.card.iconUrls.medium}" alt="" loading="lazy" decoding="async" style="width:22px;height:27px;object-fit:contain">` : ''}
            <span style="flex:1;min-width:0;font-weight:600">${esc(t.name)}</span>
            <span style="font-size:12px;color:var(--muted)">in ${mPct(t.share)} of decks</span>
          </div>
          <div style="display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden">
            ${forms.map(c => `<span title="${META_FORM_NAME[c.form]}: ${mPct(c.n / t.n, 0)}" style="flex:${c.n};background:${META_FORM_COLOR[c.form]}"></span>`).join('')}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:2px 14px;font-size:11px;color:var(--muted);margin-top:4px">
            ${forms.map(c => `<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:${META_FORM_COLOR[c.form]}"></span>${META_FORM_NAME[c.form]} ${mPct(c.n / t.n, 0)} · <span class="${winCls(c.rate)}" style="font-weight:600">${mPct(c.rate, 0)} win</span></span>`).join('')}
          </div>
        </div>`; }).join('')}
      ${!_metaFormsAll && rows.length > META_FORMS_SHOWN ? `<button class="btn btn-secondary" style="width:100%;margin-top:10px" onclick="metaFormsShowAll()">Show all (${rows.length - META_FORMS_SHOWN} more)</button>` : ''}
    </div>`;
}

// 5 · A card's share of decks over time, from /history (one point a day, each a
// 7-day window, so the line is smoothed)
async function loadMetaHistory() {
  if (_metaHistLoading) return;
  _metaHistLoading = true;
  try {
    _metaHist = await fetchMetaJSON(META_HISTORY_URL, META_HISTORY_CACHE_KEY);
  } catch(e) {
    if (!_metaHist) _metaHist = { error: e.message };
  } finally {
    _metaHistLoading = false;
  }
  if (currentScreen === 'meta' && (_metaView === 'stats' || _metaView === 'decks')) redrawMetaList();
}
function metaTrendsHTML(P, totals) {
  if (!_metaHist) { try { _metaHist = JSON.parse(localStorage.getItem(META_HISTORY_CACHE_KEY) || 'null'); } catch(e) {} }
  if (!_metaHist?.data || Date.now() - (_metaHist.savedAt || 0) > META_MAX_AGE_MS) setTimeout(loadMetaHistory, 0);
  const head = `<div class="mu-sub" style="margin-top:0">Card trends</div>`;
  const days = (_metaHist?.data?.days || []).filter(d => d[1] > 0);
  if (!_metaHist?.data) return `<div class="card">${head}${_metaHist?.error ? `<div class="error-msg">${esc(_metaHist.error)}</div>` : '<div class="spinner"></div>'}</div>`;
  if (days.length < 2) return `<div class="card">${head}<div style="font-size:12px;color:var(--muted)">Trend lines fill in one point a day${days.length ? ` — the first is from ${new Date(days[0][0]).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}` : ''}. Check back tomorrow.</div></div>`;
  // Share of decks per card id per day, forms added up — or its win rate, on the
  // days that have wins (saved from 28 Oct 2026)
  const series = (id, mode = 'share') => days.filter(d => mode === 'share' || d[3]).map(([t, matches, cards, wins]) => {
    let n = 0, w = 0;
    for (const k in cards) if (parseInt(k, 10) === id) { n += cards[k]; w += wins?.[k] || 0; }
    return [t, mode === 'share' ? n / (matches * 2) : w / Math.max(n, 1)];
  });
  const winDays = days.filter(d => d[3]).length;
  const mode = winDays >= 2 ? _metaTrendMode : 'share';
  const choices = totals.filter(t => t.share >= META_ROW_MIN).sort((a, b) => b.share - a.share);
  if (!choices.some(t => t.id === _metaTrendId)) {
    // Start on the card that moved most since the first point
    let best = 0;
    choices.forEach(t => { const s = series(t.id), d = Math.abs(s[s.length - 1][1] - s[0][1]); if (d > best) { best = d; _metaTrendId = t.id; } });
    if (!_metaTrendId && choices[0]) _metaTrendId = choices[0].id;
  }
  const pts = series(_metaTrendId, mode);
  const first = pts[0][1], last = pts[pts.length - 1][1], diff = (last - first) * 100;
  return `
    <div class="card">
      ${head}
      <div class="seg" style="margin-bottom:8px">
        ${[['share', 'Share of decks'], ['win', 'Win rate']].map(([v, l]) => `<button class="${mode === v ? 'active' : ''}" onclick="setMetaTrendMode('${v}')">${l}</button>`).join('')}
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${mode === 'share' ? 'Share of decks a card is in' : 'Win rate of decks with the card'}, one point a day (each the 7 days before it).${mode === 'share' && winDays < 2 ? ' Win rate fills in from 28 Oct.' : ''}</div>
      <select onchange="setMetaTrend(+this.value)" style="${CLAN_SELECT_STYLE};margin-bottom:8px">
        ${choices.map(t => `<option value="${t.id}"${t.id === _metaTrendId ? ' selected' : ''}>${esc(t.name)} · ${mPct(t.share)}</option>`).join('')}
      </select>
      ${metaTrendSVG(pts, mode)}
      <div id="meta-trend-readout" data-idle="" style="font-size:12px;color:var(--muted);margin-top:4px">
        ${mPct(first)} → <b style="color:var(--text)">${mPct(last)}</b>
        <span class="${diff >= 0.5 ? 'text-green' : diff <= -0.5 ? 'text-red' : ''}">(${diff > 0 ? '+' : ''}${diff.toFixed(1)} pts)</span>
        since ${new Date(pts[0][0]).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}
      </div>
    </div>`;
}
function metaTrendSVG(pts, mode = 'share') {
  _metaTrendShown = mode;
  const W = 320, H = 120, L = 34, R = 8, T = 8, B = 18;
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  const pad = Math.max((hi - lo) * 0.15, 0.002); lo = Math.max(0, lo - pad); hi += pad;
  const x = t => L + (t - t0) / Math.max(t1 - t0, 1) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  _metaTrend = pts.map(([t, v]) => [x(t), y(v), t, v]);
  const line = _metaTrend.map(([px, py], i) => `${i ? 'L' : 'M'}${px.toFixed(1)},${py.toFixed(1)}`).join('');
  const day = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;touch-action:pan-y" role="img" aria-label="Card share of decks over time"
         onpointermove="metaTrendHover(event)" onpointerdown="metaTrendHover(event)" onpointerleave="metaTrendHover(null)">
      ${[hi - pad, (hi + lo) / 2, lo + (lo > 0 ? pad : 0)].map(v => `
        <line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
        <text x="${L - 4}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)">${mPct(v)}</text>`).join('')}
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${_metaTrend.map(([px, py]) => `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
      <text x="${L}" y="${H - 4}" font-size="9" fill="var(--muted)">${day(t0)}</text>
      <text x="${W - R}" y="${H - 4}" font-size="9" fill="var(--muted)" text-anchor="end">${day(t1)}</text>
      <circle id="meta-trend-sel" r="5" fill="none" stroke="var(--text)" stroke-width="2" style="display:none"/>
    </svg>`;
}
window.metaTrendHover = function(e) {
  const sel = document.getElementById('meta-trend-sel'), out = document.getElementById('meta-trend-readout');
  if (!sel || !out || !_metaTrend) return;
  if (!out.dataset.idle) out.dataset.idle = out.innerHTML;
  if (!e) { sel.style.display = 'none'; out.innerHTML = out.dataset.idle; return; }
  const svg = e.currentTarget, r = svg.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width * svg.viewBox.baseVal.width;
  const p = _metaTrend.reduce((a, b) => Math.abs(b[0] - px) < Math.abs(a[0] - px) ? b : a);
  sel.setAttribute('cx', p[0]); sel.setAttribute('cy', p[1]); sel.style.display = '';
  out.innerHTML = `<b style="color:var(--text)">${mPct(p[3])}</b> ${_metaTrendShown === 'share' ? 'of decks' : 'win rate'} · 7 days to ${new Date(p[2]).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`;
};
window.setMetaTrend = function(id) { _metaTrendId = id; redrawMetaList(); };
let _metaTrendShown = 'share';
window.setMetaTrendMode = function(v) { _metaTrendMode = v; redrawMetaList(); };

// ── You: the loaded profile's 1v1 deck against the meta, the closest top decks,
// and the most-used top-player cards the player hasn't maxed ──
function metaYouHTML(P) {
  const prof = window._currentProfile, data = prof?.data;
  if (!data) return `<div class="empty-msg">Look up your profile on the Player screen to compare it with the top players.</div>`;
  const deck = data.currentDeck || [];
  const parts = [];
  const keyOf = (id, form) => metaCardOf(id + (form === 'evo' ? 'e' : form === 'hero' ? 'h' : ''));
  let mine = null;
  if (deck.length === 8) {
    const forms = currentDeckVariants(deck, prof.battles, data.tag);
    mine = deck.map((c, i) => keyOf(c.id, forms[i]));
  } else if (deck.length) {
    // currentDeck sometimes comes back a card short: take the latest 1v1 battle
    // deck that holds all the cards it did return
    const b = (prof.battles || []).find(b => (b.team || []).length === 1 && b.team[0].cards?.length === 8
      && deck.every(c => b.team[0].cards.some(x => x.id === c.id)));
    if (b) mine = b.team[0].cards.map(c => keyOf(c.id, cardVariant(c)));
  }
  if (mine) {
    const myKey = mine.map(c => c.key).sort().join(',');
    const byKey = Object.fromEntries(P.cards.map(c => [c.key, c]));
    const exact = P.decks.find(d => d.key === myKey);
    const ordered = metaDeckCards(myKey);
    parts.push(`
      <div class="card">
        <h3 style="margin-bottom:6px">🃏 Your deck</h3>
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${exact
          ? `Top players played this exact deck <b style="color:var(--text)">${fmtNum(exact.n)}</b> times, winning <b class="${exact.rate >= 0.5 ? 'text-green' : 'text-red'}">${Math.round(exact.rate * 100)}%</b>.`
          : `Top players haven't played this exact deck — here's how each card does with them:`}</div>
        ${ordered.map(c => {
          const s = byKey[c.key];
          return `<div class="mu-row">
            ${metaCardImg(c) ? `<img src="${metaCardImg(c)}" alt="" loading="lazy" decoding="async">` : ''}
            <span class="mu-name">${esc(c.name)}${metaFormTag(c.form)}</span>
            ${s ? `<span style="font-size:12px;white-space:nowrap;color:var(--muted)">in ${(s.share * 100).toFixed(1)}%</span>
                   <span class="${s.rate >= 0.52 ? 'text-green' : s.rate <= 0.48 ? 'text-red' : ''}" style="font-weight:700;width:40px;text-align:right">${Math.round(s.rate * 100)}%</span>`
                : `<span style="font-size:12px;color:var(--muted)">not played</span>`}
          </div>`;
        }).join('')}
      </div>`);
    parts.push(metaYourGamesHTML(P, prof, mine, exact), metaSwapsHTML(P, mine), metaYourCountersHTML(data, mine));
    // Closest top decks: most cards in common (forms aside), then most played
    const myIds = new Set(mine.map(c => c.id));
    const close = P.decks.filter(d => d.key !== myKey)
      .map(d => ({ d, shared: d.cards.filter(c => myIds.has(c.id)).length }))
      .filter(x => x.shared >= 4)
      .sort((a, b) => b.shared - a.shared || b.d.n - a.d.n)
      // the same eight cards with other evo/hero picks would repeat the same swap:
      // keep the most played version
      .filter((x, i, all) => all.findIndex(y => y.d.names.slice().sort().join() === x.d.names.slice().sort().join()) === i)
      .slice(0, 3);
    if (close.length) {
      const nameOf = id => metaCardOf(String(id)).name;
      parts.push(`<div class="mu-sub" style="margin:4px 0 8px">Closest top decks</div>` + close.map(({ d, shared }) => {
        const theirIds = new Set(d.cards.map(c => c.id));
        const out = [...myIds].filter(id => !theirIds.has(id)).map(nameOf);
        const inn = d.cards.filter(c => !myIds.has(c.id)).map(c => c.name);
        const swap = out.length ? ` · swap ${out.map(esc).join(', ')} → ${inn.map(esc).join(', ')}` : ' · same cards, other evo/hero choice';
        return metaDeckItemHTML(d, P, `${shared} / 8 cards in common${swap}`);
      }).join(''));
    } else {
      parts.push(`<div style="font-size:12px;color:var(--muted);margin:0 0 12px">No top deck shares 4 or more cards with yours.</div>`);
    }
  } else {
    parts.push(`<div class="empty-msg" style="margin-bottom:12px">The API didn't return your full current deck — play a 1v1 battle with it and it'll show here.</div>`);
  }
  parts.push(bestDecksForYouHTML(P, data, mine));
  parts.push(counterPickHTML(P, data));
  parts.push(deckFinisherHTML(P));
  // Most-used top-player cards (all forms together) you own but haven't maxed
  const share = {};
  P.cards.forEach(c => { share[c.id] = (share[c.id] || 0) + c.share; });
  const owned = Object.fromEntries((data.cards || []).map(c => [c.id, c]));
  const todo = Object.entries(share)
    .map(([id, sh]) => ({ id: +id, sh, pc: owned[id] }))
    .filter(x => x.pc && toDisplayLevel((x.pc.rarity || 'common').toLowerCase(), x.pc.level) < MAX_LEVEL)
    .sort((a, b) => b.sh - a.sh)
    .slice(0, 10);
  if (todo.length) {
    parts.push(`
      <div class="card" style="margin-top:12px">
        <h3 style="margin-bottom:4px">⬆️ Meta cards to upgrade</h3>
        <div style="font-size:12px;color:var(--muted);margin-bottom:6px">The cards top players use most that you haven't maxed. Tap one for the full cost.</div>
        ${todo.map(x => {
          const r = (x.pc.rarity || 'common').toLowerCase(), lvl = toDisplayLevel(r, x.pc.level);
          const cost = computeUpgrade(r, lvl, x.pc.count || 0, MAX_LEVEL);
          const c = metaCardOf(String(x.id));
          return `<div class="mu-row" style="cursor:pointer" onclick="openInCalculator(${x.id})">
            ${c.card?.iconUrls?.medium ? `<img src="${c.card.iconUrls.medium}" alt="" loading="lazy" decoding="async">` : ''}
            <span class="mu-name">${esc(c.name)} <span class="text-muted" style="font-size:11px">· in ${(x.sh * 100).toFixed(0)}%</span></span>
            <span style="font-size:12px;white-space:nowrap">Lv ${lvl}</span>
            <span class="text-accent" style="font-size:12px;white-space:nowrap;min-width:72px;text-align:right">${fmtNum(cost.totalGold)} 💰</span>
          </div>`;
        }).join('')}
      </div>`);
  }
  return parts.join('');
}

// Your games with your deck (same eight cards) from the battle log, against the
// top players' games with it — or with all top decks when they don't play it.
// Tower damage needs ranked games: elsewhere tower HP depends on your levels.
function metaYourGamesHTML(P, prof, mine, exact) {
  const ids = mine.map(c => c.id).sort((a, b) => a - b).join();
  const games = (prof.battles || []).filter(b => b.team?.length === 1 && b.opponent?.length === 1 && b.team[0].cards?.length === 8
    && b.team[0].cards.map(c => c.id).sort((a, b) => a - b).join() === ids);
  if (!games.length) return `<div style="font-size:12px;color:var(--muted);margin:-4px 0 12px">No games with this deck in your battle log to compare yet.</div>`;
  const T = P.towers;
  const fullP = id => T?.princess?.[id];
  const damage = p => {
    const full = fullP(p.supportCards?.[0]?.id);
    if (!T || p.kingTowerHitPoints == null || !full) return null;
    return Math.max(0, T.king - p.kingTowerHitPoints + full - (p.princessTowersHitPoints || []).reduce((a, b) => a + b, 0));
  };
  let wins = 0, three = 0, leak = 0, ln = 0, dealt = 0, taken = 0, hn = 0;
  games.forEach(b => {
    const me = b.team[0], op = b.opponent[0];
    if ((me.crowns || 0) > (op.crowns || 0)) { wins++; if (me.crowns === 3) three++; }
    if (me.elixirLeaked != null) { leak += me.elixirLeaked; ln++; }
    if (b.type === 'pathOfLegend') {
      const dl = damage(op), tk = damage(me);
      if (dl != null && tk != null) { dealt += dl; taken += tk; hn++; }
    }
  });
  // Theirs: the exact deck, else all top decks (games-weighted)
  let top;
  if (exact) top = { rate: exact.rate, three: exact.three / exact.n, dealt: exact.dealt, taken: exact.taken, leak: exact.leak };
  else {
    const sum = (f, wt) => P.decks.reduce((a, d) => a + (f(d) ?? 0) * wt(d), 0);
    const hnAll = P.decks.reduce((a, d) => a + d.hn, 0), nAll = P.decks.reduce((a, d) => a + d.n, 0);
    top = { rate: sum(d => d.rate, d => d.n) / nAll, three: sum(d => d.three, () => 1) / nAll,
            dealt: hnAll ? sum(d => d.dealt, d => d.hn) / hnAll : null, taken: hnAll ? sum(d => d.taken, d => d.hn) / hnAll : null,
            leak: hnAll ? sum(d => d.leak, d => d.hn) / hnAll : null };
  }
  const n = games.length;
  const row = (label, mineV, theirs, fmt, higherBetter) => {
    const cls = mineV == null || theirs == null ? '' : (mineV > theirs) === higherBetter ? 'text-green' : mineV === theirs ? '' : 'text-red';
    return `<div class="mu-row"><span class="mu-name">${label}</span>
        <span class="${cls}" style="font-weight:700;width:64px;text-align:right">${mineV == null ? '—' : fmt(mineV)}</span>
        <span style="color:var(--muted);width:64px;text-align:right">${theirs == null ? '—' : fmt(theirs)}</span></div>`;
  };
  const pct = v => mPct(v, 0), num = v => fmtNum(Math.round(v)), dec = v => v.toFixed(1);
  return `
    <div class="card">
      <h3 style="margin-bottom:4px">📊 Your games with it</h3>
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Your last ${n} game${n === 1 ? '' : 's'} with these eight cards, against ${exact ? 'top players with this exact deck' : 'all top-player decks'}.</div>
      <div style="display:flex;justify-content:flex-end;gap:10px;font-size:11px;color:var(--muted);padding-bottom:3px;border-bottom:1px solid var(--border)"><span style="width:64px;text-align:right">You</span><span style="width:64px;text-align:right">Top players</span></div>
      ${row('Win rate', wins / n, top.rate, pct, true)}
      ${row('3-crown wins', three / n, top.three, pct, true)}
      ${row(`💥 Tower damage dealt${hn ? '' : ' <span class="text-muted" style="font-size:11px">(ranked)</span>'}`, hn ? dealt / hn : null, top.dealt, num, true)}
      ${row('🏰 Tower damage taken', hn ? taken / hn : null, top.taken, num, false)}
      ${row('💧 Elixir leaked', ln ? leak / ln : null, top.leak, dec, false)}
      <div style="font-size:11px;color:var(--muted);margin-top:6px">${hn ? `Tower damage from your ${hn} Path of Legends game${hn === 1 ? '' : 's'}` : 'Tower damage needs Path of Legends games — tower HP elsewhere depends on your levels'}.</div>
    </div>`;
}

// One-card swaps: top decks with seven of your cards, grouped by the card they
// swap (forms aside), against your eight cards' own record when top players run them
const META_SWAP_MIN_GAMES = 20;
function metaSwapsHTML(P, mine) {
  const myIds = new Set(mine.map(c => c.id));
  let bn = 0, bw = 0;
  const swaps = {};
  P.decks.forEach(d => {
    const ids = d.cards.map(c => c.id);
    const inn = ids.filter(id => !myIds.has(id)), out = [...myIds].filter(id => !ids.includes(id));
    if (!inn.length) { bn += d.n; bw += d.w; return; }
    if (inn.length !== 1 || out.length !== 1) return;
    const x = swaps[out[0] + '>' + inn[0]] || (swaps[out[0] + '>' + inn[0]] = { out: out[0], inn: inn[0], n: 0, w: 0, names: d.names });
    x.n += d.n; x.w += d.w;
  });
  const rows = Object.values(swaps).filter(x => x.n >= META_SWAP_MIN_GAMES).sort((a, b) => b.w / b.n - a.w / a.n).slice(0, 6);
  const base = bn >= META_SWAP_MIN_GAMES ? bw / bn : null;
  const head = `<div class="mu-sub" style="margin:4px 0 4px">One-card swaps</div>`;
  if (!rows.length) return head + `<div style="font-size:12px;color:var(--muted);margin:0 0 12px">No top deck with seven of your cards has ${META_SWAP_MIN_GAMES}+ games.</div>`;
  const img = id => { const c = metaCardOf(String(id)); return c.card?.iconUrls?.medium ? `<img src="${c.card.iconUrls.medium}" alt="" loading="lazy" decoding="async" style="width:22px;height:27px;object-fit:contain">` : ''; };
  return head + `
    <div class="card">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Top decks with seven of your cards and one swapped${base != null ? `, against your eight cards' <b class="${winCls(base)}">${mPct(base, 0)}</b> with top players (${fmtNum(bn)} games)` : ''}. Tap one for its decks.</div>
      ${rows.map(x => {
        const r = x.w / x.n, diff = base != null ? (r - base) * 100 : null;
        return `<div class="mu-row" style="cursor:pointer" onclick="metaDecksWith('${esc(x.names.join(', '))}')">
          ${img(x.out)}<span style="color:var(--muted)">→</span>${img(x.inn)}
          <span class="mu-name">${esc(metaCardOf(String(x.out)).name)} → <b>${esc(metaCardOf(String(x.inn)).name)}</b></span>
          <span style="font-size:12px;color:var(--muted);white-space:nowrap">${fmtNum(x.n)}</span>
          <span class="${winCls(r)}" style="font-weight:700;width:38px;text-align:right">${mPct(r, 0)}</span>
          ${diff != null ? `<span class="${diff > 0 ? 'text-green' : 'text-red'}" style="font-size:11px;width:38px;text-align:right">${diff > 0 ? '+' : ''}${diff.toFixed(1)}</span>` : ''}
        </div>`;
      }).join('')}
    </div>`;
}

// Your deck's hardest opponent cards with top players (from /counters, every
// form of your eight cards) next to your own record against them (Opponent Cards)
function metaYourCountersHTML(data, mine) {
  const C = metaCountersMap();
  if (!C) return '';
  const ids = mine.map(c => c.id).sort((a, b) => a - b).join();
  const n = new Array(C.cards.length).fill(0), w = new Array(C.cards.length).fill(0);
  let games = 0;
  for (const key in C.decks) {
    if (key.split(',').map(k => parseInt(k, 10)).sort((a, b) => a - b).join() !== ids) continue;
    const e = C.decks[key];
    e.n.forEach((v, i) => { n[i] += v; w[i] += e.w[i]; });
    games += e.n.reduce((a, b) => a + b, 0) / 8;
  }
  const head = `<div class="mu-sub" style="margin:4px 0 4px">Your deck's hardest matchups</div>`;
  if (games < 20) return head + `<div style="font-size:12px;color:var(--muted);margin:0 0 12px">Top players haven't played your eight cards enough to show its matchups.</div>`;
  const min = Math.max(8, games * 0.04);
  const mu = loadMatchups(data.tag)?.cards || {};
  const rows = C.cards.map((id, i) => ({ c: metaCardOf(String(id)), n: n[i], rate: n[i] ? w[i] / n[i] : 0 }))
    .filter(r => r.n >= min).sort((a, b) => a.rate - b.rate).slice(0, 8);
  return head + `
    <div class="card">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">The opponent cards top players with your eight cards lose to most (${fmtNum(Math.round(games))} games), and your own record against them — over all your decks.</div>
      <div style="display:flex;justify-content:flex-end;gap:10px;font-size:10px;color:var(--muted);padding-bottom:3px;border-bottom:1px solid var(--border)"><span style="width:52px;text-align:right">Top players</span><span style="width:60px;text-align:right">You</span></div>
      ${rows.map(r => {
        const [mw = 0, ml = 0, md = 0] = mu[r.c.name] || [], mn = mw + ml + md;
        return `<div class="mu-row">
          ${r.c.card?.iconUrls?.medium ? `<img src="${r.c.card.iconUrls.medium}" alt="" loading="lazy" decoding="async">` : ''}
          <span class="mu-name">${esc(r.c.name)}</span>
          <span class="${winCls(r.rate)}" style="font-weight:700;width:52px;text-align:right">${mPct(r.rate, 0)}</span>
          <span class="${mn >= 3 ? winCls(mw / mn) : 'text-muted'}" style="width:60px;text-align:right;font-size:12px">${mn >= 3 ? `<b>${mPct(mw / mn, 0)}</b> <span class="text-muted" style="font-size:10px">${mn}</span>` : mn ? `${mw}–${ml}` : '—'}</span>
        </div>`;
      }).join('')}
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Your column: win rate and games, from the battles this device has seen (Battles → Stats → Opponent Cards).</div>
    </div>`;
}

// Top decks you can play best right now: every card unlocked, ranked by the
// evolutions / heroes you're missing, then the gold to bring every card up to
// your level (your current deck's average, floored), then win rate. Only decks
// with META_FIT_MIN_GAMES+ games and a winning record; one per card set.
const META_FIT_MIN_GAMES = 20, META_FIT_SHOWN = 5;

// ── Counter-picks: the opponent cards you lose to most (your Opponent Cards
// record, any deck) and the top decks that beat exactly those cards most often,
// summed over those cards' games in /counters. Decks need COUNTER_MIN_GAMES
// against them; one per card set ──
const COUNTER_PICK_CARDS = 5, COUNTER_MIN_GAMES = 30;
function counterPickHTML(P, data) {
  const head = `<div class="mu-sub" style="margin:4px 0 4px">Decks against your toughest cards</div>`;
  const mu = loadMatchups(data.tag)?.cards || {};
  const byName = Object.fromEntries(allCards.map(c => [c.name, c]));
  const weak = Object.entries(mu).map(([name, r]) => ({ name, r, n: r[0] + r[1] + r[2] }))
    .filter(x => x.n >= MATCHUP_MIN_GAMES && wldRate(x.r) < 0.5 && byName[x.name])
    .sort((a, b) => (b.r[1] - b.r[0]) - (a.r[1] - a.r[0]) || wldRate(a.r) - wldRate(b.r))
    .slice(0, COUNTER_PICK_CARDS);
  if (!weak.length) return head + `<div style="font-size:12px;color:var(--muted);margin:0 0 12px">No opponent card beats you often enough yet — it needs ${MATCHUP_MIN_GAMES}+ games against a card (Battles → Stats → Opponent Cards).</div>`;
  const C = metaCountersMap();
  if (!C) return head + '<div class="spinner" style="margin:8px auto"></div>';
  const idx = weak.map(x => C.cards.indexOf(byName[x.name].id)).filter(i => i >= 0);
  const owned = new Set((data.cards || []).map(c => c.id));
  const byKey = Object.fromEntries(P.decks.map(d => [d.key, d]));
  const picks = Object.entries(C.decks).map(([key, e]) => {
    const n = idx.reduce((s, i) => s + (e.n[i] || 0), 0), w = idx.reduce((s, i) => s + (e.w[i] || 0), 0);
    return { d: byKey[key], n, rate: n ? w / n : 0 };
  }).filter(x => x.d && x.n >= COUNTER_MIN_GAMES)
    .sort((a, b) => b.rate - a.rate || b.n - a.n)
    .filter((x, i, all) => all.findIndex(y => y.d.names.slice().sort().join() === x.d.names.slice().sort().join()) === i)
    .slice(0, META_FIT_SHOWN);
  const art = buildCardArtMap([]);
  const intro = `<div class="card" style="padding:10px 12px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">The cards you lose to most, from your Opponent Cards record:</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${weak.map(x => `<span style="display:flex;align-items:center;gap:4px;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:3px 8px 3px 4px">
        ${art[x.name]?.medium ? `<img src="${art[x.name].medium}" alt="" style="width:18px;height:22px;object-fit:contain">` : ''}${esc(x.name)} <span class="text-red">${x.r[0]}–${x.r[1]}</span></span>`).join('')}</div>
    </div>`;
  if (!picks.length) return head + intro + `<div style="font-size:12px;color:var(--muted);margin:0 0 12px">No top deck has played these cards ${COUNTER_MIN_GAMES}+ times yet.</div>`;
  return head + intro + picks.map(x => {
    const locked = x.d.cards.filter(c => !owned.has(c.id)).length;
    return metaDeckItemHTML(x.d, P, `vs those cards <b class="${x.rate >= 0.5 ? 'text-green' : 'text-red'}">${Math.round(x.rate * 100)}%</b> in ${fmtNum(x.n)} games · ${Math.round(x.d.rate * 100)}% overall`
      + (locked ? ` · <span class="text-red">${locked} card${locked === 1 ? '' : 's'} not unlocked</span>` : ''));
  }).join('');
}

// ── Deck finisher: pick up to 4 cards, get the top-player decks that hold them
// all (any form), ranked by how well your collection fits — cards not unlocked,
// evo / hero forms you lack, then the gold to bring the other cards to your
// picks' level — then win rate. Only the search box's suggestions and the box
// under it redraw, so the input keeps focus ──
const FINISH_MAX = 4;
let _finishIds = [];
function deckFinisherHTML(P) {
  return `<div class="card" style="margin-top:4px">
      <h3 style="margin-bottom:6px">🧩 Deck finisher</h3>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Pick up to ${FINISH_MAX} cards you want to play — the top-player decks with all of them, best fit for your cards first.</div>
      <input type="search" id="finish-search" placeholder="🔍 Add a card…" autocomplete="off" oninput="finishSearch(this.value)"
        style="width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;font-family:'Inter',sans-serif">
      <div id="finish-sugg"></div>
    </div>

function deckFinisherBox(P) {

function bestDecksForYouHTML(P, data, mine) {
  const owned = Object.fromEntries((data.cards || []).map(c => [c.id, c]));
  const lvl = pc => toDisplayLevel((pc.rarity || 'common').toLowerCase(), pc.level);
  const myLevels = (mine || []).map(c => owned[c.id]).filter(Boolean).map(lvl);
  const allLevels = Object.values(owned).map(lvl).sort((a, b) => b - a);
  // Without a current deck: the level of your 8th best card
  const target = myLevels.length ? Math.floor(myLevels.reduce((a, b) => a + b, 0) / myLevels.length) : (allLevels[7] || MIN_LEVEL.common);
  const fits = P.decks
    .filter(d => d.n >= META_FIT_MIN_GAMES && d.rate >= 0.5 && d.cards.every(c => owned[c.id]))
    .map(d => {
      let gold = 0, sum = 0;
      const missing = [];
      d.cards.forEach(c => {
        const pc = owned[c.id], r = (pc.rarity || 'common').toLowerCase(), l = lvl(pc);
        sum += l;
        if (l < target) gold += computeUpgrade(r, l, pc.count || 0, target).totalGold;
        if ((c.form === 'evo' && !ownsEvo(pc)) || (c.form === 'hero' && !ownsHero(pc))) missing.push(c);
      });
      return { d, gold, avg: sum / 8, missing };
    })
    .sort((a, b) => a.missing.length - b.missing.length || a.gold - b.gold || b.d.rate - a.d.rate)
    .filter((x, i, all) => all.findIndex(y => y.d.names.slice().sort().join() === x.d.names.slice().sort().join()) === i)
    .slice(0, META_FIT_SHOWN);
  const head = `<div class="mu-sub" style="margin:4px 0 4px">Best top decks for your cards</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Winning top-player decks (${META_FIT_MIN_GAMES}+ games) you've unlocked every card of, cheapest to bring to level ${target} first — your current deck's level.</div>`;
  if (!fits.length) return head + `<div style="font-size:12px;color:var(--muted);margin:0 0 12px">No winning top deck uses only cards you've unlocked yet.</div>`;
  return head + fits.map(({ d, gold, avg, missing }) => metaDeckItemHTML(d, P,
    `Your avg level ${avg.toFixed(1)} · ${gold ? `<span class="text-accent">${fmtNum(gold)} 💰</span> to get all to ${target}` : `<span class="text-green">all at ${target}+ ✓</span>`}`
    + (missing.length ? ` · <span class="text-red">no ${missing.map(c => `${c.form === 'evo' ? 'Evo' : 'Hero'} ${esc(c.name)}`).join(', ')}</span>` : ''))).join('');
}

// ── Game-mode leaderboards (/leaderboards): many are past seasons of the same
// mode, so per name the highest id — the newest — is kept; unnamed ones are left

const LEADERBOARDS_CACHE_KEY = 'cr_leaderboards_cache';
let _leaderboards = null, _leaderboardsLoading = false;
function loadLeaderboards() {
  if (_leaderboards) return _leaderboards;
  try {
    const c = JSON.parse(localStorage.getItem(LEADERBOARDS_CACHE_KEY) || 'null');
    if (c?.items) {
      _leaderboards = c.items;

async function fetchLeaderboards() {

    const newest = {};

    try { localStorage.setItem(LEADERBOARDS_CACHE_KEY, JSON.stringify({ items: _leaderboards, savedAt: Date.now() })); } catch(e) {}
    if (currentScreen === 'meta' && _metaView === 'players') drawMeta();

// Where the loaded profile stands against the top 1,000 (or a country's board).
// Only Ultimate Champion has a rating (leagueNumber 7); below that, how far there is to go.
function metaYourRankHTML(players, where = 'in the world', board = 'the top 1,000') {
  const d = window._currentProfile?.data;
  if (!d || !players.length) return '';
  const r = d.currentPathOfLegendSeasonResult || {};
  const cutoff = players[players.length - 1][4];
  const box = html => `<div class="card" style="padding:12px;margin-bottom:10px;font-size:13px">${html}</div>`;
  const listed = players.find(p => p[0] === d.tag);
  if (listed) return box(`🏅 <b>${esc(d.name)}</b> is <b class="text-accent">#${fmtNum(listed[3])}</b> ${where} with ⚔️ ${fmtNum(listed[4])}.`);
  if (r.leagueNumber !== 7 || !r.trophies)
    return box(`🏅 <b>${esc(d.name)}</b> is in ${r.leagueNumber ? esc(polLeagueName(r)) : 'no Path of Legends league yet'}. ${board.charAt(0).toUpperCase() + board.slice(1)} starts at ⚔️ <b>${fmtNum(cutoff)}</b> in Ultimate Champion.`);
  const rank = players.filter(p => p[4] > r.trophies).length + 1;
  return box(rank <= players.length
    ? `🏅 With ⚔️ ${fmtNum(r.trophies)}, <b>${esc(d.name)}</b> would be <b class="text-accent">#${fmtNum(rank)}</b> ${where}.`
    : `🏅 <b>${esc(d.name)}</b> has ⚔️ ${fmtNum(r.trophies)}: <b class="text-accent">${fmtNum(cutoff - r.trophies + 1)}</b> short of ${board} (⚔️ ${fmtNum(cutoff)}).`);
}

// Manually remove a deck (and its accumulated win/loss history) from local storage.
// Battles already counted toward it stay marked "seen", so it won't reappear just
// from re-fetching the same recent battle log — only if it's actually played again.
window.deleteDeck = function(scope, key) {
  if (!confirm('Delete this deck and its win/loss history? This can\'t be undone.')) return;
  const st = _deckState[scope]; if (!st) return;
  const history = loadDeckHistory(st.data.tag);
  delete history.decks[key];
  saveDeckHistory(st.data.tag, history);

};

// Open the deck directly in Clash Royale (the "Copy Deck" dialog inside the game)
// via Supercell's official deep-link. Falls back to clipboard if cards can't be resolved.
window.copyDeckLink = function(names, btn) {
  const list = (names||'').split(',').map(s => s.trim()).filter(Boolean);
  const ids = list.map(n => {
    const c = allCards.find(c => c.name === n);
    return c ? c.id : null;
  }).filter(Boolean);
  const origText = btn ? btn.textContent : '';
  const showBriefly = (text) => {
    if (!btn) return;
    btn.textContent = text;
    setTimeout(() => btn.textContent = origText, 1800);
  };
  if (ids.length >= list.length && ids.length > 0) {
    const url = `https://link.clashroyale.com/deck/en?deck=${ids.join(';')}`;
    window.open(url, '_blank');
    showBriefly('✓ Opening…');
  } else {
    // Fallback: copy card names to clipboard if any IDs are unknown
    navigator.clipboard.writeText(names).then(() => showBriefly('✓ Copied (fallback)'));
  }
};

async function refreshClanIfStale() {
  const tag = _clanTag;
  if (!tag || Date.now() - _clanShownAt < CLAN_MAX_AGE_MS) return;
  const seq = ++_loadClanSeq;
  try {
    const data = await apiGet('/clans/' + encodeURIComponent(tag));
    if (seq !== _loadClanSeq || data.tag !== _clanTag) return;
    _clanShownAt = Date.now();
    const sc = document.getElementById('content'), y = sc.scrollTop;
    renderClan(data);
    saveClanCache(tag, data);
    if (currentScreen === 'clan') sc.scrollTop = y;
  } catch(e) {}

  try {

  ['participation', '📋 War participation', "War History: each member's decks used over the last 10 races"],
  ['inactive', '💤 Inactive members', 'Members: marks members away for a while, with a filter'],
];
const WAR_DECKS_PER_DAY = 4, WAR_DECKS_PER_RACE = 16;  // 4 war days a week
function clanTools() {
  try { return JSON.parse(localStorage.getItem(CLAN_TOOLS_KEY) || '{}') || {}; } catch(e) { return {}; }
}
// Inactive members: days away before someone counts as inactive, set by the user
const AWAY_DEFAULT = 3, AWAY_MAX = 180;
const clampAway = v => Number.isFinite(+v) && +v >= 1 ? Math.min(AWAY_MAX, Math.round(+v)) : AWAY_DEFAULT;
const awayAfter = () => clampAway(clanTools().awayAfter);
let _clanToolsOpen = false;
function clanToolsHTML() {
  const on = clanTools(), n = CLAN_TOOLS.filter(([k]) => on[k]).length;
  return `
    <div style="display:flex;justify-content:flex-end;margin:-4px 0 10px">
      <button class="filter-btn ${_clanToolsOpen ? 'active' : ''}" onclick="toggleClanTools()">🛠 Clan tools${n ? ` · ${n} on` : ''} ${_clanToolsOpen ? '▲' : '▼'}</button>
    </div>
    ${_clanToolsOpen ? `<div class="card" style="padding:4px 14px 10px">
      ${CLAN_TOOLS.map(([k, label, desc]) => `
        <label class="stat-row" style="cursor:pointer;gap:12px">
          <span style="min-width:0;flex:1">
            <span style="display:block;color:var(--text);font-weight:600;font-size:14px">${label}</span>
            <span style="font-size:11px;color:var(--muted)">${desc}</span>
          </span>
          <input type="checkbox" class="switch" ${on[k] ? 'checked' : ''} onchange="setClanTool('${k}', this.checked)">
        </label>${k === 'inactive' && on[k] ? `
        <div class="stat-row" style="gap:12px">
          <span style="font-size:13px;color:var(--muted);white-space:nowrap">Inactive after</span>
          <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)">
            <input type="number" inputmode="numeric" min="1" max="${AWAY_MAX}" step="1" value="${awayAfter()}"
              onchange="setClanTool('awayAfter', clampAway(this.value))" onkeydown="if(event.key==='Enter')this.blur()"
              style="width:64px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:13px;font-family:'Inter',sans-serif;text-align:center">
            days away
          </span>
        </div>` : ''}`).join('')}
      <div style="font-size:11px;color:var(--muted);margin-top:8px">Saved on this device, for every clan you look up.</div>
    </div>` : ''}`;
}
window.toggleClanTools = function() {
  _clanToolsOpen = !_clanToolsOpen;
  const el = document.getElementById('clan-tools');
  if (el) el.innerHTML = clanToolsHTML();
};
window.setClanTool = function(k, on) {
  const t = clanTools();
  t[k] = on;
  try { localStorage.setItem(CLAN_TOOLS_KEY, JSON.stringify(t)); } catch(e) {}
  if (k === 'inactive' || k === 'awayAfter') _clanAway = 0;
  const el = document.getElementById('clan-tools');
  if (el) el.innerHTML = clanToolsHTML();
  clanTab(_clanTab);
};

// Members who haven't used all 4 decks today (no race entry = none used)
let _decksLeftText = '';
function decksLeftHTML(ours) {
  const parts = Object.fromEntries((ours?.participants || []).map(p => [p.tag, p]));
  const left = _clanMembers.map(m => ({ name: m.name, tag: m.tag, left: WAR_DECKS_PER_DAY - (parts[m.tag]?.decksUsedToday || 0) }))
    .filter(r => r.left > 0)
    .sort((a, b) => b.left - a.left || a.name.localeCompare(b.name));
  if (!left.length) return `<div class="card"><h3 style="margin-bottom:4px">⏳ Decks Left Today</h3><div class="text-green" style="font-size:13px">✓ Everyone has played all ${WAR_DECKS_PER_DAY} decks today.</div></div>`;
  const decks = left.reduce((s, r) => s + r.left, 0);
  _decksLeftText = `War decks still to play today (${decks}): ` + left.map(r => `${r.name} ${r.left}`).join(', ');
  return `
    <div class="card">
      <div class="flex-between" style="margin-bottom:4px">
        <h3 style="margin:0">⏳ Decks Left Today</h3>
        <button class="btn btn-secondary btn-sm" onclick="copyDecksLeft(this)">📋 Copy list</button>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">${left.length} member${left.length === 1 ? '' : 's'} · ${decks} deck${decks === 1 ? '' : 's'} still to play</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${left.map(r => `<span onclick="viewFriend('${esc(r.tag)}')" style="cursor:pointer;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:4px 10px;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)} <b style="color:${r.left === WAR_DECKS_PER_DAY ? 'var(--red)' : 'var(--accent)'}">${r.left}</b></span>`).join('')}
      </div>
    </div>`;
}
window.copyDecksLeft = function(btn) {
  const done = t => { const o = btn.textContent; btn.textContent = t; setTimeout(() => btn.textContent = o, 1800); };
  navigator.clipboard.writeText(_decksLeftText).then(() => done('✓ Copied'), () => done('Copy failed'));
};

// Each current member over the logged races: decks used out of 16 per race they
// were in (a race lists everyone who was in the clan, played or not)
let _partSort = 'low', _partAll = false;
function participationHTML(log, tag) {
  const stats = {};
  let races = 0;
  log.forEach(race => {
    const mine = (race.standings || []).find(s => s.clan.tag === tag);
    if (!mine) return;
    races++;
    (mine.clan.participants || []).forEach(p => {
      const s = stats[p.tag] || (stats[p.tag] = { races: 0, decks: 0, fame: 0 });
      s.races++; s.decks += p.decksUsed || 0; s.fame += p.fame || 0;
    });
  });
  if (!races) return '';
  const rows = _clanMembers.map(m => {
    const s = stats[m.tag] || { races: 0, decks: 0, fame: 0 };
    return { ...s, name: m.name, tag: m.tag, pct: s.races ? s.decks / (s.races * WAR_DECKS_PER_RACE) : null };
  });
  const dir = _partSort === 'low' ? 1 : -1;
  rows.sort((a, b) => (a.pct == null) - (b.pct == null) || dir * (a.pct - b.pct) || dir * (a.decks - b.decks) || a.name.localeCompare(b.name));
  const shown = _partAll ? rows : rows.slice(0, 10);
  const color = p => p >= 0.9 ? 'var(--green)' : p >= 0.5 ? 'var(--accent)' : 'var(--red)';
  return `
    <div class="card">
      <h3 style="margin-bottom:4px">📋 War Participation</h3>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Decks used in the last ${races} race${races === 1 ? '' : 's'}, out of ${WAR_DECKS_PER_RACE} for each race they were in the clan for</div>
      <div class="seg" style="margin-bottom:6px">
        <button class="${_partSort === 'low' ? 'active' : ''}" onclick="setPartSort('low')">Lowest first</button>
        <button class="${_partSort === 'high' ? 'active' : ''}" onclick="setPartSort('high')">Highest first</button>
      </div>
      ${shown.map(r => `
        <div class="stat-row" onclick="viewFriend('${esc(r.tag)}')" style="cursor:pointer">
          <span class="stat-label" style="min-width:0;flex:1">
            <span style="display:block;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
            <span style="font-size:11px">${r.races ? `🃏 ${r.decks} / ${r.races * WAR_DECKS_PER_RACE} · ${r.races} race${r.races === 1 ? '' : 's'} · ⭐ ${fmtNum(Math.round(r.fame / r.races))} a race` : 'Joined after the last race'}</span>
          </span>
          <span style="font-weight:700;font-size:15px;flex-shrink:0;margin-left:8px;color:${r.pct == null ? 'var(--muted)' : color(r.pct)}">${r.pct == null ? '—' : Math.round(r.pct * 100) + '%'}</span>
        </div>`).join('')}
      ${rows.length > shown.length ? `<button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px" onclick="setPartAll()">Show all ${rows.length}</button>` : ''}
    </div>`;
}
function redrawWarHistory() {
  const war = _clanWar[_clanTag], pane = document.getElementById('clan-pane');
  if (war && pane && _clanTab === 'history') pane.innerHTML = warHistoryHTML(war.log, _clanTag);
}
window.setPartSort = function(v) { _partSort = v; redrawWarHistory(); };
window.setPartAll = function() { _partAll = true; redrawWarHistory(); };

const awayDays = m => m.lastSeen ? (Date.now() - parseApiTime(m.lastSeen).getTime()) / 864e5 : 0;
// All, then the user's threshold and two longer steps (7 → 7+ / 14+ / 28+ days)
const awayFilters = n => [[0, 'All'], [n, `${n}+ day${n > 1 ? 's' : ''} away`], [n * 2, `${n * 2}+ days`], [n * 4, `${n * 4}+ days`]];
function clanAwayBarHTML() {
  return `<div class="filter-bar" style="margin-bottom:10px">
    ${awayFilters(awayAfter()).map(([d, l]) => `<button class="filter-btn ${_clanAway === d ? 'active' : ''}" onclick="setClanAway(${d})">${l} (${d ? _clanMembers.filter(m => awayDays(m) >= d).length : _clanMembers.length})</button>`).join('')}
  </div>`;
}
window.setClanAway = function(d) { _clanAway = d; renderMembers(_clanMembers); };

async function loadClanWar(tag) {
  const c = _clanWar[tag];
  if (c && Date.now() - c.at <= CLAN_WAR_TTL_MS) return c;
  const path = '/clans/' + encodeURIComponent(tag);
  const [race, log] = await Promise.all([
    apiGet(path + '/currentriverrace').catch(() => null),
    apiGet(path + '/riverracelog?limit=10').then(r => r.items || []).catch(() => null)
  ]);
  return (_clanWar[tag] = { race, log, at: Date.now() });
}

// A season's weeks are 7 periods each: 3 training days, then 4 war days.
function raceDayLabel(race) {
  const day = (race.periodIndex || 0) % 7;
  if (race.periodType === 'training') return `Training day ${day + 1}`;
  const kind = race.periodType === 'colosseum' ? 'Colosseum' : 'War';
  return day >= 3 ? `${kind} day ${day - 2}` : kind;
}
const raceFinished = c => c.finishTime && !c.finishTime.startsWith('1969');
const RACE_FINISH_FAME = 10000;

function clanStandingRow(c, rank, ourTag, extra = '', showBar = false) {
  const badge = clanBadgeUrl(c.badgeId);
  const ours = c.tag === ourTag;
  return `<div class="stat-row" style="${ours ? 'background:rgba(232,184,75,0.08);border-radius:8px;padding-left:6px;padding-right:6px' : ''}">
    <span class="stat-label" style="display:flex;align-items:center;gap:8px;min-width:0;flex:1">
      <span style="color:var(--muted);font-size:12px;width:18px">#${rank}</span>
      ${badge ? `<img src="${badge}" alt="" style="width:22px;height:26px;object-fit:contain;flex-shrink:0">` : ''}
      <span style="min-width:0;flex:1">
        <span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${ours ? 'color:var(--accent);font-weight:700' : 'color:var(--text)'}">${esc(c.name)}</span>
        ${showBar ? `<span class="progress-wrap" style="display:block;margin-top:4px"><span class="progress-bar" style="display:block;width:${Math.min(100, Math.round((c.fame||0) / RACE_FINISH_FAME * 100))}%;background:var(--accent)"></span></span>` : ''}
      </span>
    </span>
    <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;flex-shrink:0;margin-left:8px">
      <span class="text-accent" style="font-weight:600">${raceFinished(c) ? '🏁 ' : ''}${fmtNum(c.fame)} fame</span>${extra}
    </span>
  </div>`;
}

// ── Forecast: where each clan ends today and when it finishes ──
// During a war day `fame` is the boat's progress at the start of the day and
// `periodPoints` the medals earned so far today; at the end of the day the
// clans are ranked by medals, get placement progress (3000 / 1800 / … — read
// from periodLogs) plus defense progress, and a clan finishes at 10,000.
// periodLogs holds every finished day of this race and last week's: a clan's
// expected day is its average day this week, else last week's.
const RACE_DAY_PLACES = [3000, 1800, 1000, 600, 400];
const RACE_MAX_DECKS = 50 * WAR_DECKS_PER_DAY;
const RACE_DECK_MEDALS = 175;  // a guess for a clan with no decks played yet today
function raceForecast(race) {
  const dayIdx = (race.periodIndex || 0) % 7, weekStart = (race.periodIndex || 0) - dayIdx;
  const logs = race.periodLogs || [];
  const thisWeek = logs.filter(l => l.periodIndex >= weekStart);
  const places = [...RACE_DAY_PLACES];
  const recent = [...logs].sort((a, b) => b.periodIndex - a.periodIndex)[0];
  (recent?.items || []).forEach(i => { if (i.pointsEarned && i.progressEarned && i.endOfDayRank < places.length) places[i.endOfDayRank] = i.progressEarned; });
  const clans = race.clans.map(c => {
    const pick = (thisWeek.length ? thisWeek : logs).map(l => l.items.find(i => i.clan?.tag === c.tag)).filter(Boolean);
    const avg = f => pick.length ? pick.reduce((s, i) => s + f(i), 0) / pick.length : null;
    const decks = (c.participants || []).reduce((s, p) => s + (p.decksUsedToday || 0), 0);
    const today = c.periodPoints || 0;
    const perDeck = decks ? today / decks : RACE_DECK_MEDALS;
    const avgDay = avg(i => i.pointsEarned);
    const expected = Math.min(Math.max(today, avgDay ?? today), today + (RACE_MAX_DECKS - decks) * perDeck);
    return { c, decks, today, perDeck, expected, defense: avg(i => i.progressEndOfDay - i.progressStartOfDay - i.progressEarned) || 0,
      dayProgress: avg(i => i.progressEndOfDay - i.progressStartOfDay), finished: raceFinished(c) };
  });
  // Today's placement by expected medals, then the remaining days at each clan's average
  [...clans].sort((a, b) => b.expected - a.expected).forEach((x, i) => {
    x.place = i;
    x.placePts = x.expected > 0 ? places[i] : 0;  // a clan that plays no decks gets no placement
    x.endToday = x.finished ? RACE_FINISH_FAME : Math.min(RACE_FINISH_FAME, (x.c.fame || 0) + x.placePts + x.defense);
    x.finishDay = x.finished ? 0 : x.endToday >= RACE_FINISH_FAME ? dayIdx - 2 : null;
    let p = x.endToday;
    for (let d = dayIdx + 1; d <= 6 && x.finishDay == null; d++) {
      p += x.dayProgress ?? x.placePts + x.defense;
      if (p >= RACE_FINISH_FAME) x.finishDay = d - 2;
    }
    x.endWeek = Math.min(RACE_FINISH_FAME, p);
  });
  return { clans, dayIdx };
}
function raceForecastHTML(race, tag) {
  const isColosseum = race.periodType === 'colosseum';
  const { clans, dayIdx } = raceForecast(race);
  const ours = clans.find(x => x.c.tag === tag);
  const byToday = [...clans].sort((a, b) => b.today - a.today);
  // Decks to pass the clan just ahead today, at our medals per deck so far
  let pass = '';
  if (ours) {
    const i = byToday.indexOf(ours), ahead = byToday[i - 1];
    const left = Math.max(0, _clanMembers.length * WAR_DECKS_PER_DAY - ours.decks);
    if (!ahead) pass = `🥇 <b>${esc(ours.c.name)}</b> leads today${byToday[1] ? ` by ${fmtNum(ours.today - byToday[1].today)} medals` : ''}.`;
    else {
      const need = Math.ceil((ahead.today - ours.today + 1) / Math.max(ours.perDeck, 1));
      pass = `⚔️ <b>${fmtNum(need)}</b> more deck${need === 1 ? '' : 's'} (at ~${fmtNum(Math.round(ours.perDeck))} medals each) would pass <b>${esc(ahead.c.name)}</b> today`
        + ` — ${fmtNum(left)} left in the clan${need > left ? ', <span class="text-red">not enough on its own</span>' : ''}.`;
    }
  }
  const order = isColosseum ? byToday
    : [...clans].sort((a, b) => (a.finishDay ?? 99) - (b.finishDay ?? 99) || b.endWeek - a.endWeek || b.expected - a.expected);
  const lastDay = 4, today = dayIdx - 2;
  const finishText = x => x.finished ? '<span class="text-green">🏁 finished</span>'
    : x.finishDay == null ? `<span class="text-muted">~${fmtNum(Math.round(x.endWeek))} by day ${lastDay}</span>`
    : `<span class="text-accent">🏁 ${x.finishDay === today ? 'today' : x.finishDay === today + 1 ? 'tomorrow' : `day ${x.finishDay}`}</span>`;
  return `
    <div class="card">
      <h3 style="margin-bottom:6px">📈 Forecast</h3>
      ${pass ? `<div style="font-size:13px;margin-bottom:8px">${pass}</div>` : ''}
      ${order.map(x => `<div class="stat-row" style="${x === ours ? 'background:rgba(232,184,75,0.08);border-radius:8px;padding-left:6px;padding-right:6px' : ''}">
        <span class="stat-label" style="min-width:0;flex:1">
          <span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${x === ours ? 'color:var(--accent);font-weight:700' : 'color:var(--text)'}">${esc(x.c.name)}</span>
          <span style="font-size:11px">Today ${fmtNum(x.today)} medals · ${x.decks} deck${x.decks === 1 ? '' : 's'} · ~${fmtNum(Math.round(x.expected / 100) * 100)} expected</span>
        </span>
        <span style="font-size:12px;flex-shrink:0;margin-left:8px;text-align:right">${isColosseum ? `#${byToday.indexOf(x) + 1} today` : finishText(x)}</span>
      </div>`).join('')}
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Expected: medals so far today or the clan's average war day${isColosseum ? '' : ' this race (else last week), placed by that; later days at its average boat progress'} — a guide, not a promise.</div>
    </div>`;
}

function riverRaceHTML(race, tag) {
  if (!race) return '<div class="empty-msg">River Race data isn\'t available for this clan right now.</div>';
  if (!race.clans?.length) return '<div class="empty-msg">This clan isn\'t in a River Race right now.</div>';
  const isColosseum = race.periodType === 'colosseum';
  // Finished clans first (in finishing order), then by fame
  const standings = [...race.clans].sort((a,b) =>
    (raceFinished(b) - raceFinished(a)) || (raceFinished(a) && a.finishTime.localeCompare(b.finishTime)) || (b.fame||0) - (a.fame||0));
  const ours = race.clans.find(c => c.tag === tag) || race.clan;
  return `
    ${clanTools().decksLeft && race.periodType !== 'training' ? decksLeftHTML(ours) : ''}
    <div class="card">
      <div class="flex-between" style="margin-bottom:6px">
        <h3 style="margin:0">⛵ River Race</h3>
        <span style="font-size:12px;color:var(--muted)">Week ${(race.sectionIndex||0) + 1} · ${raceDayLabel(race)}</span>
      </div>
      ${standings.map((c, i) => c.tag === tag ? clanStandingRow(c, i + 1, tag, '', !isColosseum) : `
        <div onclick="toggleCardMax('rival-${i}')" style="cursor:pointer" title="Scout this clan">${clanStandingRow(c, i + 1, tag, `<span id="rival-${i}-toggle" data-closed="▼" data-open="▲" style="font-size:10px;color:var(--muted)">▼</span>`, !isColosseum)}</div>
        <div id="rival-${i}-max" style="display:none">${rivalScoutHTML(c, race)}</div>`).join('')}
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Tap another clan to scout it.</div>
      ${!isColosseum ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">The race finishes at ${fmtNum(RACE_FINISH_FAME)} fame.</div>` : ''}
    </div>
    ${race.periodType !== 'training' && (race.periodIndex || 0) % 7 >= 3 ? raceForecastHTML(race, tag) : ''}
    <div class="card">
      <h3 style="margin-bottom:6px">🃏 Member Attacks</h3>
      <div id="war-members">${warMembersHTML(ours, race)}</div>
    </div>`;
}

// A rival clan in the race: its war decks today and this week, from its race
// participants (members who haven't played have no entry, so "of N" is only
// those seen), its top attackers and a button into its Clan screen
function rivalScoutHTML(c, race) {
  // The list also holds past members with nothing played; only players who attacked count
  const parts = (c.participants || []).filter(p => p.decksUsed > 0 || p.fame > 0);
  const today = parts.reduce((s, p) => s + (p.decksUsedToday || 0), 0);
  const attacked = parts.filter(p => p.decksUsedToday > 0).length;
  const week = parts.reduce((s, p) => s + (p.decksUsed || 0), 0);
  const warDay = race.periodType !== 'training' && (race.periodIndex || 0) % 7 >= 3;
  const top = [...parts].sort((a, b) => (b.fame || 0) - (a.fame || 0)).slice(0, 5);
  return `<div style="margin:2px 0 8px;padding:8px 10px;background:var(--surface2);border-radius:10px;font-size:12px">
    ${warDay ? ovRow('Decks used today', `${fmtNum(today)} <span class="text-muted">· ${attacked} player${attacked === 1 ? '' : 's'}${c.periodPoints && today ? ` · ~${fmtNum(Math.round(c.periodPoints / today))} medals each` : ''}</span>`) : ''}
    ${ovRow('Decks this week', `${fmtNum(week)} <span class="text-muted">· ${parts.length} player${parts.length === 1 ? '' : 's'} took part</span>`)}
    ${top.length ? `<div style="margin:6px 0 2px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px">Top attackers</div>
    ${top.map(p => `<div class="stat-row" style="cursor:pointer" onclick="event.stopPropagation();viewFriend('${esc(p.tag)}')">
      <span class="stat-label" style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${esc(p.name)}</span>
      <span style="flex-shrink:0;margin-left:8px">⭐ ${fmtNum(p.fame || 0)}${warDay ? ` · <span style="color:${p.decksUsedToday >= 4 ? 'var(--green)' : p.decksUsedToday ? 'var(--accent)' : 'var(--red)'}">${p.decksUsedToday || 0}/4</span>` : ''}</span>
    </div>`).join('')}` : ''}
    <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;justify-content:center" onclick="event.stopPropagation();openClanWar('${esc(c.tag)}')">🛡 Open ${esc(c.name)}</button>
  </div>`;
}

// Current members joined with their race entries — a member who hasn't played
// yet has no entry at all, which means zero decks, not "unknown".
function warMembersHTML(ours, race) {
  const parts = Object.fromEntries((ours?.participants || []).map(p => [p.tag, p]));
  const zero = { fame: 0, decksUsed: 0, decksUsedToday: 0, boatAttacks: 0 };
  const rows = _clanMembers.map(m => ({ ...zero, ...(parts[m.tag] || {}), name: m.name, tag: m.tag, role: m.role }));
  const attacked = rows.filter(r => r.decksUsedToday > 0).length;
  const decksToday = rows.reduce((s, r) => s + (r.decksUsedToday || 0), 0);
  const sorts = {
    today: (a,b) => a.decksUsedToday - b.decksUsedToday || a.name.localeCompare(b.name),
    fame:  (a,b) => b.fame - a.fame || a.name.localeCompare(b.name),
    week:  (a,b) => b.decksUsed - a.decksUsed || a.name.localeCompare(b.name)
  };
  rows.sort(sorts[_warSort] || sorts.today);
  const todayColor = n => n >= 4 ? 'var(--green)' : n > 0 ? 'var(--accent)' : 'var(--red)';
  return `
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${attacked} / ${rows.length} members attacked today · ${decksToday} / ${rows.length * 4} decks used</div>
    <select onchange="setWarSort(this.value)" style="${CLAN_SELECT_STYLE};margin-bottom:8px">
      ${[['today','Sort: Decks left today'],['fame','Sort: Fame'],['week','Sort: Decks this week']].map(([v,l]) =>
        `<option value="${v}"${_warSort===v?' selected':''}>${l}</option>`).join('')}
    </select>
    ${rows.map(r => `
      <div class="stat-row" onclick="viewFriend('${esc(r.tag)}')" style="cursor:pointer">
        <span class="stat-label" style="min-width:0;flex:1">
          <span style="display:block;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
          <span style="font-size:11px">🃏 ${r.decksUsed} this week · ⭐ ${fmtNum(r.fame)} fame${r.boatAttacks ? ` · ⛵ ${r.boatAttacks}` : ''}</span>
        </span>
        <span style="font-weight:700;font-size:15px;color:${todayColor(r.decksUsedToday)};flex-shrink:0;margin-left:8px">${r.decksUsedToday}/4</span>
      </div>`).join('')}`;
}
window.setWarSort = function(v) {
  _warSort = v;
  const war = _clanWar[_clanTag], el = document.getElementById('war-members');
  if (!war?.race || !el) return;
  el.innerHTML = warMembersHTML(war.race.clans.find(c => c.tag === _clanTag) || war.race.clan, war.race);
};

// ── War MVPs: current members by average fame per race they played, over the
// races in the log, with the last 3 races against the ones before ──
const MVP_SHOWN = 10;
let _mvpAll = false;
function warMvpHTML(log, tag) {
  const members = new Map(_clanMembers.map(m => [m.tag, m]));
  const per = {};
  log.forEach((race, ri) => {
    const mine = (race.standings || []).find(s => s.clan.tag === tag);
    (mine?.clan.participants || []).forEach(p => {
      if (!members.has(p.tag) || !(p.decksUsed || p.fame)) return;
      const e = per[p.tag] || (per[p.tag] = { tag: p.tag, name: p.name, races: [] });
      e.races.push({ ri, fame: p.fame || 0, decks: p.decksUsed || 0 });
    });
  });
  const avg = list => list.length ? list.reduce((s, r) => s + r.fame, 0) / list.length : null;
  const rows = Object.values(per).map(e => {
    const recent = e.races.filter(r => r.ri < 3), older = e.races.filter(r => r.ri >= 3);
    return { ...e, avg: avg(e.races), perDeck: e.races.reduce((s, r) => s + r.fame, 0) / Math.max(e.races.reduce((s, r) => s + r.decks, 0), 1),
      trend: recent.length && older.length ? avg(recent) - avg(older) : null };
  }).sort((a, b) => b.avg - a.avg);
  if (!rows.length) return '';
  const shown = _mvpAll ? rows : rows.slice(0, MVP_SHOWN);
  const rising = rows.filter(r => r.trend > 0).sort((a, b) => b.trend - a.trend)[0];
  return `<div class="card">
      <h3 style="margin-bottom:6px">🏅 War MVPs <span style="font-weight:400;font-size:12px;color:var(--muted)">· last ${log.length} races</span></h3>
      ${rising && rising.trend >= 100 ? `<div style="font-size:12px;margin-bottom:6px">📈 Most improved: <b>${esc(rising.name)}</b> <span class="text-green">+${fmtNum(Math.round(rising.trend))}</span> fame a race lately</div>` : ''}
      ${shown.map((r, i) => `<div class="stat-row" style="cursor:pointer" onclick="viewFriend('${esc(r.tag)}')">
        <span class="stat-label" style="min-width:0;flex:1">
          <span style="display:block;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span class="text-muted" style="font-size:12px;font-weight:400">#${i + 1}</span> ${i < 3 ? ['🥇', '🥈', '🥉'][i] + ' ' : ''}${esc(r.name)}</span>
          <span style="font-size:11px">${r.races.length} race${r.races.length === 1 ? '' : 's'} · ~${fmtNum(Math.round(r.perDeck))} a deck${r.trend != null ? ` · <span class="${r.trend >= 0 ? 'text-green' : 'text-red'}">${r.trend >= 0 ? '▲' : '▼'} ${fmtNum(Math.abs(Math.round(r.trend)))}</span> lately` : ''}</span>
        </span>
        <span class="text-accent" style="font-weight:700;flex-shrink:0;margin-left:8px">⭐ ${fmtNum(Math.round(r.avg))}</span>
      </div>`).join('')}
      ${rows.length > MVP_SHOWN ? `<button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;justify-content:center" onclick="_mvpAll=!_mvpAll;clanTab('history')">${_mvpAll ? 'Show less' : `Show all ${rows.length}`}</button>` : ''}
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Average fame per race played · current members · "lately" = the last 3 races against the ones before</div>
    </div>`;
}

function warHistoryHTML(log, tag) {
  if (!log) return '<div class="empty-msg">War history isn\'t available for this clan right now.</div>';
  if (!log.length) return '<div class="empty-msg">No finished River Races yet.</div>';
  const memberTags = new Set(_clanMembers.map(m => m.tag));
  return (clanTools().participation ? participationHTML(log, tag) : '') + warMvpHTML(log, tag) + log.map((race, i) => {
    const standings = [...(race.standings || [])].sort((a,b) => a.rank - b.rank);
    const mine = standings.find(s => s.clan.tag === tag);
    if (!mine) return '';
    const date = race.createdDate ? parseApiTime(race.createdDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
    const tc = mine.trophyChange || 0;
    const id = `war-hist-${i}`;
    const parts = [...(mine.clan.participants || [])].filter(p => p.fame || p.decksUsed).sort((a,b) => b.fame - a.fame);
    return `
      <div class="card" style="padding:12px">
        <div class="flex-between">
          <div>
            <div style="font-weight:700">Week ${(race.sectionIndex||0) + 1} · Season ${race.seasonId}</div>
            <div style="font-size:12px;color:var(--muted)">${date} · ⭐ ${fmtNum(mine.clan.fame)} fame</div>
          </div>
          <div style="text-align:right">
            <div style="font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700">#${mine.rank}</div>
            <div class="${tc >= 0 ? 'text-green' : 'text-red'}" style="font-size:12px">${tc >= 0 ? '+' : ''}${tc} 🏆</div>
          </div>
        </div>
        <div onclick="toggleCardMax('${id}')" style="cursor:pointer;margin-top:8px;padding-top:6px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);text-align:center;user-select:none">
          <span id="${id}-toggle" data-closed="▼ Standings & members" data-open="▲ Hide">▼ Standings &amp; members</span>
        </div>
        <div id="${id}-max" style="display:none;margin-top:8px">
          ${standings.map(s => clanStandingRow(s.clan, s.rank, tag,
            `<span class="${(s.trophyChange||0) >= 0 ? 'text-green' : 'text-red'}" style="font-size:11px">${(s.trophyChange||0) >= 0 ? '+' : ''}${s.trophyChange||0} 🏆</span>`)).join('')}
          <div style="margin:12px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Members (${parts.length})</div>
          ${parts.length ? parts.map(p => `
            <div class="stat-row">
              <span class="stat-label" style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${memberTags.has(p.tag) ? 'color:var(--text)' : ''}">${esc(p.name)}${memberTags.has(p.tag) ? '' : ' <span style="font-size:10px">(left)</span>'}</span>
              <span style="font-size:12px;flex-shrink:0;margin-left:8px">🃏 ${p.decksUsed} · <span class="text-accent">⭐ ${fmtNum(p.fame)}</span></span>
            </div>`).join('') : '<div class="empty-msg">Nobody played this week.</div>'}
        </div>
      </div>`;
  }).join('');
}

window.setClanSort = function(by) {
  _clanSort = by;
  renderMembers(_clanMembers);
};

function renderMembers(members) {
  const list = document.getElementById('clan-members-list');
  const bar = document.getElementById('clan-away-bar');  // there when the Inactive members tool is on
  if (bar) bar.innerHTML = clanAwayBarHTML();
  const shown = bar && _clanAway ? members.filter(m => awayDays(m) >= _clanAway) : members;
  if (list) list.innerHTML = shown.length ? memberRowsHTML(shown, _clanSort, '', !!bar)
    : `<div class="empty-msg">Nobody has been away ${_clanAway}+ days.</div>`;
}
// highlightTag: the player whose profile this list was opened from; markAway
// tags members not seen for 3+ days (the Inactive members clan tool)
function memberRowsHTML(members, sort, highlightTag = '', markAway = false) {
  const sorted = [...members];
  if (sort === 'trophies') sorted.sort((a,b) => (b.trophies||0) - (a.trophies||0));
  else if (sort === 'donations') sorted.sort((a,b) => (b.donations||0) - (a.donations||0));
  else if (sort === 'lastseen') {
    // lastSeen is a lexicographically-sortable timestamp; most recent first
    sorted.sort((a,b) => (b.lastSeen||'').localeCompare(a.lastSeen||''));
  } else sorted.sort((a,b) => (a.clanRank||99) - (b.clanRank||99));

  const roleLabel = { leader:'👑 Leader', coLeader:'⭐ Co-Leader', elder:'🔰 Elder', member:'Member' };
  const html = sorted.map((m,i) => {
    // Rank movement arrow (previousClanRank vs clanRank; 0 = new this season)
    let move = '';
    const prev = m.previousClanRank || 0, cur = m.clanRank || 0;
    if (prev === 0) move = '<span style="color:var(--blue)" title="New">●</span>';
    else if (prev > cur) move = `<span style="color:var(--green)" title="Up ${prev-cur}">▲</span>`;
    else if (prev < cur) move = `<span style="color:var(--red)" title="Down ${cur-prev}">▼</span>`;
    else move = '<span style="color:var(--muted)">–</span>';
    const seen = formatBattleTime(m.lastSeen);
    const away = markAway ? Math.floor(awayDays(m)) : 0, after = markAway ? awayAfter() : 0;
    return `
    <div class="member-item" onclick="viewFriend('${esc(m.tag)}')" style="cursor:pointer${m.tag === highlightTag ? ';border-color:var(--accent)' : ''}">
      <div>
        <div class="member-name"><span style="color:var(--muted);font-size:12px">#${cur}</span> ${move} ${esc(m.name)}${markAway && away >= after ? ` <span class="badge" style="font-size:10px;padding:1px 6px;background:${away >= after * 2 ? 'rgba(231,76,60,.15)' : '#3d2f00'};color:${away >= after * 2 ? 'var(--red)' : 'var(--accent)'}">💤 ${away}d</span>` : ''}</div>
        <div class="member-role">${roleLabel[m.role]||m.role} · ${m.tag}</div>
        ${seen ? `<div style="color:var(--muted);font-size:11px;margin-top:2px">🕓 ${seen}</div>` : ''}
      </div>
      <div class="member-stats">
        <div>🏆 ${fmtNum(m.trophies)}</div>
        <div style="color:var(--muted);font-size:12px">${fmtNum(m.donations)} donations</div>
        <div style="color:var(--blue);font-size:11px;margin-top:2px">View profile →</div>
      </div>
    </div>`;
  }).join('');
  return html;
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
restoreSavedTag();
calcUpdate();
// Restore last-used player tag into the input
let _startup = Promise.resolve();  // resolves once the startup profile is on screen
const _savedTag = localStorage.getItem('cr_player_tag');
if (_savedTag) {
  document.getElementById('player-tag').value = _savedTag;
  // Auto-render the saved profile from cache (no network). In a browser tab that's
  // the final word until the user taps Refresh; installed as an app we then refresh
  // in the background.
  const _cachedProfile = loadProfileCache(_savedTag);
  if (_cachedProfile) {
    _startup = maybeLoadCards().then(() => {
      renderProfileFromCache(_cachedProfile);
      if (isInstalledApp()) autoRefreshProfile();
    });
  } else if (isInstalledApp()) {
    _startup = loadPlayer(_savedTag);  // nothing cached to show — just load it
  }
}
_startup.then(() => { takeStartScreen(); takeSharedDeck(); });

// Android keeps an installed app alive in the background, so reopening it usually
// resumes this page rather than reloading it. Refresh on foreground too, otherwise
// "open the app" would only refresh on a genuine cold start.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isInstalledApp()) autoRefreshProfile();
});
renderSavedAccounts();

attachTabSwipe(document.getElementById('player-result'),
  () => [...document.querySelectorAll('#player-result .tab-btn[data-tab]')], b => switchTab(b.dataset.tab));
attachTabSwipe(document.getElementById('friend-modal-body'),
  () => [...document.querySelectorAll('#friend-modal-body .tab-btn[data-ftab]')], b => friendTab(b.dataset.ftab));

// Images: mark them loaded (ends the placeholder, starts the fade-in), and tell
// the service worker when a stored card/badge image fails to display — it can't
// see download errors itself (see sw.js), so it drops that copy and the next
// view fetches it again, e.g. evolution art Supercell published late.
// load / error don't bubble, so listen in the capture phase.
const SW_IMG_HOSTS = /^https:\/\/(api-assets\.clashroyale\.com|raw\.githubusercontent\.com)\//;
document.addEventListener('load', e => {
  const img = e.target;
  if (img.tagName !== 'IMG') return;
  // The placeholder tile only shows once an image has waited 150 ms (img-wait):
  // fade in just those, so stored images don't flash
  const waited = img.loading === 'lazy' && getComputedStyle(img).backgroundColor !== 'rgba(0, 0, 0, 0)';
  img.classList.add('ld');
  if (waited) img.classList.add('ld-fade');
}, true);
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName !== 'IMG') return;
  img.classList.add('ld');
  if (SW_IMG_HOSTS.test(img.src)) navigator.serviceWorker?.controller?.postMessage({ type: 'img-broken', url: img.src });
}, true);
// Ask the browser not to evict stored data (images, deck history) under storage
// pressure; installed apps usually get this granted without a prompt.
try { navigator.storage?.persist?.().catch(() => {}); } catch(e) {}

// Register service worker for PWA (standalone fullscreen install)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
