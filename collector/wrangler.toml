name = "max-royale-meta"
main = "src/index.js"
compatibility_date = "2026-10-01"

# One tick a minute; each tick does one job (see src/index.js)
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "max-royale-meta"
database_id = "83db5505-795b-4d7c-bc0f-e02dd74ef43d"

# The app's API proxy Worker, which holds the Clash Royale key — called through
# a service binding, so this Worker never needs the key itself
[[services]]
binding = "CR"
service = "quiet-frost-f9f0"

# A copy of every served stats JSON (/meta, /top, /history, /counters, /war,
# /seasons, /season), outside D1: served when D1 refuses (its daily limits), see
# backup() in src/index.js. KV's free plan: 1,000 writes and 100k reads a day.
[[kv_namespaces]]
binding = "BACKUP"
id = "0ea8c43fcc584ac4883b2b85fb099940"

[observability]
enabled = true

# "1" pauses collection: scheduled runs return before touching D1
[vars]
PAUSED = "0"
